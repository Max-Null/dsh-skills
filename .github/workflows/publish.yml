# 发布 @max-null/dsh-skills 到 npm。
#
# 这个仓是纯 skill 数据包：没有 TS 源码、没有 tsconfig，脚本只有 prepack 与 test，
# 所以步骤比标准版少两步（不跑 typecheck、不跑 build），只做 install → test → publish。
#
# 只开 workflow_dispatch —— 发布的控制点保持在「人主动触发一次」。
# 凭据来自 OIDC（npm 侧的 Trusted Publisher 绑定本仓 + 本 workflow）。
name: publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只跑测试，不发布'
        type: boolean
        default: false

jobs:
  publish:
    # 钉版本而不是 ubuntu-latest：2026-10-19 起 latest 迁到 Ubuntu 26。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          # Trusted Publishing 要求 npm >= 11.5.1，Node 24 起自带。
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 本仓测试是 node --test（不是 vitest）。
      - run: pnpm test

      # prepack 会在 publish 时清掉 __pycache__。
      - name: publish
        if: ${{ inputs.dry-run != true }}
        run: npm publish --provenance --access public
