测试**，且只在 `push tag v*` 或手动触发——**推分支根本不触发**。\n\n因此正文的第一原则反转为：\n\n> **本仓库没有任何本地基线，也没有 CI 兜底——你选的检查就是这次改动仅有的证据。**\n\n随之调整的还有「全量本地排练」的阈值：因为**没有 CI 会在推送后替你发现问题**，触及壳/内核边界或同时改多个插件时，倾向按全量排练处理。\n\n**保留**（判据一字未减）：\n\n- 三条核心：**最窄的、会因该回归失败的测试**；**不要因为 commit 或 push 在即就重复已通过的检查**；**`--force-with-lease=\u003cbranch>:\u003cobserved-oid>`，raw `--force` 永不允许**。\n- 「全量本地排练」仅在三种情况下的判断（用户显式要求 / 诊断 CI 失败 / 改动横跨全仓）。\n- 失败处理：**停下并修复或解释阻塞，不要\"推上去然后指望 CI 结果不同\"**；环境特定失败的完整证明流程。\n- 重写后重新抓取 head 并重新审计评审线程、批准、可合并性、检查。\n- **mergeability 诊断**（`no checks reported` + `total_count: 0` 时先读 `mergeable`/`mergeStateStatus`）——并标注其适用边界：本仓库无 `pull_request` 工作流，该诊断只适用于给 DSH 或第三方提 PR 时。\n\n**本地化**：\n\n- 基准确认：上游的 `change-scope` 在本仓库不存在，改为 `git diff --stat \u003cverified-base>..HEAD`，并**显式声明它不是范围报告的等价物**；基准候选是本仓库的 19 个 release tag。\n- 8 类具体检查全部换成本地域（属主测试、`lib/` 派生、截图基线、`profile-template/`、`cordis.patch.yml` 等）。\n- 推送第 2 步的「pre-commit 修复器」改为「格式化或生成步骤」。\n\n**新增**：\n\n- **操作前提**：本仓库根目录**没有 `package.json`**，npm 命令须在 `shell/` 下执行。\n- **两条与覆盖率无关的禁令**（救回自被删的二级小节）：**测试选择与覆盖率选择是两件事**；**不要用\"没有测试\"的开关、降低阈值或缩小覆盖面来掩盖一个未覆盖的受影响文件**。\n\n**删除**：\n\n- `gh stack push` / `gh stack sync` 相关内容与二级小节 `### Post-sync validation` 整节（本仓库不用 GitHub stacks）。\n- 二级小节 `### Focus unit coverage on the affected source`（本仓库无覆盖率配置）——其两条通用禁令已救回并写入正文。\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/dsh-pre-push-checks/`\n2. 若该目录有变动，对照本文件「与上游的差异」逐条重判。\n3. 更新本文件的版本锚点与适配日期。\n"},{"file":"skills/ssid-prose-standard/SKILL.md","group":"skills","date":"","slug":"SKILL","title":"SSiD 行文标准","tags":["ssid-prose-standard","ssid-trim-cot-leakage"],"summary":"在撰写、评审、恢复、修剪或审计本仓库的中文或英文行文时使用——包括判断 Markdown、JSDoc、代码与测试注释、提示词、诊断信息、CLI 与界面字符串里哪些内容必需、哪些属于推理记录；","bytes":9402,"lines":99,"body":"\n# SSiD 行文标准\n\n**写够以保住契约，然后删掉推理记录、重复与装饰。**\n\n**契约**是调用方、被调方、实现者、生产者或消费者所依赖的**义务、不变量、前置条件、后置条件或兼容承诺**。\n\n**REQUIRED BACKGROUND：** `ssid-trim-cot-leakage` 负责**查找与修复**推理痕迹；本 skill 负责判断**每处该保留什么**。两者同批安装。\n\n`contract`、`boundary`、`shape`、`surface`、`seam`、`gate`、`vocabulary` 是**用前要检查的词，不是禁词**——先问\"更精确的规则 / API / 字段集 / 类型 / 验证点 / 时序点 / 组件切分 / 失败状态，能不能更好地陈述这个事实\"。对照：契约 / 边界 / 表面 / 接缝 / 门禁 / 词汇表。\n\n**注释描述代码表达不了的非显然契约或理由，不复述代码已经蕴含的东西。**\n\n## 输入与排除\n\n**要求显式 `scope`。缺失就报告所需输入并停止**——不要自行推断全仓库范围，也不要开始访谈。\n\n接受 `mode: automatic | interactive`，默认 automatic；只在用户显式要求提问或校准时进入交互模式。**`mode` 控制提问，不控制写入权**：审阅与审计任务报告发现而不编辑；显式要求写入、修复或修剪的任务才应用明确改动。\n\n**始终排除 `vendor/`**（`shell/profile-template/vendor/` 与各插件的 vendor 位），即使是全仓库范围；不要跟随符号链接进入。\n\n同时排除**同步链的冻结副本**：`references/`、与三处 vendor **逐文件全等**的 `plugins/` 副本、`_archived-*` 目录——**改这些地方会破坏同步链**（手册 §10）。\n\n**派生物先改 owner 再重新生成**：`lib/`（由 `src/` + tsdown 生成）与 `shell/profile-template/`（由源同步）。\n\n**变更叙事在本仓库有六个合法载体**：`docs/release-notes-*.md`、`docs/决策/`、`docs/设计/`、`docs/排查/`、`shell/docs/pitfalls.md`，以及任何 skill 目录下的 **`SOURCE.md`**——在那里它是**内容本体**，不是泄漏。修剪默认不进入这些路径。\n\n## 保住完整命题\n\n编辑前先识别段落的**每一个命题**，逐个保住：\n\n- actor 与 action；\n- 条件、时序与顺序；\n- 情态（must / may / never）；\n- 否定性保证与例外；\n- 归属、副作用、失败模式与后果。\n\n**只在每条事实子句都存活、且结果更清楚时才删形容词、重复与叙事。字数变少本身不是改进。**\n\n三条附属规则：\n\n- 在**使用点保留完整的局部契约**（行为、失败、归属、后果）。\n- **一个解释只有一个 home**；架构、理由、算法、历史与扩展示例**激进外链**。\n- **非显然理由**在\"省掉它可能导致误用或错误简化\"时必须保留。\n\n## 按位置规定必需覆盖\n\n**这不是单向缩短**：当代码、类型与结构没有传达下列契约时，要**补写**。\n\n| # | 位置 | 必需覆盖 |\n|---:|---|---|\n| 1 | **公开 JSDoc** | 调用方可见的返回值区别、抛出或拒绝、副作用、归属、时序、取消、持久性 |\n| 2 | **内部注释** | 非局部结构与显然复杂的局部结构：不变量、竞态顺序、归属、安全边界、意外失败行为；**诊断信息**（点名失败的主体或路径、违反的规则、纠正方式）。删除控制流叙述与代码复述 |\n| 3 | **模块注释** | 模块的角色、依赖、职责与非显然的架构选择；架构选择链接到属主解释 |\n| 4 | **测试** | 只解释非显然的测试设计——为什么需要某个 fixture、断言、平台适配、真实入口路径或间接观测。**删除逐步讲解与清单** |\n| 5 | **README** | 消费者契约：配置、语义、失败、限制、扩展点、模型可见影响；含**使用文档**（前置条件、必需操作、真实入口、可观察验证、简明警示）。保留持久缺口与维护者陷阱，不是日常清理清单 |\n| 6 | **决策记录** | 独有的理由、机制、备选方案、后果、已交付的验证证据、点名的覆盖空白。已交付的记录用**现在时**陈述现实；删除规划清单，保留钉住决策的证据 |\n| 7 | **排查记录** | 事故序列、证据、因果链、影响与预防。删除重复的说服、以及不建立因果的实现细节 |\n| 8 | **skill 与 agent 指令** | 行为护栏与**显式 scope 限制**（如\"这是指导，不是脚本\"）；保持工作流简洁并**链接其权威来源** |\n| 9 | **示例与配置注释** | 访问限制、非显然的接线或加载顺序、安全立场、重放行为、例外与可能的误用。不要叙述配置本身已经展示的内容 |\n| 10 | **提示词与可见字符串** | **措辞即行为**。文案与无障碍名称、tooltip、placeholder、格式模板**一起看**；改前确认有属主行为证据，没有就保持不变并报告延后 |\n\n**#8 在本仓库尤其要紧**：`skills/` 下有 14 个 skill，本包的每一份也属这一类。\n\n保留可搜索的机制名与有意义的情态、时序或否定强调；只归一化装饰性强调。\n\n## 工作流\n\n1. 确认 scope、mode、当前分支或基线、适用的 `AGENTS.md`。\n2. 读 `docs/SSiD开发手册.md` 与属主代码或文档，再判断段落。\n3. **检查请求范围，而不只看最大的文件**——用搜索与字数找候选，然后**语义判断**。\n4. 把每处候选分类为 **keep / add / trim / restore / restructure / defer**。只在任务授权编辑时应用明确改动；**不要为了满足删除指标而制造编辑**。\n5. **先改 owner，再改派生物**；学到新规则后回头复查类似段落。\n6. 跑窄范围检查：`npm run typecheck`（shell）或各插件 `pnpm typecheck`，加受影响的 L1 测试；界面字符串改动跑 `verify-zh-ui.cjs`；`git diff --check`。\n7. **报告检查范围、明确改动、有意保留、延后项、实际跑过的检查。**\n\n## 边界情形\n\n1. **只有当至少两个版本都满足完整命题规则、且交换的是已接受的原则时，才算边界情形**——一个有唯一保命题答案的改写不是边界情形。\n2. automatic 模式下**直接应用明确编辑**，只报告真正的边界情形，**不提问**；**不得为了让进度而弱化命题**。\n3. interactive 模式下按治理原则**归组同类段落**，给 2–3 个可行版本、推荐一个、说明事实或结构差异；**不给劣质干扰项**。呈现渠道是**会话内回复**。\n\n## 事实核对：跑，不要假设\n\n**行文陈述的是产品今天的行为，而操作类断言的唯一可采信证据是你真的跑过它。** 每条新文档、以及每一段声称操作、命令、默认值、错误或平台差异的新段落，都适用。\n\n1. **对每条声称的操作，对着当前 checkout 真跑一遍。** 执行文档将展示的每个命令、配置片段、示例的**原样**版本；**只写下你观察到的**，包括确切输出、警告与失败模式。若某断言依赖你没有的密钥或网络，**说明这一点并点名验证属主，而不是断言其行为**。\n2. **删掉你无法复现的东西**——**绝不**把命令、字段、默认值或行为从**记忆、类比或邻居包的 README** 搬过来。**当一条断言无法复现时，修那条断言——而不是修测试。**\n3. **对着最新代码检查旧文档。** 修订既有文字之前先对照当前源码；**一句陈旧的陈述仍然是错的**——要对着代码改，不是对着旧散文改。\n4. **分类主题再写安装指引。** **读事实，不要读文件夹名**：看 `package.json` 的声明与入口文件的形态，而不是目录名暗示的类型。\n\n## 语气规则\n\n1. **开篇说的是主题能做什么。** 开篇 Summary 与用户向小节描述用户或 agent **能用它做什么**——结果、收益、何时选用、主要代价——**绝不是它的角色、类型或内部身份**。\"这个插件注册 `ctx.x` 并追加 `x/event` 记录\"是身份叙述；\"你可以每条消息存一条笔记，重启后还在\"才是它做什么。\n2. **开发者小节解释，绝不枚举。** 折叠的实现内容覆盖整体设计概念、架构与数据流——**足够了理解它怎么工作**——并**链接代码**取确切细节；**不做完整 API 目录、穷举式字段清单、事件负载枚举或 JSDoc 复述**。\n3. **草稿只有一个家。** 半成品想法、草稿、未定方向、实测产物与工作假设**只**出现在末尾并**显式标注非权威**；**其他每一节都是打磨过的当前状态散文**。\n4. **只讲当前状态。** 草稿区之外**没有兼容性垫片、迁移话术或历史**（\"此前\" / \"现在\" / \"不再\" / \"已改名\"）；**今天这个代码库是唯一主题**。\n5. **受控的技术语言。** 歧义会改变行为时，让每句话有**显式 actor 与一个主要动作**；一个概念复用一个术语；优先直接动词；拆开堆叠的指令与条件；**保留情态与例外**。\n"},{"file":"skills/ssid-prose-standard/SOURCE.md","group":"skills","date":"","slug":"SOURCE","title":"来源与版本","tags":["ssid-prose-standard","dsh-prose-standard","ssid-trim-cot-leakage","dsh-doc"],"summary":"保留（判据一字未减）： - Preserve the complete proposition 整节：5 条命题子项（actor/action、条件时序顺序、情态、否定性保证与例外、归属副作用失败后果）与三条附属规则，逐条保留。 - Borderline decisions 的三条判断，仅把交互渠道由「PR 行内评论」改为「会话内回复」。 - 上游的事实核对与语气判据经 dsh-doc 移交后全部","bytes":3732,"lines":52,"body":"# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | `dsh-prose-standard` |\n| 上游路径 | `DSHFork/.agents/skills/dsh-prose-standard/` |\n| 上游版本锚点 | `c291e7961a`（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 81 行 + `references/examples.md` 142 行 = **223 行** |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（位置清单本地化 + 门禁换名 + 并入 9 条制度无关判据） |\n| 依赖 | `ssid-trim-cot-leakage`——**双向依赖，同批安装** |\n| 适配依据 | `seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-03-行文标准.md` |\n\n## 与上游的差异\n\n**保留**（判据一字未减）：\n\n- `Preserve the complete proposition` 整节：5 条命题子项（actor/action、条件时序顺序、情态、否定性保证与例外、归属副作用失败后果）与三条附属规则，逐条保留。\n- `Borderline decisions` 的三条判断，仅把交互渠道由「PR 行内评论」改为「会话内回复」。\n- 上游的事实核对与语气判据经 `dsh-doc` 移交后全部保留（见「新增」）。\n\n**改写**：\n\n- 引言：依赖声明指向 `docs/SSiD开发手册.md`；`contract`/`boundary`/`shape`/`surface`/`seam`/`gate`/`vocabulary` 的检查表补了一张**中英对照**（契约 / 边界 / 表面 / 接缝 / 门禁 / 词汇表）。\n- `Inputs and exclusions`：`vendor/` 的本地路径；把「排除归档笔记」换成**同步链的冻结副本**（`references/`、与三处 vendor 全等的 `plugins/` 副本、`_archived-*`）；派生物换成 `lib/` 与 `shell/profile-template/`；双语对降权。\n- `Required coverage by prose location`：**12 类 → 10 类**。Cookbooks 的判据并入 README，Diagnostics 的判据并入内部注释；#8「skill 与 agent 指令」提权重（本仓库有 14 个 skill，且本包每份都属这一类）。\n- `Workflow`：7 步骨架保留，门禁换成 `npm run typecheck` / 各插件 `pnpm typecheck` / L1 测试 / `verify-zh-ui.cjs` / `git diff --check`。\n\n**新增**：\n\n- **五个合法主场**：`docs/release-notes-*.md`、`docs/决策/`、`docs/设计/`、`docs/排查/`、`shell/docs/pitfalls.md`。依据：本仓库的变更叙事在这些路径是内容本体（实测扫描 202 处命中，分布集中于此）。上游只有 Agent Notes 一个主场，本仓库有五个。\n- **从 `dsh-doc` 并入的 9 条制度无关判据**（该 skill 被判不单独适配，其制度部分在本仓库不存在）：\n  - 「事实核对：跑，不要假设」4 条（对每条声称的操作真跑一遍 / 删掉无法复现的东西 / 对着最新代码检查旧文档 / 读事实不读文件夹名）\n  - 「语气规则」5 条（开篇说能做什么 / 开发者小节解释不枚举 / 草稿只有一个家 / 只讲当前状态 / 受控的技术语言）\n- **一个解释只有一个 home** 与**激进外链**在本仓库的落点。\n\n**删除**：无。上游判据一条未删。\n\n## 尚未落地的部分\n\n`references/examples.md`（上游 142 行 / 17 节）**尚未重写**。上游的 17 节全是英文案例，需要替换为本仓库的中文案例，并保留跨语言成立的「不要只为字数修剪」「限制是契约不是债务清单」「生成的摘要必须独立成立」三节。\n\n**当前 SKILL.md 不引用该文件**，因此缺口不影响可用性；补齐后再在正文里链接。\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/dsh-prose-standard/`\n2. 若该目录有变动，对照本文件「与上游的差异」逐条重判。\n3. 更新本文件的版本锚点与适配日期。\n"},{"file":"skills/ssid-record-browser-gif/SKILL.md","group":"skills","date":"","slug":"SKILL","title":"浏览器录制","tags":["ssid-record-browser-gif","ssid-pre-push-checks"],"summary":"在被要求制作、录制或生成演示浏览器工作流的 GIF 时使用；","bytes":9957,"lines":127,"body":"\n# 浏览器录制\n\n产出一段**简短、真实**的界面演示作为本地 GIF。**只有在任务包含把它附到 pull request 时**，才走末尾的发布流程。\n\n优先使用可用的浏览器控制工作流；当该工作流支持更高帧率的连续捕获时用 **Playwright Videos**；用**自带编码器**做裁剪、播放速度、末尾停留、尺寸与体积控制。\n\n**REQUIRED：** 推送前选证据用 `ssid-pre-push-checks`。同批安装。\n\n## 改动用户可见界面就必须录\n\n**改动产品用户可见的界面行为时，必须在同一次改动里更新对应插件的 `docs/shots/`，并确保 README 的 `## 截图` 段引用到位。**\n\n**录制本身就是证据**：用**真实服务器、真实 API key、真实模型回合**。**绝不**用 fixture 查询、mock 传输、合成事件注入或 test-only 钩子替代，除非用户显式要求 fixture 录制。\n\n嵌入处要写明：**被演示的确切 commit SHA、服务它的树与来源、任何模式标志或浏览器状态例外、以及是否跑了真实模型回合**——让评审者知道**这段录像到底证明了什么**。\n\n## 录制与发布分离\n\n- 录制只产出本地视频或截图与一个 `.gif` 产物；**绝不改动远端状态**。\n- 发布是**单独的最后一步**，且**只在任务包含附到 PR 时**执行；**绝不改动 PR 自己的分支**。\n- **保留所要求的录制条件**：真实服务器或真实 API 的演示**不得**使用 fixture 查询、mock 传输、合成事件注入或 test-only 钩子。**若凭据或服务器不可用，报告这个限制，而不是用 fixture 替代。**\n- **绝不读取或暴露凭据值**；走应用的正常配置路径，用一个无害的演示提示。\n\n## 搭建应用\n\n1. 要求干净工作树，用 `git rev-parse HEAD` 记录确切 commit，然后**构建那棵树**：`npm run bundle-kernel`（shell）＋受影响插件的 `pnpm build`。**对着另一个 commit 的构建录出来的 GIF 是错误归因的证据。**\n2. 每个端口起一个服务器，用**全新的 `DSH_HOME`、工作区与会话状态**；给浏览器全新隔离上下文。**录制不得碰用户真实 profile**（`~/.dsh/profiles/ssid`）。密钥走应用的正常配置路径；**不要回显它**。\n3. **一个分镜就是一次证据运行**：每个已发布帧都来自那个服务器与那些状态根、工作区、会话与模型场景。**若捕获自动化失败，丢弃它的帧并从全新根重跑；绝不把不同运行的帧拼接起来。**\n4. 切换任务时，**按 PID 或命令行精确匹配**停掉旧服务器。**宽泛的 `taskkill /IM node.exe` 可能杀掉启动它的那个 shell，包括你自己的。**\n\n## 录制流程\n\n沿用可用浏览器控制工作流的 setup / interaction / cleanup。暴露 `recordVideo` 时，在同一受控上下文启用视频以捕获更多中间帧；**视频可用性不决定该选哪个浏览器控制工作流**。\n\n只有在浏览器控制**不可用**时，才用仓库声明的 Playwright 依赖在隔离无头浏览器里操作，**并在溯源里声明这个退路**。**不要安装另一个驱动，也不要打开用户的浏览器。**\n\n录制前确认来源、构建产物、传输与任何模式覆盖。存脚本、原始视频、计时笔记、QA 帧与 GIF 到被 git 忽略的 `.playwright-mcp/` 下。\n\n**要点**：\n\n- **选择 3–6 个有意义状态的短故事**。行动前等待**唯一语义定位器**；用 `exact: true` 做可及名称等值，以及**无法匹配提示词回显**的精确文本完成判定。**固定等待可以在状态验证后提供阅读停留，但绝不用于确立就绪。**\n- 演示工具调用、拒绝或恢复时，**打开它的详情或轨迹**，让视频显示工具身份、状态或稳定错误码、以及下游结果。\n- **不捕获任何机密、个人数据、无关标签页或通知**。**浏览器视频包含页面内容而非浏览器外壳**——避免在应用里渲染带凭据的 URL。**审阅整个选定区间，包括中间状态。保持单一视口。**\n\n### 捕获视频\n\n**`viewport` 与 `recordVideo.size` 要显式匹配**，否则 Playwright 会把视频缩到 800×800 以内，**导致界面文字不可读**。\n\n**`context.close()` 要在 `video.saveAs()` 之前 await**——**只关 browser 不保证视频已 flush**。**每个页面有自己的视频**：显式选择被演示的页面，不要拼接不相关的页面或运行。失败的运行只能用于诊断。\n\n## 编码 GIF\n\n需要 Python 3、`ffmpeg` 与 `ffprobe`。**若媒体二进制缺失，报告依赖，而不是未经授权安装软件。**\n\n> **本机的媒体二进制**：`ffmpeg` / `ffprobe` **9.0.1** 位于 `H:\\MaxNull\\WorkStation\\.build\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\`，已写入**用户级 PATH**；编码器的 5 个自测已实测通过。\n>\n> **Windows 上命令是 `python` 而不是 `python3`**：本机的 `python3` 解析到 Windows Store 应用别名（0 字节，执行返回 9009），而 `python` 解析到 `C:\\Python312\\python.exe`（3.12.1）。**`Get-Command python3` 会报告它存在，但它跑不起来**——下面的命令在 Windows 上把 `python3` 换成 `python`。**存在性检查不等于可用性检查。**\n\n`export GIF_SKILL_DIR=...` **必须单独一行**——**同一命令里的内联赋值无法影响参数展开**。\n\n```sh\nexport GIF_SKILL_DIR=/absolute/path/to/this/skill\npython3 \"$GIF_SKILL_DIR/scripts/encode_gif.py\" \\\n  /absolute/path/to/demo.webm \\\n  /absolute/path/to/demo.gif \\\n  --start 2 --end 32 --speed 2 --final-hold 3 \\\n  --fps 10 --max-width 1200 --colors 128\n```\n\n`--start` / `--end` 选**一段连续区间**；默认保留整段 1× 速度并加 **2 秒末尾停留**。`--speed` 改变播放速度，**必须在 GIF 旁披露速度与选定区间，免得演示暗示了实测响应延迟**。**用观察到的视频时间，不要猜墙钟偏移。**\n\n**`--fps` 提高不能恢复源录制没有捕获到的运动**。**保留原始 WebM 用于 QA；不要拼接不同运行或合成缺失状态。**\n\n编码器会探测容器时长、在调色板转换前应用裁剪与变速、并检查编码后时长/动画/宽度/字节大小；**它拒绝空区间、越界区间、短于两个输出帧的选择、模式不当的标志与意外覆盖**。\n\n体积过大时**先降 `--max-width`，再降 `--colors` 或 `--fps`；保持文字可读**。**`--force` 只在解决确切输出路径后使用。**\n\n### 截图序列\n\n当连续视频不可用、或用户要求分镜时：**从一次隔离运行里捕获 3–6 个已验证状态**，按 `00-initial.png` / `01-typed.png` 命名；**尺寸与裁剪一致**。瞬态状态要在**同一次浏览器脚本调用内**轮询 DOM 标记后捕获。\n\n```sh\npython3 \"$GIF_SKILL_DIR/scripts/encode_gif.py\" \\\n  /absolute/path/to/frames /absolute/path/to/demo.gif \\\n  --durations 1.5,1.5,1.5,3.5 --fps 10 --max-width 1200 --colors 128\n```\n\n**一个 duration 适用于每张截图，否则每帧给一个正数，并把稳定状态停留得最久**。**目录输入会拒绝少于两帧、尺寸不一致或 duration 数量不匹配。**\n\n## 验证产物\n\n1. 读编码器的 **JSON 摘要**，核对输出路径、源区间与速度（或截图数）、编码帧数、尺寸、时长与字节大小。\n2. **目视阅读编码后的 GIF 本身，而不只是源帧。** 确认过渡可读、最后状态停留足够久、没有敏感内容出现。**若查看器只渲染第一帧，用 `ffmpeg` 从编码后的 GIF 解码代表性帧并检查它们；编码前的截图不能证明编码后的顺序、调色板或末尾停留。**\n3. 跑 `git status --short`，**确认原始视频、QA 帧与产物只落在被忽略的路径下**。\n4. 返回 GIF 绝对路径，在客户端支持本地媒体时渲染它，**并声明录制用的是真实 API、fixture 还是别的传输**。\n\n**编码器自测**（需要 ffmpeg/ffprobe 已安装，**且不在任何 CI 里跑**）：\n\n```sh\npython3 -m unittest discover -s \"$GIF_SKILL_DIR/scripts\" -p 'test_*.py' -v\n```\n\n## 发布\n\n**只在任务包含把它附到 PR 时执行。**\n\n### 主落点：`docs/shots/`\n\n把已验证的 GIF 或 PNG 放进对应插件的 `docs/shots/`，并在 README 的 `## 截图` 段引用（相对路径）。\n\n> **这与\"绝不提交二进制\"不冲突**：被禁的是把媒体塞进**会被反复合并的分支**以膨胀历史；`docs/shots/` 是 README 的**常驻资产**，本来就该在仓库里。仍然要**控制体积**（`--max-width` → `--colors` / `--fps`）。\n\n### 次落点：上游 PR\n\n`gh --attach` 需要 gh ≥ v2.99.0、github.com、写权限，且 GIF ≤ 10 MB。\n\n- 在 body 里按**普通本地路径引用**；`gh` 会就地重写为上传 URL，**保留位置与 alt 文本**。\n- **附上前立即重读被演示 PR 的 live head**，与记录的 commit 比较；**若已移动，停下并重录**。\n- 附加后**再次重读 live head 并要求仍停在该 commit**；重读 body 确认引用指向上传 URL；**通过 GitHub Markdown API 渲染 body 确认出现预期 `\u003cimg>`**；**抓取上传 URL 一次确认 `200` 与 `image/gif`**。\n\n**退路：assets 分支**（只在 `gh --attach` 不适用时）：孤儿分支，一个 `\u003cseries>-assets` 服务整个 PR 系列。\n\n- 推送前**校验该分支只含媒体**，且待推 GIF 的校验和与本地已验证产物一致。\n- **永不删除或重写 assets 分支，永不 force-push**——**已合并的 PR body 会永远引用它的 URL**。\n- **匿名 404 不能否证私有仓库资产；要认证后再验证。**\n"},{"file":"skills/ssid-record-browser-gif/SOURCE.md","group":"skills","date":"","slug":"SOURCE","title":"来源与版本","tags":["ssid-record-browser-gif","ssid-pre-push-checks"],"summary":"逐字复用（未改一个字节）： - scripts/encodegif.py（337 行）——只 import 标准库（argparse / json / math / shutil / subprocess / tempfile / pathlib / typing），外部只依赖 ffmpeg / ffprobe，自带的输入校验就是判据的载体（拒绝空/越界区间、短于两帧的选择、模式不当的标志、意外覆","bytes":4367,"lines":49,"body":"# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | `record-browser-gif` |\n| 上游路径 | `DSHFork/.agents/skills/record-browser-gif/` |\n| 上游版本锚点 | `c291e7961a`（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 172 行 + `scripts/encode_gif.py` 337 行 + `scripts/test_encode_gif.py` 103 行 = **612 行** |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 部分可用（发布目标改写；脚本**逐字复用**） |\n| 依赖 | `ssid-pre-push-checks`——同批安装；**运行时另需 `python` / `ffmpeg` / `ffprobe`** |\n| 适配依据 | `seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-08-浏览器录制.md` |\n\n## 与上游的差异\n\n**逐字复用（未改一个字节）**：\n\n- `scripts/encode_gif.py`（337 行）——只 import 标准库（`argparse` / `json` / `math` / `shutil` / `subprocess` / `tempfile` / `pathlib` / `typing`），外部只依赖 `ffmpeg` / `ffprobe`，**自带的输入校验就是判据的载体**（拒绝空/越界区间、短于两帧的选择、模式不当的标志、意外覆盖），改它就是改判据。\n- `scripts/test_encode_gif.py`（103 行）——编码器自测。\n\n> 复制时以 SHA256 校验：`encode_gif.py` = `34AA80599036…`、`test_encode_gif.py` = `B803EE933E13…`，与上游一致。\n\n**保留**（判据一字未减）：\n\n- **录制与发布分离**的 4 条（录制绝不改动远端状态；发布是单独的最后一步；保留所要求的录制条件；绝不读取或暴露凭据值）。\n- **录制流程**全部要点：3–6 个有意义状态、唯一语义定位器、`exact: true` 防提示词回显、**固定等待不用于确立就绪**、不捕获机密与无关标签页、单一视口。\n- **`viewport` 与 `recordVideo.size` 必须显式匹配**（否则缩到 800×800 以内导致文字不可读）；**`context.close()` 要在 `video.saveAs()` 之前 await**。\n- **验证产物**的 4 步，其中**目视阅读编码后的 GIF 本身**是最容易跳过也最重要的一步。\n- 编码器的全部使用纪律（`--speed` 必须在旁边披露、`--fps` 不能恢复未捕获的运动、体积削减顺序、`--force` 的前置）。\n\n**改写**：\n\n- **发布目标**：主落点改为**本仓库的 `docs/shots/`**（对应工作区铁律 7 的 README 截图段），并说明**它与「绝不提交二进制」不冲突**——被禁的是把媒体塞进会被反复合并的分支以膨胀历史，而 `docs/shots/` 是 README 的常驻资产。上游的 `gh --attach` 全流程与 assets 分支退路**作为次落点保留**，供向 DSH 或第三方提 PR 时使用。\n- **强制规则换载体**：上游要求「改动用户可见 GUI 的 PR 必须包含 GIF」；本仓库改为**「改动用户可见界面时必须在同一次改动里更新 `docs/shots/` 与 README 的 `## 截图` 段」**。\n- **隔离域本地化**：构建命令改为 `npm run bundle-kernel` + 受影响插件的构建；隔离面加入 **profile（`~/.dsh/profiles/ssid`）——录制不得碰用户真实 profile**；停服务器用 PID 或命令行精确匹配，**不要用宽泛的 `taskkill /IM node.exe`**。\n\n**新增**：\n\n- **媒体依赖的现状**：`ffmpeg` / `ffprobe` **9.0.1**（gyan.dev release-essentials，106 MB）解压在本机 `H:\\MaxNull\\WorkStation\\.build\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\`，并写入**用户级 PATH**（便携版路线，`IsAdmin=False` 下的可行做法）。**编码器的 5 个自测已实测通过**（`python -m unittest test_encode_gif -v` → `Ran 5 tests … OK`）——这是「逐字复用」在本机成立的实际证据，不只是纸面声明。\n- **Windows 的命令差异**：`python3` 在本机解析到 Windows Store 应用别名（0 字节，执行返回 9009），而 `python` 可用（3.12.1）。**`Get-Command` 会报告它存在**——所以正文明确要求用 `python`，并写明「存在性检查不等于可用性检查」。\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/record-browser-gif/`\n2. 若该目录有变动，对照本文件「与上游的差异」逐条重判。**若 `scripts/` 有变动，重新逐字复制并更新上面的校验和。**\n3. 更新本文件的版本锚点与适配日期。\n"},{"file":"skills/ssid-speed-up-perf/SKILL.md","group":"skills","date":"","slug":"SKILL","title":"性能优化","tags":["ssid-speed-up-perf","ssid-test-reliability","ssid-pre-push-checks","dsh-runtime"],"summary":"在调查或优化思灵的启动时间、大会话装载、界面响应、面板与导航交互，或设计可复现的用户路径测量、把性能改动变成有测量支撑的行为保持型修复时使用。","bytes":8265,"lines":115,"body":"\n# 性能优化\n\n把一句宽泛的\"让它更快\"变成**可复现的用户路径测量**与**小的、有证据的修复**。\n\n**这是指导，不是配额也不是脚本：广泛普查、跟随实测成本，并拒绝那些看起来诱人、但没有改善用户真正运行的工作负载的改动。**\n\n**REQUIRED：** 进程、时钟、浏览器测试与异步拆除用 `ssid-test-reliability`；推送前选证据用 `ssid-pre-push-checks`。同批安装。\n\n## 定范围与当前权威\n\n**先\"同意\"这几件事**：用户可见的端点、工作负载范围、资源约束、可接受的微小行为差异、以及**停止规则**。**停止规则是防止性能工作无限蔓延的唯一闸门。**\n\n**四层测量必须分开**——跨层推断与\"快的历史迭代器证明传输快\"是同一类错误：\n\n| 层 | 形态 |\n|---|---|\n| 主进程 | `shell/main.mjs` |\n| 内核 | `kernel.bundle.mjs` + DSH |\n| 渲染进程 | Web 界面 |\n| 磁盘与归档 | profile、`dsh-runtime.tar.gz` |\n\n**启动时间必须定义终点**：可观察点有进程起、splash 出现、splash 消失、首屏可交互、归档部署完成。**不定终点就没法比较。**\n\n**测量本地开销时排除模型与网络延迟，并陈述这个排除**——不要把结果称为完整的产品延迟。\n\n**以仓库 HEAD 为准，不以本地 dev 进程为准**——dev 热更新会让本地状态偏离 HEAD。\n\n## 普查用户路径，再排序候选\n\n广度有帮助时委派独立域；**要求测量与生产调用点，而不是猜测**。**不要让第一个好候选中止普查。**\n\n| # | 域 |\n|---:|---|\n| 1 | **冷启动与热启动**：进程起 → splash → 归档部署（首启/升级）→ 首屏可交互 |\n| 2 | **大会话**：多回合历史、工具密集、单条大结果、会话列表与切换、导航条与面板 |\n| 3 | **渲染与交互**：首次绘制、滚动、面板展开折叠、侧栏切换、隐藏视图激活 |\n| 4 | **归档与部署**：`prepare-runtime.mjs` 耗时、归档解压与校验、vendor 同步 |\n\n**独立成本驱动因素要分别变动**——字节、事件数、回合数、工具数、DOM 节点数是**不同的量**。**不要把一个\"大量微小相同消息\"的负载称为现实负载，除非检查过它压的是哪个用户操作。** 包含典型与尾部负载，但**避免没有决策价值的组合矩阵**。\n\n按**观察到的用户延迟、CPU/分配、保留内存、发生频率、置信度**排序。每条候选必须点名：**生产消费者、重复工作、预期复杂度、最小的可证伪干预、必须保持稳定的行为**。\n\n**可疑的循环、未使用的缓存、或大文件本身不是瓶颈的证据。**\n\n## 先建可复现的测量\n\n**若用户授权检查本地语料，只提取聚合的工作负载特征。绝不把提示词、输出、路径、身份、ID、凭据、录制或可识别片段复制进 fixture、日志、截图或产物。**\n\n> **本仓库的用户数据比一般仓库更敏感**——会话日志里就是真实对话内容。聚合时**只取计数与长度分布**。\n\n用经复核的常量生成固定输入；**没有任何基准依赖用户的主目录、环境仓库、网络服务或私有数据。**\n\n**动笔前先记录一张测量卡**：\n\n| 字段 | 必须给出的决定 |\n|---|---|\n| 用户操作 | 确切动作与**外部可观察的完成条件** |\n| 工作负载 | 固定维度、分布、构造种子/常量，以及**为什么它压到普通与尾部使用** |\n| 入口路径 | 生产调用/组合与构建产物；被 mock 的外部边界 |\n| 时钟 | 纳入的 setup、冷/热状态、计时起止、**被排除的成本** |\n| 内存 | 可达的端点对象、基线、GC 策略、保留 vs 瞬时上限 |\n| 裁决 | 原始样本、选定的聚合、校准的绝对值/比例/内存上限、**负向控制** |\n| 行为 | 属主功能测试，以及**被允许的微小差异** |\n\n**用全新子进程与私有临时根**做冷启动与进程内存样本；热样本显式保留既定缓存；**绝不让 fixture 的 setup 悄悄预热一个冷场景**；两侧保持相同输入、校验、完成条件与可达输出。**解析后丢弃的基线不能与经过校验的保留结果相比。**\n\n**本仓库没有可扩展的测量 lane**——先建**一条最小的**（一个脚本 + 一个输出格式），再开始优化。**不要为每次优化各造一套脚本。**\n\n**不要为了让某次运行好看而放宽预算或挑一次走运的运行。**\n\n## 证明回归，再移除工作\n\n**改生产代码之前**先跑未优化的负载，保存命令、版本、运行时/平台、fixture 维度、原始测量与裁决。\n\n把失败场景**缩减到仍然压到真实瓶颈**，然后**在动手前给可证伪假设排序**；用 profile、分配样本、工作计数或阶段计时来区分它们。\n\n**值得测的模式**（不是自动处方）：\n\n1. 让紧凑表示**一路保持紧凑**；消费者需要已定内容或一个聚合时，避免逐 delta 对象。\n2. **只有在识别出真正的归属与信任转移之后**才移除重复的解析、拷贝、冻结与校验。**同进程类型化借用不是削弱持久或 wire 解析的许可。**\n3. 流式转换产物并**约束中间状态**，而不是保留每一代；在用户操作需要处**包含发布、校验与可写就绪义务**。\n4. **分离只读准备与写入/发布工作**，但**不要把被 await 的工作挪到一个正确性所要求的端点之后**。\n5. 延迟非活跃视图与折叠细节的工作；**同时测量首次激活与保留状态**。**延迟不是删除，视口高亮不是完整虚拟化。**\n6. **稳定标识、收窄订阅**，使一个变更节点不会让整段历史失效；**保持更新顺序与即时事件行为**。\n7. 用合适的数据结构替代反复移位/扫描/重建；**测量整个消费者路径**而不只是孤立的容器操作。**revision-keyed 复用或 singleflight 只在有显式失效、有界保留、独立等待者取消与拆除归属时才用。**\n\n**一次只改一个因果因素**；重跑聚焦场景**与其端到端父场景**。\n\n**负向控制的定义**：**一个宽到让回归通过的阈值不是保护；低于已验证噪声底的预算也不可靠。**\n\n## 保持行为与资源归属\n\n**性能测量补充功能证据，不替代它。** 跑或补最窄的属主测试（输出、排序、分页、错误、取消、并发、拆除）。\n\n保持**会话日志的等价性**（与 DSH 的会话格式契约）、已发布代的不可变性、原子发布、必需校验与可写就绪。\n\n**不要为了达到一个数字而静默截断历史、跳过工具结果、禁用不变量或改变生命周期语义。**\n\n**拒绝一次优化，当**：端到端增益消失 / 典型负载实质性回退 / **复杂度超过小收益** / 取消·保留·持久性**无法解释与测试**。**简短记录被否证的假设，而不是扩大范围来为它辩护。**\n\n## 交付一个有限的、可评审的结果\n\n持久理由写进 `docs/决策/`；**检查相关记录是否被取代，但不要把性能工作变成全库行文清理**。**可复用流程留在这里，场景相关的真相留在它的基准或包属主处。**\n\n应用 `ssid-pre-push-checks`，**只报告执行过的证据**，并查看 CI 而不是假设本地计时能证明 runner 稳定性——**本仓库的 CI 不跑测试，所以\"本地计时\"就是全部证据：这抬高了重复测量的必要性**。\n\n标记完成之后，用代码与可执行证据评估评审意见；**不要仅仅因为一份报告来自机器人就驳回它**。\n\n**结果摘要格式**：\n\n> 工作负载 → 前后绝对值与比例 → 端点与内存语义 → 行为证据 → 负向控制 → 确切检查 → 排除项\n\n**区分作者报告的历史数字、新的本地测量与 CI 证据。** **停在约定的场景与修复范围内，保留一份简短的排序后续清单，而不是追逐无关机会。**\n"},{"file":"skills/ssid-speed-up-perf/SOURCE.md","group":"skills","date":"","slug":"SOURCE","title":"来源与版本","tags":["ssid-speed-up-perf","dsh-speed-up-perf","ssid-test-reliability","ssid-pre-push-checks"],"summary":"实测（2026-09-10）：本仓库没有 benchmarks/ 目录、没有任何 bench/perf 脚本、手册里也没有性能节；唯一沾边的决策记录是 2026-08-17-v0.1.4追加优化（界面优化，不是测量基准）。 所以本 skill 不是改进已有实践，而是引入一套测量纪律；而且它比 05 多一层前提——上游有可扩展的测量 lane，本仓库要从零建一条。","bytes":4104,"lines":56,"body":"# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | `dsh-speed-up-perf` |\n| 上游路径 | `DSHFork/.agents/skills/dsh-speed-up-perf/` |\n| 上游版本锚点 | `c291e7961a`（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 92 行（**无 references**） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（测量基建本地化 + 删 stacks；测量纪律全部保留） |\n| 依赖 | `ssid-test-reliability`、`ssid-pre-push-checks`——**同批安装** |\n| 适配依据 | `seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-07-性能优化.md` |\n\n## 定位：引入新能力，且需要先建基建\n\n实测（2026-09-10）：本仓库**没有 `benchmarks/` 目录、没有任何 `*bench*`/`*perf*` 脚本、手册里也没有性能节**；唯一沾边的决策记录是 `2026-08-17-v0.1.4追加优化`（界面优化，不是测量基准）。\n\n所以本 skill **不是改进已有实践，而是引入一套测量纪律**；而且它比 05 多一层前提——**上游有可扩展的测量 lane，本仓库要从零建一条**。\n\n## 与上游的差异\n\n**保留**（判据一字未减）：\n\n- **测量卡 7 字段**（用户操作 / 工作负载 / 入口路径 / 时钟 / 内存 / 裁决 / 行为）——这是本 skill 最有价值的产出：有了它，\"更快\"才是一个可证伪的命题。\n- **7 条优化模式的\"值得测\"清单**，含「只比较**能独立分叉**的观测才算有用」式的表述（同进程类型化借用不是削弱持久或 wire 解析的许可）。\n- **隐私纪律**整段。\n- **测量诚实性**：全新子进程与私有临时根、热样本显式保留缓存、**绝不让 fixture 的 setup 悄悄预热冷场景**、**解析后丢弃的基线不能与经过校验的保留结果相比**。\n- **负向控制的定义**：一个宽到让回归通过的阈值不是保护；低于已验证噪声底的预算也不可靠。\n- **四种拒绝优化的情形**与「简短记录被否证的假设，而不是扩大范围来为它辩护」。\n- 结果摘要格式七段式。\n\n**改写**：\n\n- 引用换成本地（手册、`ssid-test-reliability`、`ssid-pre-push-checks`、`docs/决策/`）。\n- **端点是四层而不是两层**：主进程 / 内核 / 渲染进程 / 磁盘与归档。跨层推断（\"主进程快了所以界面快了\"）与上游禁止的\"Node 折叠证明浏览器响应\"是同一类错误。\n- **启动时间必须定义终点**（进程起 / splash 出现 / splash 消失 / 首屏可交互 / 归档部署完成）——不定终点就没法比较。\n- 4 个普查域换成本地域（冷热启动 / 大会话 / 渲染与交互 / 归档与部署）。\n- **删掉测量基建的整段依赖**（Node 机器乘数、浏览器 CI 校准、共享时间校准、预算作为源码常量），改为：**先建一条最小的测量 lane（一个脚本 + 一个输出格式），再开始优化**；并明确警告不要为每次优化各造一套脚本。\n- `Deliver a bounded, reviewable result`：删除 stacked PR / 官方 GitHub stacks / 独立 worktree 整段，保留其中通用的「在编辑前选好分层；每一层都要可合并」。\n- 「查看 CI 而不是假设本地计时能证明 runner 稳定性」加一句：**本仓库的 CI 不跑测试，所以\"本地计时\"就是全部证据——这抬高了重复测量的必要性**。\n\n**新增**：\n\n- **隐私纪律提权**：本仓库的用户数据比一般仓库更敏感（会话日志里就是真实对话内容），聚合时只取计数与长度分布。\n- **以仓库 HEAD 为准，不以本地 dev 进程为准**（dev 热更新会让本地状态偏离 HEAD）。\n\n**删除**：0 个部件。删掉的是上游引用的测量基建（本仓库不存在），判据本体未动。\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/dsh-speed-up-perf/`\n2. 若该目录有变动，对照本文件「与上游的差异」逐条重判。\n3. 更新本文件的版本锚点与适配日期。\n"},{"file":"skills/ssid-test-reliability/SKILL.md","group":"skills","date":"","slug":"SKILL","title":"SSiD 测试可靠性","tags":["ssid-test-reliability","ssid-prose-standard","ssid-pre-push-checks","dsh-chat-rail","dsh-quick-toolbar","dsh-dream-skin","dsh-skills","dsh-ssid-panels","ssid-release","ssid-mac-launcher","dsh-memory"],"summary":"在设计或修改可能因并发、共享资源、时钟、进程全局状态、子进程、网络监听器或异步拆除而不确定失败的测试与 fixture 时使用；","bytes":11781,"lines":190,"body":"\n# SSiD 测试可靠性\n\n让测试的失败**指向被测行为**，而不是指向调度、残留状态、平台差异或不足的预算。这是判据，不是脚本。\n\n**REQUIRED BACKGROUND：**\n- `ssid-prose-standard` 拥有本文引用的**完整命题规则**——增删测试注释时用。\n- `ssid-pre-push-checks` 管**什么时候必须跑哪些检查**；本 skill 管**测试怎么写才可靠**。\n- 三者同批安装。分开装会让引用指向不存在的判据。\n\n## 1. 先读归属规则\n\n动手前确认这套测试**实际用什么配置跑**：\n\n| 运行器 | 归属规则在哪 |\n|---|---|\n| vitest | 各插件的 `vitest.config.ts`（**并非每个包都有**，缺省时靠 vitest 默认 `include`）——**全都没有超时配置**，所以下面的默认值直接生效 |\n| node:test（`shell/` 本体、`dsh-chat-rail`、`dsh-quick-toolbar`、`dsh-dream-skin`、`dsh-skills`） | **没有配置文件**——纪律只存在于 `package.json` 的 `test` 脚本里 |\n| Playwright | `shell/tests/plugin-adapt/playwright.config.ts` |\n\n外加 `docs/SSiD开发手册.md` §9（插件开发与测试规范，含 L1/L2/L3 分级门槛）。\n\n**不要假设\"有测试就有纪律\"**：`plugins/dsh-ssid-panels/tests/` 下有两个测试文件，但那个包**没有 `test` 脚本**、也没装 vitest，唯一入口是 `ssid-release` skill 里的手跑命令——而且**必须在仓库根跑**，否则 `ERR_MODULE_NOT_FOUND`。CI 不会跑它们。\n\n## 2. 建模执行拓扑\n\n测试可能同时运行在四层，**每层的隔离边界不同**：\n\n| 层 | 形态 |\n|---|---|\n| 1 | 同一 spec 文件内的用例 |\n| 2 | 并行的 spec 文件 / worker 进程 |\n| 3 | 多个包的测试同时跑 |\n| 4 | 本地开发机 vs GitHub runner |\n\n**进程隔离不隔离主机的端口、可预测文件系统路径、外部服务、数据库、socket 或继承的子进程。**\n\n**不要因为一个 fixture 缺隔离就把整个套件串行化**——顺序化一个块无法保护主机资源免受另一个文件、进程或 runner 的干扰。\n\n## 3. 原子分配资源\n\n- **用资源所有者的分配器**，不要\"先检查可用、稍后再占\"：网络用 `listen(0)`，**在服务器报告 listening 之后**才读回地址；**绝不扫描空闲端口然后稍后绑定**。\n- 用 `mkdtemp` 建私有临时根；**不要获取可预测的共享路径**。\n- 给共享数据库、socket、会话、输出位置**唯一的按用例命名空间**。\n- 需要\"路径必须尚不存在\"时用**独占创建**。\n- **稳定的录制标识符要与临时传输地址分开。**\n- **仅作为解析器输入或期望值出现的字面路径/URL 不是被获取的资源**——不要因为看起来固定就改写它们。\n\n**本仓库的现存问题**：`shell/tests/plugin-adapt/` 的探针脚本里仍有写死的固定端口（`3083` 一类）。**该目录的 `README.md` 自己已写明\"页面 URL 是随机端口，断言勿硬编码端口\"。** 规范写法是 `process.env.SSID_CDP ?? 'http://127.0.0.1:9222'`。**新增脚本一律用环境变量回退；改到旧脚本时顺手统一。** 现状按命令核对，不要引用写死的计数：`rg -n \"127\\\\.0\\\\.0\\\\.1:9222|3083|54170\" shell/tests/plugin-adapt`——回退写法也会命中，逐行看是否带了 `SSID_CDP`。\n\n## 4. 隔离进程全局状态\n\n把 `process.env`、`cwd`、假计时器、locale 与时区、模块 mock、注册表、console 钩子、`globalThis`、全局 `fetch` 拦截**都当独占可变资源**。\n\n手法固定：**捕获原值是缺失还是存在 → 恢复那个确切状态 → 立即注册恢复 → 最小作用域 `try/finally` → 保留 `afterEach` 兜底 → 拦截最窄的确切请求**。\n\n两个运行器**都是显式导入**（没有开 `globals: true`），所以写法几乎一致：\n\n```js\n// vitest\nimport { describe, it, expect, beforeEach, afterEach, vi } from 'vitest'\n// node:test\nimport test from 'node:test'\nimport assert from 'node:assert/strict'\n```\n\n## 5. 尊重平台自有语义\n\n四条 Windows 判据，本仓库出 Windows 与 macOS 两种包，全部适用：\n\n- **写回值只在断言容忍写回失败时才安全**（mtime 精度、NTFS 的 100 纳秒刻度）。\n- **Windows 环境变量名大小写不敏感**——`http_proxy` 与 `HTTP_PROXY` 当作两个键的 fixture，在那里只有一个条目。\n- **Windows 异步释放文件句柄**——POSIX 上立即完成的 rename/remove，需要**按实测争用规模定大小的有界重试**。\n- **Windows 没有 POSIX 权限与信号语义**——依赖它们的用例**显式平台跳过并写明原因**，而不是到处弱化断言。\n\nmacOS 侧目前**没有成文经验**；`build-mac.yml` 与 `ssid-mac-launcher` 相关的问题记录在 `docs/发版流程规范.md` 与 `docs/排查/`。\n\n## 6. 让超时预算对上 lane\n\n三条与运行器无关的判断：\n\n- **用例级超时覆盖运行器默认值**，而不是让位给它——低于 lane 预算的值等于**降低**了已授予的量。\n- **提升测试预算时要一起提升钩子预算**——否则只提升 case 预算会把一次争用失败挪进 `afterEach`。\n- **被测对象本身是超时时，外层等待要远大于被测超时**——证明 20 ms 截止触发的用例，不能与测试框架自己的等待赛跑。\n\n**默认值是实数字，不是抽象的**：\n\n| 运行器 | 用例级默认 | 钩子级默认 |\n|---|---|---|\n| vitest 4.1.11 | **5000 ms** | **10000 ms**（写 `0` 完全禁用） |\n| node:test | **`Infinity`** | 同（钩子即子测试，各带 `timeout`，未指定则继承父测试） |\n| Playwright | 本仓库自设 **60000 ms** | 另有 30 s 导航 / 15 s 动作 |\n\n**vitest 的默认构成 hook : test = 2 : 1 的隐含比例**——把 `testTimeout` 提到 30 s 而不管 `hookTimeout`（仍是 10 s），比例反转成 1 : 3，\"争用失败从 case 挪进 `afterEach`\"就必然发生。\n\n两个方向的病都要防：\n\n- **vitest 太紧**：默认 5 秒，起进程、等文件系统一类慢用例会间歇撞线，表现得像 flake。\n- **node:test 太松**：默认 `Infinity`，**挂住的用例不会失败，只会让 lane 永不结束**——这不是\"太紧\"，是**缺失失败信号**。\n\n**本仓库的三种态度**：Playwright 已经做对（60 s / 30 s / 15 s 三层递减 + `retries: 0`，是正面样板）；vitest 是裸默认；node:test 无上限。\n\n写法：\n\n| | vitest | node:test |\n|---|---|---|\n| 用例级 | 第三参数 `it('名字', fn, 30_000)`，或全局 `testTimeout` | 第二参数 `test('名字', { timeout: 30_000 }, fn)` |\n| 钩子级 | `hookTimeout`（独立配置项） | **无独立配置项**——钩子就是子测试，各带 `timeout` |\n\n## 7. 用状态同步\n\n- **固定的 sleep 不是 setup 完成或清理结算的证据。**\n- 等显式就绪事件、握手、状态转移、自有 promise、可外部观察的条件。\n- **超时只用来界定等待，绝不用作让断言成立的条件。**\n- 用 deferred promise 或 barrier 把竞态放在确定点，**并证明相关操作确实重叠**。\n- **不要断言依赖调度器的顺序**，除非那个顺序就是被测的产品行为。\n- 时间本身是主题时，注入或伪造时钟，**并总是恢复真实计时器**。\n\n## 8. 拆除到静默\n\n- **获取后立即注册清理**，这样断言失败也会释放资源。\n- 清理顺序：停止新回调/请求 → 摘掉监听器 → 恢复全局钩子 → 终止自有工作 → **等待子进程退出、服务器关闭、worker 终止或等价完成信号**。\n- **调用 `abort()`、`close()` 或 `kill()` 而不等待自有的完成信号，是不完整的拆除。**\n- 晚完成可能发生时，**证明释放能阻止它变更另一个用例**。\n\nElectron 与 Playwright 测试尤其吃这套：`shell/tests/plugin-adapt/` 的浏览器测试若没等到 `browser.close()` 完成就进入下一个文件，正是这条要抓的。\n\n## 9. 证明预期回归\n\n- 可行时**先观察普通回归在修复前失败**。\n- **对新的静态或语料守护，临时引入被拒绝的用例并观察预期失败**（手册 §9 的\"先跑红\"在这里更具体：**针对守护类检查**）。\n- **对竞态用 barrier 证明重叠；重复执行本身不是竞态测试。**\n- 对端口、socket、共享路径、子进程，**当跨进程隔离是修复的一部分时要并发跑独立测试进程**。\n- **fixture 用自己的截止时间 spawn 时，要先断言没有信号或超时结束了子进程，再去断言退出状态**——否则被杀死的子进程会被报成状态不匹配。\n- **验证外部状态、事件、文件、日志、退出或释放，而不是相信组件自报。**\n- **压力运行补充确定性回归；它们不替代它。**\n\n## 10. 拒绝掩盖式修复\n\n不要把这些当作确定性本地测试的根因修复：\n\n1. 不指明所等待状态就加大超时\n2. 加重试\n3. 把所有文件改成串行\n4. 吞掉错误或未处理的 rejection\n5. 弱化断言\n6. 把不稳定行为归一化掉\n7. 在清理或断言前加 sleep\n\n**两条区分**：\n\n- 重试对**有文档记载的瞬态外部提供方测试**仍然有效（本仓库对应模型调用类测试）。\n- **恢复预算不是掩盖**——把套件提升到它本来就有的 lane 预算，或按**实测的争用**定有界重试，**命名了等待的工作并归还了 lane 已授予的量**。\n\n## 11. 诊断既有 flake\n\n**只做诊断的请求保持只读：报告原因与证据，除非用户同时要求修复。**\n\n诊断路径：本地复现 → Playwright trace（浏览器类）→ 日志定位（`~/.ssid/ssid.log`）→ 对照 `docs/排查/` 的既有记录。\n\n**本仓库的诊断清单尚未建立**：`docs/排查/` 里已有的记录不多（先列目录，别凭印象说\"没有\"）。遇到新的失败模式时，把结论写回那里，**不要凭印象下判断**。\n\n## 12. 验证与报告\n\n按风险加拓扑证据：\n\n| 改了什么 | 要什么证据 |\n|---|---|\n| 进程全局状态 | 恢复证据（原值是缺失还是存在都验） |\n| 生命周期或子进程 | **静默拆除**证据 |\n| 端口或共享路径 | **并发独立进程**证据 |\n| 新增守护 | **负对照**（无效输入按预期失败） |\n\n跑测试的命令（**每个都核实过存在**）：\n\n| 目标 | 命令 |\n|---|---|\n| shell 本体 | `npm test`（`shell/package.json` 的 `test` 脚本，含行为 spec 与检查脚本 spec） |\n| shell 单文件 | `npm run test:profile-merge` / `npm run test:codegraph-adapt` |\n| 插件 | `pnpm test`（vitest）或 `npm test`（node:test，看该插件的脚本） |\n| Playwright | `cd shell/tests/plugin-adapt && npm test`；另有 `npm run test:ui`、`npm run baseline` |\n| dsh-ssid-panels 的两个测试 | `node --import tsx/esm --test plugins/dsh-ssid-panels/tests/release-notes.test.ts`（**必须在仓库根**） |\n\n**两个坑**：\n\n1. **Playwright 不在 `npm test` 里**。shell 的 `test` 脚本跑 `tests/` 下的行为 spec 与 `scripts/` 下的检查脚本 spec，**不含 Playwright**；清单以脚本现取：`node -p \"require('./shell/package.json').scripts.test\"`。**只看 `npm test` 绿就宣布\"全绿\"是错的。**\n2. **包管理器不统一**。多数插件只有 `pnpm-lock.yaml`，但 `dsh-memory` 同时存在 `package-lock.json` 与 `pnpm-lock.yaml`——**调用前先看该插件目录里是哪个锁文件**。\n\n报告要说清：改了什么、跑了什么、**有意没跑什么以及为什么**。\n"},{"file":"skills/ssid-test-reliability/SOURCE.md","group":"skills","date":"","slug":"SOURCE","title":"来源与版本","tags":["ssid-test-reliability","dsh-ci-test-reliability","ssid-prose-standard","ssid-pre-push-checks","dsh-memory","dsh-ssid-panels"],"summary":"保留（判据骨架，未改一条）： - 原子分配资源、隔离进程全局状态、尊重平台自有语义、用状态同步、拆除到静默、证明预期回归、拒绝掩盖式修复——对应上游第 3–5、7–10 节。 - 上游第 10 节的七条禁令与两条区分逐字保留。 改写： - 「读取归属规则」：上游的 5 个文档链接 → 本仓库的三条真实指向（4 个 vitest.config.ts、node:test 的 package.json ","bytes":2929,"lines":45,"body":"# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | `dsh-ci-test-reliability` |\n| 上游路径 | `DSHFork/.agents/skills/dsh-ci-test-reliability/` |\n| 上游版本锚点 | `c291e7961a`（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 131 行 + `references/ci-flake-diagnosis.md` 60 行 = **191 行** |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（判据骨架全部保留；引用、示例与命令本地化） |\n| 依赖 | `ssid-prose-standard`、`ssid-pre-push-checks`——**同批安装** |\n| 适配依据 | `seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-01-测试可靠性.md` |\n\n## 与上游的差异\n\n**保留**（判据骨架，未改一条）：\n\n- 原子分配资源、隔离进程全局状态、尊重平台自有语义、用状态同步、拆除到静默、证明预期回归、拒绝掩盖式修复——对应上游第 3–5、7–10 节。\n- 上游第 10 节的七条禁令与两条区分逐字保留。\n\n**改写**：\n\n- 「读取归属规则」：上游的 5 个文档链接 → 本仓库的三条真实指向（4 个 `vitest.config.ts`、node:test 的 `package.json` 脚本、`docs/SSiD开发手册.md` §9）。上游的 `docs/defensive-patterns.md` 与 `snapshots/AGENTS.md` 在本仓库没有对应物，删除而不硬造。\n- 「建模执行拓扑」：上游四层（含自托管池）→ 本仓库四层（spec 内 / 并行 worker / 多包同时跑 / 本地 vs GitHub runner）。\n- 「超时预算」：上游的抽象说法 → 运行器**实际默认值**（vitest 5000/10000 ms、node:test `Infinity`、Playwright 本仓库自设 60000 ms），并给出 hook : test = 2 : 1 的机制解释。\n- 「诊断既有 flake」：上游的 CI 拓扑诊断 → 本仓库的本地复现路径。\n- 「验证与报告」：上游命令 → 经核实存在的本仓库命令表。\n\n**新增**：\n\n- **两套运行器的双版示例**（vitest 与 node:test）——上游只对一种运行器讲话。依据：本仓库 10 个插件用 vitest、4 处载体用 node:test。\n- **本仓库专有坑**：Playwright 不在 `npm test` 里；包管理器不统一（`dsh-memory` 同时有两个锁文件）；`dsh-ssid-panels` 的测试没有 npm 脚本且必须在仓库根手跑。\n- **现存的硬编码问题**（约 28 个探针写死端口、5 个写死 token）——上游第 3 节的判据在本仓库第一批审计对象上直接命中。\n- **超时三态度**：Playwright 已做对（三层递减 + `retries: 0`），vitest 是裸默认，node:test 无上限。\n\n**删除**：无。上游判据一条未删。\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/dsh-ci-test-reliability/`\n2. 若该目录有变动，对照本文件「与上游的差异」逐条重判。\n3. 更新本文件的版本锚点与适配日期。\n"},{"file":"skills/ssid-trim-cot-leakage/references/examples.md","group":"参考","date":"","slug":"examples","title":"校准样本","tags":["ssid-trim-cot-leakage","dsh-quick-toolbar","dsh-runtime","ssid-speed-up-perf"],"summary":"原样：","bytes":7059,"lines":247,"body":"# 校准样本\n\n案例用于校准判断。结构照上游（11 节 / 30 个案例），案例用**本仓库的真实形态**。\n\n## 死的设计会话引用\n\n### 有已提交属主的决策编号\n\n**原样**：\n\n> 会话存储隔离按（决策 7）的结论实现，见设计 §4.7。\n\n**为什么是泄漏**：`（决策 7）` 与 `设计 §4.7` 指向只有写作会话能看到的编号与未提交草稿。\n\n**改法**（有属主就按名字与路径引用）：\n\n> 会话存储按工作区隔离，见 `docs/决策/2026-08-23-会话隔离与插件更新-交付清单.md`。\n\n### 阶段标签\n\n**原样**：\n\n> T4 阶段先做面板，W3 再补注入。\n\n**改法**：删掉标签，直接说交付顺序；未做的部分移入 `TODO` 或 issue 引用。\n\n## stack 与 PR 视角\n\n### \"本 PR 新增\"\n\n**原样**：\n\n> 本 PR 新增了 `verify-zh-ui.cjs`。\n\n**改法**（陈述已交付的机制）：\n\n> `verify-zh-ui.cjs` 校验翻译表覆盖、中文替换与切英文恢复。\n\n## 变更叙事与版本戳\n\n### 移除叙事\n\n**原样**：\n\n> 我们移除了 `plugins/` 下该插件的源码副本。\n\n**改法**（说当前归属，不说移除动作）：\n\n> 该插件的源头在 `max-null-plugins/dsh-quick-toolbar`；`plugins/` 下不保留副本。\n\n### 已修复的回归 → 现在时反事实\n\n**原样**：\n\n> 以前升级会覆盖用户层，现在不会了。\n\n**改法**：\n\n> 升级部署合并用户增量；不合并会丢弃用户自装插件与自定义 MCP 预置。\n\n### 指示性版本戳\n\n**原样**：\n\n> 本版起启动不再依赖 `DSH_CHECKOUT`。\n\n**改法**：\n\n> 启动读内置运行时三级回退（`DSH_CHECKOUT` → 并列目录 checkout → 内置 dsh-runtime）；没有回退时安装版会因找不到运行时而失败。\n\n## 评审编排\n\n### 评审结论写进行文\n\n**原样**：\n\n> 评审中被拒绝：把 worker 分支放在 `start()` 内。\n\n**改法**（陈述契约与它保护什么，不说谁在何时否决过）：\n\n> worker 分支位于顶层、在 tsx/kernel 加载之前——放在 `start()` 内会让 worker 进程加载整个内核。\n\n## 面向评审者的辩解\n\n### 论证自己正确\n\n**原样**：\n\n> 这个 `?.()` 是安全的——它只是防御旧版插件中心没有该字段。\n\n**改法**（陈述不变量，不申辩）：\n\n> `?.()` 覆盖旧版插件中心不提供 `__pluginCenterOpen` 的情形；新版总会提供。\n\n## 复述与推导记录\n\n### 控制流叙述\n\n**原样**：\n\n> 先读 `package.json`，再检查 BOM，最后写回。\n\n**改法**：代码已展示这一段就整体删除；若要保留非显然契约：\n\n> 写回前确认无 BOM——带 BOM 的 `package.json` 会让 npm 发布产物解析失败。\n\n## 模糊措辞与规划残留\n\n### 没有标记的推迟\n\n**原样**：\n\n> 启动性能问题暂时先这样，以后再看。\n\n**改法**（提升为标记，或写成实际的界）：\n\n> `TODO(perf-startup): 启动路径未测量；需要时先建一条最小测量 lane（见 `ssid-speed-up-perf`）。\n\n### 含糊的规模\n\n**原样**：\n\n> 归档大概 150 MB 左右。\n\n**改法**（写出处与确数）：\n\n> 归档 147 MB（本版构建实测）。\n\n## 写作语言滑落\n\n### 未翻译的排版残留\n\n**原样**：\n\n> 参数解析 ---- 私有 ---- 由 helper 负责。\n\n**改法**：\n\n> 参数解析由 helper 负责。\n\n## 行为可见的候选\n\n改动**模型或用户看得到**的文本时，先确认它有没有属主行为证据：\n\n- **有证据** → 按属主一起改，并跑受影响的检查（界面文案走 `verify-zh-ui.cjs`）。\n- **没有证据** → **保持不变并报告延后**，不要把它折进一次纯行文编辑。\n\n## 保留样本\n\n### issue 引用在任何表面都保留\n\n`#1470` 在 HEAD 处可解析；README 里保留它，不要挪进决策记录。\n\n### 运行时的新旧状态不是变更历史\n\n> 旧连接在新连接接受之前排空。\n\n讲的是**生命周期**，不是仓库历史。保留。\n\n### 中文行文里的比较级才是泄漏\n\n> grep `proxy\\.` 确认模板和脚本中**都不再有**未处理的 `proxy.` 引用。\n\n**泄漏的是\"都不再有\"**（比较级暗示一个未提交的前态），不是 `proxy.` 这个 token。改为：\n\n> grep `proxy\\.` 确认模板和脚本中无未处理的 `proxy.` 引用。\n\n### 合法载体里的变更叙事是内容本体\n\n> 本版从系统设置读取代理地址注入更新会话。\n\n这是**变更日志该说的话**，不是泄漏——它在 `docs/release-notes-*.md`。\n\n### 实测边界\n\n> 探针遍历 66 个文件，命中 202 处。\n\n数字加\"实测\"是可保留的出处；泄漏的是把某个**未提交草稿**的编号当成引用。\n\n### 可解析的仓外引用\n\n> 标准章节（RFC 9110 §10.1.5）与外部设计稿名可按其自有编号引用。\n\n§ 禁令覆盖的是**未提交的内部草稿**，不是外部标准或拥有自己 § 编号的已提交文档。\n\n## 过度修剪陷阱\n\n这四类**跨语言成立**，是修剪工作最危险的失败模式。每类给一个\"看起来在修剪、实际在破坏\"的例子。\n\n### 1. 把义务翻转成背书\n\n**原样**：\n\n> 升级报告只列出丢失的插件**声明**；插件本身不自动重装——避免旧版插件在新内核上白屏。\n\n**错误修剪**（删掉否定性保证，只留动作）：\n\n> 升级报告列出丢失的插件声明；插件自动重装。\n\n**为什么错**：\"不自动重装\"是**刻意的安全决策**，不是可以省掉的理由。删掉它，读者会以为重装是正常行为。\n\n**正确修剪**：整句保留（每条子句都在陈述当前契约），或压缩为：\n\n> 升级报告列出丢失的插件声明；插件不自动重装（旧版插件 × 新内核会白屏）。\n\n### 2. 把假设升格为已交付特性\n\n**原样**：\n\n> 若未来该插件发布 npm，可把依赖从 `file:./vendor/...` 切换为 registry 版本。\n\n**错误修剪**（删掉条件，留下动作）：\n\n> 依赖使用 registry 版本。\n\n**为什么错**：条件句是**未决状态**，删掉条件就变成陈述事实。\n\n**正确修剪**：保留条件，或改为 `TODO(\u003c插件名>-npm): 发布后切换为 registry 版本`。\n\n### 3. 连带删掉真事实\n\n**原样**：\n\n> 第一版 `mergeUserPatch` 只做顶层条目级对比，导致用户子条目被丢弃；现已改为递归合并。\n\n**错误修剪**（整句删除，因为带了\"第一版\"）：\n\n> （空）\n\n**为什么错**：这句里有**一条存活的事实**——\"合并必须递归到子条目\"。删掉它，下一个实现者会重犯。\n\n**正确修剪**（重述为当前状态视角）：\n\n> 合并必须递归到 `insert:` 列表的子条目：只做顶层条目级对比会丢弃用户追加的条目。\n\n### 4. 留下数字丢了出处\n\n**原样**：\n\n> 实测：512 层嵌套 ≈ 0.15 s（CI runner，Node 22）。\n\n**错误修剪**（删掉出处以求\"简洁\"）：\n\n> 512 层嵌套耗时 0.15 s。\n\n**为什么错**：**\"实测\"与测量环境是承重的**——没有它们，这个数字会被当成保证值。\n"},{"file":"skills/ssid-trim-cot-leakage/references/recall-batteries.md","group":"参考","date":"","slug":"recall-batteries","title":"探针","tags":["ssid-trim-cot-leakage","ssid-prose-standard","ssid-code-review"],"summary":"- 加 --hidden --glob '!.git/' 才能搜到点目录。 - 排除项写在最后，免得后面的包含项又把它们放回来：--glob '!vendor/' --glob '!nodemodules/' --glob '!references/'，再加上 scope 内的派生物目录。本 skill 自己的文件会引用泄漏措辞作校准——判断它们时应视作证据，不是使用。 - 中文行文直接匹配；英文","bytes":4057,"lines":51,"body":"# 探针\n\n针对[分类法](../SKILL.md#分类法)的探针。**每一个命中都需要语义判断**——探针按设计**会过度匹配**，而按本性又**匹配不足**：每一轮评审都会发现没有探针能抓到的案例。所以它们必须配一次**无模式的最密行文阅读**。\n\n## 调用规则\n\n- 加 `--hidden --glob '!.git/**'` 才能搜到点目录。\n- **排除项写在最后**，免得后面的包含项又把它们放回来：`--glob '!vendor/**' --glob '!node_modules/**' --glob '!references/**'`，再加上 scope 内的派生物目录。**本 skill 自己的文件会引用泄漏措辞作校准**——判断它们时应视作证据，不是使用。\n- 中文行文直接匹配；英文行文加 `-i`，让句首大写也能命中（`This PR adds…`、`Probably fine…`）。\n- **绑定完整短语**：`\\bthis PR\\b` 要匹配 `this PR adds`，而不匹配 `this project`、`this process`、`this provider`。\n- **一个零命中的模式什么都证明不了，直到它命中一个已知正例；一个嘈杂的模式什么都证明不了，直到它拒绝一个近失负例。** 两者都要先校准，再相信语料结果。\n\n## 中文探针（主探针集）\n\n```sh\n# 变更叙事与版本戳\nrg -n --hidden '第一版|本版|旧版|老的|曾经|原来|不再|以前|之前是|改成了|已改为|换成了'\n\n# 评审编排与面向评审者的辩解\nrg -n --hidden '评审|上一轮|本轮修正|按评审意见|评审要求|二次审查|被拒绝'\n\n# 模糊措辞与规划残留\nrg -n --hidden '大概|应该够了|暂时|先这样|凑合|回头再说|待定'\n\n# 指示性戳记（比上面几组更易误报，务必逐条判断）\nrg -n --hidden '本轮|本次|今天|现在|新的'\n```\n\n## 英文探针（保留）\n\n```sh\nrg -n --hidden -i '\\bthis PR\\b|\\bthis branch\\b|\\bprevious commits?\\b|\\bused to\\b|\\bno longer\\b|\\bpreviously\\b|rejected in review|\\bfor now\\b'\n```\n\n## 已知假阳性家族\n\n下列都是**判断后保留**的，**预期还会出现**：\n\n- **\"旧版/新版\"指交付物版本而非仓库历史** —— \"老用户安装 v0.1.13：启动时版本指纹不一致\"讲的是**安装场景**，不是代码变更史。\n- **release notes 与决策记录里的变更叙事** —— 那是**内容本体**（五个合法主场之一）。\n- **\"不再\"作为产品行为** —— \"点击导航条不再报错\"陈述的是**修复后的当前行为**；它的泄漏版本是\"（相对某个未提交的版本）不再报错\"。\n- **运行时的新旧状态** —— \"旧连接在新连接接受之前排空\"是生命周期，不是历史。\n- **`§N` 有已提交属主** —— 外部标准与拥有自己 § 编号的已提交文档仍可按节引用。\n- **\"实测\"** —— 出处词是承重的；\"(实测：512 层嵌套 ≈ 0.15 s)\"保留。\n- **反事实现在时** —— \"没有 X 时会发生 Y\"是回归钉，保留。\n- **`proxy.` 之类的代码 token** —— \"确认无未处理的 `proxy.` 引用\"里的 token 是规范名，不是变更叙事；泄漏的是\"都不再有\"这个比较级。\n- **判据文本自身引用泄漏示例词** —— 本 skill 与 `ssid-prose-standard`、`ssid-code-review` 的正文里**必然**出现「第一版」「不再」「本版」「评审」这些词：它们在**举例说明什么算泄漏**，或在**描述一个动作**（\"接受语义评审\"、\"更新 PR 描述让评审者看到真实计数\"），不是在泄漏。**用探针扫这一类文件时命中率会接近 100%，且几乎全是假阳性**——实测：本包 8 份 `SKILL.md` 命中 24 处，逐条判断后真泄漏为 **0**。这正是「探针是探针，不是定义」的实例。\n- **\"今天\"作当前行为解** —— \"行文陈述的是产品**今天**的行为\"指当前状态，不是版本戳。\n- **\"待定\"作 pending 解** —— \"待定的检查要报告为待定\"讲的是检查状态，不是模糊措辞。\n- **`SOURCE.md` 里的差异叙述** —— \"保留 / 改写 / 新增 / 删除\"是这类文件的内容本体（六个合法载体之一）。\n"},{"file":"skills/ssid-trim-cot-leakage/SKILL.md","group":"skills","date":"","slug":"SKILL","title":"修剪推理痕迹","tags":["ssid-trim-cot-leakage","ssid-prose-standard"],"summary":"在审阅中文或英文文档、注释与技能正文时，如果其中出现以写作会话（而非仓库当前状态）为视角的表述——「第一版」「不再」「旧版」「曾经」「本轮修正」「评审要求改为」等——或者需要判断某段历史叙述应当保留、改写还是移入变更日志时使用。","bytes":7077,"lines":54,"body":"\n# 修剪推理痕迹\n\n**推理痕迹**是**视角属于写作会话而不是仓库**的散文：它引用只有那个会话能看到的产物、叙述变更而不是状态、或者与一位已经离场的评审者辩论。\n\n当一段文字承担**事实性子句**时，修法**从来不只是删除**——把每条子句改写成能独立站在当前状态上，再删掉周围的记录。**不承担任何事实**的段落（一个审计编号、一段控制流叙述）直接删除。\n\n**REQUIRED BACKGROUND：** `ssid-prose-standard` 拥有本文引用的**完整命题规则**，它决定\"哪条子句必须存活\"。两者同批安装——只装本 skill 会让修剪变成删真事实。这是判据，不是脚本。\n\n## 唯一的测试\n\n对每段可疑文字问：\n\n> **一个处在 HEAD、拿不到任何会话记录、PR 讨论或未提交草稿的读者，能不能解析每一个引用、核实每一条断言？**\n\n不能 → 从仓库的视角重述存活的事实，删掉其余。\n能 → 它不是泄漏，无论听起来多像历史——**但\"可解析\"只过了本 skill 这一道闸**：在当前状态表面（README、文档、JSDoc）上，一段**可解析的变更故事仍然是变更叙事**，由第 3 类把它送回合法主场。\n\n## 分类法\n\n1. **死的设计会话引用** —— `(decision 7)`、`(audit C2)`、`设计 §4.7`、`计划 §1.4`、阶段标签（`T4`、`W3`、`P-I`）、\"设计台账\"、\"(B 裁决)\"。若该决策有已提交的属主，按名字与路径引用它；否则删掉引用，把它的**事实性子句重述为能独立成立**。\n2. **stack 与 PR 视角** —— \"本 stack 里后续的 PR\"、\"本 PR 新增\"、\"上一个提交\"。陈述已交付的机制或扩展点；推迟的工作移入 `TODO` 标记或 issue 引用。\n3. **变更叙事与版本戳** —— \"此前\"、\"不再\"、\"旧版 X\"，以及指示性戳记（\"v1\"、\"本版\"、\"今天\"、\"现在\"与过去状态对照）。陈述**当前行为**；一个已修复的回归变成**现在时的反事实**（\"没有 X 时会发生 Y\"），而**不是仓库历史**（\"以前会 Y\"）。\n4. **评审编排** —— \"评审中被拒绝：\"、\"评审者确认\"、草稿序号（\"本笔记的 v5\"）、轮次归属。保留存活下来的决策与理由作为**平实事实**；删掉**谁在何时说的**。\n5. **面向评审者的辩解** —— \"这个 cast 是安全的——它只是……\"、\"这是正确的，因为……\"。一段论证自己正确性的注释是对**评审者**说话，不是对维护者。**陈述使代码安全的那条不变量**，或者若代码已经展示它就删掉注释。\n6. **复述与推导记录** —— 控制流叙述（\"先做 X，再做 Y\"）、测试逐步讲解、显然分支的证明。**删除**；只留非显然的契约或不变量。\n7. **模糊措辞与规划残留** —— \"目前大概没问题\"、\"应该够了\"、没有标记的推迟。提升为 `TODO`/`FIXME` 或重述为**实际的界**；删掉模糊措辞。\n8. **写作语言滑落** —— 在语言本已一致的行文里混入未加工的工作语言片段、或未翻译的排版残留（如 `---- 私有 ----` 分隔符）。**翻译或删除**。\n\n## 什么不是泄漏\n\n**无辅助的引用检查会向两个方向出错**：删掉持久引用、留下死引用。下列保留规则**照写执行**：\n\n- **issue 引用** —— `#1470`、`TODO(name):`、\"issue #N 负责后续\"在 HEAD 处可解析；**任何表面都保留**，包括 README。不要把它们挪进决策记录。\n- **决策记录与排查记录里的已合并 PR 与 issue 引用** —— 那是被认可的变更故事证据。\n- **抑制理由** —— `oxlint-disable … -- 原因`、覆盖率忽略的理由、空 catch 的解释是**必需行文**；修正一条错误理由，**绝不删除它**。\n- **现在时反事实的回归钉** —— \"没有 X 时会发生 Y\"、\"一个朴素的 X 会……\"。\n- **实测边界** —— \"(实测：512 层嵌套 ≈ 0.15 s)\"在校准一个常量；**\"实测\"这个出处词是承重的**。\n- **运行时的新旧状态** —— \"旧连接在新连接接受之前排空\"讲的是**运行时生命周期**，不是变更历史。\n- **变更故事段内的历史阶段名** —— \"第一版交付了 X\"在那里是当前状态安全的；但指示性戳记（\"本版\"）**在所有地方都禁用**。\n- **按设计可解析的仓外引用** —— 标准章节（RFC 9110 §10.1.5）、外部设计稿名；§ 禁令覆盖的是**未提交的内部草稿**，不是外部标准或拥有自己 § 编号的已提交文档。\n- **项目口吻与文体形制** —— \"我们\"作为项目口吻；一份记录的\"备选方案\"节。\n- **变更叙事在本仓库有六个合法载体** —— `docs/release-notes-*.md`、`docs/决策/`、`docs/设计/`、`docs/排查/`、`shell/docs/pitfalls.md`，以及**任何 skill 目录下的 `SOURCE.md`**（它记录该 skill 与上游的差异，变更叙事就是它的内容本体）。在这些文件里它是**内容本体**，不是泄漏。修剪**默认不进入**这些路径；确需进入时须由用户显式指定 scope。\n\n## 工作流\n\n1. **定 scope 与豁免**：除 `vendor/` 与同步链的冻结副本外，**默认排除上面六个合法载体**。默认把 scope 收窄到**指令表面**：`skills/*/SKILL.md`、`docs/SSiD开发手册.md`、插件 README、JSDoc 与注释。\n2. **先只读审计**：跑[探针](references/recall-batteries.md)（带 `--hidden`），**每条探针先对一个已知正例与一个近失负例校准**，再语义判断每一处命中。**探针是探针，不是定义**——同时无模式地读 scope 内最密的行文（模块 JSDoc、README、skill 正文）。\n3. **按表面 owner-first 修**：源侧注释先改，再重新生成派生物（`lib/`、`shell/profile-template/`）；界面字符串改动走 `verify-zh-ui.cjs`。\n4. **删任何东西之前先枚举该段的命题**（`ssid-prose-standard` 的完整命题规则），并查[过度修剪陷阱](references/examples.md)——把义务翻转成背书、把假设升格为已交付特性、连带删掉真事实、留下数字丢了出处。**这一步是防过度修剪的唯一闸门。**\n5. **验证**：重跑探针，期望只剩合法命中、本 skill 自身的文件与出处引用的证据；确认每条留下的引用在 HEAD 处可解析；改动后**重跑受影响的 L1（typecheck + test）**。\n\n> **本仓库没有文档门禁。** 这一步别处靠 `doc-sync` 一类检查兜底，**这里没有东西替你把关**——验证就是重跑探针加上人对 diff 的判断。不要假设有自动化会接住遗漏。\n"},{"file":"skills/ssid-trim-cot-leakage/SOURCE.md","group":"skills","date":"","slug":"SOURCE","title":"来源与版本","tags":["ssid-trim-cot-leakage","dsh-trim-cot-leakage","ssid-prose-standard"],"summary":"保留（判据一字未减）： - The one test（唯一的测试）整段：一个处在 HEAD、拿不到任何会话记录、PR 讨论或未提交草稿的读者，能不能解析每一个引用、核实每一条断言？ 这是整份 skill 的支点，与语言无关。 - Taxonomy 的 8 类全部保留。 - What is not leakage 的 9 条保留规则全部保留。 - 引用检查会向两个方向出错（删掉持久引用、留下死引用）","bytes":4276,"lines":58,"body":"# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | `dsh-trim-cot-leakage` |\n| 上游路径 | `DSHFork/.agents/skills/dsh-trim-cot-leakage/` |\n| 上游版本锚点 | `c291e7961a`（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 45 行 + `references/examples.md` 275 行 + `references/recall-batteries.md` 52 行 = **372 行** |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（references 重写 + scope 规则本地化） |\n| 依赖 | `ssid-prose-standard`——**双向依赖，同批安装** |\n| 适配依据 | `seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-02-推理痕迹修剪.md` |\n\n## 与上游的差异\n\n**保留**（判据一字未减）：\n\n- `The one test`（唯一的测试）整段：**一个处在 HEAD、拿不到任何会话记录、PR 讨论或未提交草稿的读者，能不能解析每一个引用、核实每一条断言？** 这是整份 skill 的支点，与语言无关。\n- `Taxonomy` 的 8 类全部保留。\n- `What is not leakage` 的 9 条保留规则全部保留。\n- 引用检查会**向两个方向出错**（删掉持久引用、留下死引用）这一前提。\n\n**改写**：\n\n- 引言：依赖声明指向 `ssid-prose-standard`，并注明两者必须同批安装。\n- 第 8 类「写作语言滑落」：上游讲「英文文档里混入中文」，本仓库主体是中文，改为**同语言内的滑落**（未加工的工作语言片段、未翻译的排版残留）。\n- `Workflow` 5 步：scope 新增五个合法主场豁免，并默认收窄到指令表面；删掉本仓库不存在的门禁（`verify-type-equiv` / `verify-translation-pairing`），换成重跑受影响的 L1。\n\n**新增**：\n\n- **第 10 条保留规则——五个合法主场**：`docs/release-notes-*.md`、`docs/决策/`、`docs/设计/`、`docs/排查/`、`shell/docs/pitfalls.md`。依据：本仓库实测扫描在 `**/*.md` 上命中 202 处，**分布集中于这些路径**；而 `skills/*/SKILL.md` 等指令表面只有少量命中却最致命。上游只认 Agent Notes 一个主场，本仓库有五个。\n- **无文档门禁的显式警告**：上游第 5 步靠 `doc-sync` 一类检查兜底，本仓库没有——这条写   var t=ev.target.closest?ev.target.closest("[data-file],[data-st],[data-tag],[data-ym],[data-back],[data-clear]"):null;
  if(!t)return;
  if(t.hasAttribute("data-file")){S.file=t.getAttribute("data-file");}
  else if(t.hasAttribute("data-st")){var v=t.getAttribute("data-st");S.st=S.st===v?null:v;}
  else if(t.hasAttribute("data-tag")){var g=t.getAttribute("data-tag");S.tag=S.tag===g?null:g;}
  else if(t.hasAttribute("data-ym")){var y=t.getAttribute("data-ym");S.ym=S.ym===y?null:y;}
  else if(t.hasAttribute("data-back")){S.file=null;}
  else if(t.hasAttribute("data-clear")){S.st=null;S.tag=null;S.ym=null;S.q="";E("q").value="";}
  drawSide();draw();setHash();
});

var timer=null;
E("q").addEventListener("input",function(){
  clearTimeout(timer);
  var v=this.value.trim();
  timer=setTimeout(function(){S.q=v;S.file=null;draw();},140);
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="/"&&document.activeElement!==E("q")){ev.preventDefault();E("q").focus();}
  if(ev.key==="Escape"){if(S.file){S.file=null;draw();setHash();}else if(document.activeElement===E("q")){E("q").blur();}}
});
window.addEventListener("hashchange",function(){
  var f=location.hash?decodeURIComponent(location.hash.slice(1)):null;
  S.file=(f&&DATA.entries.some(function(x){return x.file===f;}))?f:null;
  draw();
});

if(location.hash){
  var f0=decodeURIComponent(location.hash.slice(1));
  if(DATA.entries.some(function(x){return x.file===f0;}))S.file=f0;
}
E("stat").innerHTML=DATA.entries.length+" 篇 · "+(DATA.totalBytes/1024/1024).toFixed(2)+" MB · "+DATA.generatedAt.slice(0,10);
drawSide();draw();
})();</script>
</body></html>
