<script>var DATA={"entries":[{"file":"docs/适配说明/2026-09-10-DSH-skills适配清点.md","group":"适配说明","date":"2026-09-10","slug":"DSH-skills适配清点","title":"DSH skills 适配清点","tags":["dsh-skills","dsh-doc","dsh-trim-cot-leakage","dsh-code-review","dsh-merging-stacked-prs","dsh-ci-test-reliability","dsh-prose-standard","dsh-find-simplifications","dsh-pre-push-checks","dsh-speed-up-perf","dsh-translate-docs","dsh-archive-agent-notes"],"summary":"调查前的认知是\"12 个 skill = 12 个 SKILL.md\"。实际是 12 个技能包，共 2956 行：","bytes":21844,"lines":256,"body":"# DSH skills 适配清点\n\n> **调查范围**：`DSHfork/.agents/skills/` 全部 12 个技能包。\n> **调查方法**：逐个通读 `SKILL.md` 全文（12 个，1254 行），并核实包内结构；`references/` 与 `templates/` 按需查阅。\n> **判断依据**：本系列 15 批精读得到的\"为什么\"，加上对 SSiD 现状的了解（单人开发、无 CI 池、无双语制度、无 Agent Note 制度）。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n---\n\n## 一、先说一个结构性发现：skill 是\"技能包\"，不是单个文件\n\n调查前的认知是\"12 个 skill = 12 个 SKILL.md\"。实际是 **12 个技能包，共 2956 行**：\n\n| 组成 | 文件数 | 行数 | 作用 |\n|---|---:|---:|---|\n| `SKILL.md` | 12 | 1254 | 入口与判断标准 |\n| `references/` | 8 | 1037 | 细节材料，按需加载 |\n| `templates/` | 4 | 361 | 写作骨架（仅 `dsh-doc`） |\n| `scripts/` | 2 | 440 | 可执行工具（仅 `record-browser-gif`） |\n\n**包体重差异很大**：`dsh-doc` 是 861 行（SKILL.md + 5 references + 4 templates），`dsh-trim-cot-leakage` 是 372 行（SKILL.md + 2 references），而 `dsh-code-review`、`dsh-merging-stacked-prs` 等只有单个 SKILL.md。\n\n**这本身是设计要点**：`SKILL.md` 保持精简（45–172 行）以便随时加载，重材料外置按需读取。`dsh-doc` 里有一句把它说透了：\n\n> **Load only the reference needed for the task.** Each reference links directly from this file **so the skill has no deep reference chain.**\n\n---\n\n## 二、三分类总表\n\n| # | skill | 行数 | 判定 | 一句话理由 |\n|---:|---|---:|---|---|\n| 1 | `dsh-ci-test-reliability` | 191 | **✅ 小改即可用** | 内容几乎全是跨平台/并发/时序的通用可靠性判据 |\n| 2 | `dsh-trim-cot-leakage` | 372 | **✅ 小改即可用** | 判据通用；且直接对应你的待办 #8 |\n| 3 | `dsh-prose-standard` | 223 | **✅ 小改即可用** | 文字判据通用，仅需删掉 DSH 专有的位置类型 |\n| 4 | `dsh-code-review` | 52 | **🔧 需适配** | 检查骨架通用，但要重写\"事实来源\"清单与 DSH 专有条款 |\n| 5 | `dsh-find-simplifications` | 157 | **🔧 需适配** | 判据高度通用，但流程绑在 DSH 的包结构与 Agent Note 制度上 |\n| 6 | `dsh-pre-push-checks` | 128 | **🔧 需适配** | \"选最小验证集\"的判据通用，具体命令与目录规则全是 DSH 的 |\n| 7 | `dsh-speed-up-perf` | 91 | **🔧 需适配** | 测量纪律通用，但它依赖 DSH 的 benchmark 基础设施与 CI 性能门禁 |\n| 8 | `record-browser-gif` | 612 | **🔧 部分可用** | 录制与编码通用（含 337 行可复用编码器），发布流程绑 PR 制度 |\n| 9 | `dsh-doc` | 861 | **⛔ 现在不适用** | 依赖整套文档制度（kind 系统、4 模板、字数预算、双语、网站投影） |\n| 10 | `dsh-translate-docs` | 74 | **⛔ 现在不适用** | 完全依赖双语配对制度 |\n| 11 | `dsh-archive-agent-notes` | 68 | **⛔ 现在不适用** | 依赖 Agent Note 制度——但它是待办 #7 的直接参考 |\n| 12 | `dsh-merging-stacked-prs` | 127 | **⛔ 现在不适用** | 依赖 GitHub stacked PR，单人开发用不上 |\n\n---\n\n## 三、小改即可用（3 个）\n\n### 1. `dsh-ci-test-reliability`（131 + 60 行）\n\n**这是 12 个里通用性最高的。** 它解决的问题是\"测试在真实 CI 拓扑下才暴露的失效\"，而这些问题与仓库规模无关。\n\n**通用判据（几乎可原样保留）**：\n\n- **执行拓扑四层模型**：同一 Vitest 文件内 → 不同 worker 进程 → 同一 job 内的独立进程 → 共享主机的不同 job。\"除非当前配置证明不然，**假设这些层会重叠**\"\n- **\"进程隔离不隔离主机的端口、可预测文件系统路径、外部服务、数据库、socket 或继承的子进程。\"**\n- **\"不要因为一个 fixture 缺隔离就把整个套件串行化。\"**（\"顺序化一个 Vitest 块无法保护主机资源免受另一个文件、进程、job 或 runner 的干扰\"）\n- **用资源所有者的分配器，而不是\"先检查可用、稍后再占\"**：网络用 `listen(0)` 读回分配到的地址；**绝不要扫描空闲端口然后稍后绑定**\n- **进程全局状态清单**：`process.env`、`cwd`、假计时器、locale 与时区、模块 mock、注册表、console 钩子、`globalThis`、全局 `fetch` 拦截——**都当作独占可变资源**；变更时\"捕获原值是缺失还是存在 → 恢复那个确切状态 → 立即注册恢复 → 最小作用域 `try/finally` → 保留 `afterEach` 兜底\"\n- **平台自有语义 4 条**（Windows 特有）：mtime 精度不足、环境变量名大小写不敏感、文件句柄异步释放（需要\"按实测争用规模定大小的有界重试\"）、无 POSIX 权限与信号语义\n- **超时预算**：\"`describe` 或 case 超时会**覆盖** runner 的 `--testTimeout` 而不是让位\"；**\"提升测试预算时要一起提升 hook 预算\"**（否则\"只提升 case 预算会把一次争用失败挪进 `afterEach`\"）\n- **\"固定的 sleep 不是 setup 完成或清理结算的证据。\"** 等显式就绪事件/握手/状态转移/自有 promise/可外部观察的条件；**\"超时只用来界定等待，绝不用作让断言成立的条件\"**\n- **释放干净**：\"调用 `abort()`、`close()` 或 `kill()` 而不等待自有的完成信号，是**不完整的拆除**\"\n- **拒绝掩盖式修复（7 条）**：加超时而不指明等待的状态、加重试、全部串行、吞掉错误、弱化断言、归一化不稳定行为、清理前加 sleep\n- **而\"恢复预算不是掩盖\"**：把套件提升到它本来就有的 lane 预算，或\"按 runner 上实测的争用规模定有界重试\"，都是\"**命名了等待的工作并归还了 lane 已授予的量**\"\n- **\"只做诊断的请求保持只读：报告原因与证据，除非用户同时要求修复。\"**\n\n**需要适配的**：`docs/testing.md`、`docs/defensive-patterns.md`、`snapshots/AGENTS.md` 这些 DSH 文档引用；以及 `references/ci-flake-diagnosis.md`（60 行，绑 DSH 的 CI 拓扑）。\n\n### 2. `dsh-trim-cot-leakage`（45 + 327 行）\n\n**直接对应你的待办 #8（CoT 泄漏探针）**，而且它比第 02 批我读到的决策记录更完整——**决策记录给了原理，这个 skill 给了可操作分类**。\n\n**核心判据只有一句**（\"The one test\"）：\n\n> 对每一段可疑文字问：**一个在 HEAD 处、无法访问任何会话记录、PR 讨论或未提交草稿的读者，能否解析每一个引用、核实每一条主张？** 若不能，就用仓库视角重述仍成立的事实并删掉其余部分。\n\n**8 类泄漏**（每类都有具体模式）：失效的设计会话引用、Stack/PR 视角、变更叙事与版本戳、评审编排、面向评审者的自我辩护、重述与推导记录、模糊措辞与规划残留、撰写语言滑落。\n\n**9 条 keep 规则**（**这一节是防过度清理的关键**）：issue 引用、Agent Note 里的已合并 PR 引用、抑制理由、反事实现在时、**带 `measured` 的实测边界**（\"provenance 词 `measured` 是承重的\"）、运行时旧/新状态、note 变更史段落里的历史阶段名、**按设计在仓库外解析的外部引用**（RFC 章节号、Figma 帧名）、项目声音与体裁形式。\n\n**工作流 5 步**，其中第 2 步是你待办 #8 要的方法：**先只读审计，跑召回探针（带 `--hidden`），每条探针在信任其输出之前，用一个已知正例和一个近似负例校准，然后逐条语义判断**——并且\"**探针不是定义**：原始清除的每一轮评审都发现了探针漏掉的情况，所以在没有模式在手的情况下，也去读范围内最密集的文字\"。\n\n**需要适配的**：DSH 专有路径（`docs/AGENTS.md#writing-rules`、`verify-type-equiv`、`verify-translation-pairing`）、`references/recall-batteries.md`（52 行，探针清单要按 SSiD 的词汇重写）、`references/examples.md`（275 行，示例要换成 SSiD 的）。\n\n### 3. `dsh-prose-standard`（81 + 142 行）\n\n**文字判据通用，本体只需小改。**\n\n**核心**：\"**写够以保住契约，然后移除推理记录、重复和装饰。**\"\n\n**\"保住完整命题\"一节是精华**——编辑前先识别段落里的每个命题，逐项保留：行为者与动作 / 条件、时机与顺序 / 情态（必须、可以、绝不）/ **负面保证与例外** / 归属、副作用、失败模式与后果。配套两句硬话：\n\n- **\"字数更少本身不是改进。\"**\n- **\"不要为了满足删除目标而制造编辑。\"**\n\n**\"按文字位置要求的覆盖\"一节（11 类）**是最可直接移植的部分：公开 JSDoc / 内部注释 / 模块注释 / 测试 / 教程 / README / Agent Note / 事故复盘 / **skills 与 agent 指令** / 示例与配置注释 / 提示词与可见字符串 / 诊断信息——**每类都写明\"该有什么\"和\"该删什么\"**。\n\n**Borderline 的定义值得抄**：\"只有当**至少两个版本都满足完整命题规则、但交换了被接受的原则**，且本 skill 不解决这个权衡时，才算 borderline。**一个只有单一保命题答案的改写不是 borderline。**\"\n\n**互动模式还给出了知识沉淀机制**：用户决定后，\"**把原则和版本提炼进 examples，不带 PR 历史或评审叙述**\"。← **这正是你说的\"知识沉淀\"，而且是它写明的做法。**\n\n**需要适配的**：`vendor/` 与 `archived/` 排除（SSiD 无此结构）、`verify-client-ui-i18n`（无此门禁）、`adding-a-package.md`（无此文档）。\n\n---\n\n## 四、需适配（4 个）\n\n### 4. `dsh-code-review`（52 行）\n\n**\"Manual checks\"那 16 条是全篇价值所在**，且绝大多数与仓库规模无关：\n\n- **意图与接口契约**：追踪每个变更接口的两侧\n- **生命周期与并发**：异步 setup、回调、进程、拆除——\"检查发布前的竞态、await 期间的取消、独立错误上报、回调包含、重入前的归属、完整的 detach 清理、静默拆除\"\n- **能力与消费者匹配**：追踪每一个当前消费者；**反向也要查**——\"一个通用服务上的新公开方法，若唯一调用者是一个内部消费者，那是**不必要的 API 扩张**\"\n- **范围、归属与必要性**：把每个抽象、状态机、选项、防御性拷贝映射到它的当前契约、生产消费者与归属方\n- **配置与公开选择**：问\"每个默认值、公开操作集、格式有什么当前消费者证据或先例支持\"；**\"当证据缺失时，要求一个显式选择或显式推迟\"**\n- **模型视角**：检查模型实际收到的提示词、工具 schema、结果与诊断\n- **执行路径**：跟踪每条拒绝路径到真正执行它的操作\n- **界限覆盖最终操作**：定位完整产物的所有者，**探测极小与精确边界**\n- **真实入口路径**：测试要走真实 Loader/bin/worker\n- **测试强度**：\"断言在预期的回归上失败，并验证外部状态、日志、事件或释放，**而不是复述实现或相信 agent 的报告**\"\n- **\"覆盖率是必要的，但不是场景正确的证据。\"**\n- 报告部分：**\"把阻塞项与建议分开，并**省略已被绿色门禁强制的问题**\"**，以及**\"收到评审时，逐条核实，用技术理由修复或反驳，不要表演式同意\"**\n\n**需要适配的**：`Sources of truth` 那 8 个链接全部指向 DSH 文档；`Blocking requirements` 里 #3（subsystems/type-equiv）、#4（Cordis 注册）、#5（invariant companions）、#7（locale 文案）是 DSH 专有；`change-scope` 脚本不存在。\n\n### 5. `dsh-find-simplifications`（157 行）\n\n**判据通用、流程专用。**\n\n**\"什么算强候选\"9 条**（可原样用于 SSiD）：\n\n- 公开方法/事件/配置项/注册表通知/helper/包/持久事件/测试产物**没有生产消费者**\n- 只有测试或文档是消费者，而它们钉住的行为**不承重**\n- 两种表示**镜像同一个事实**\n- 一个接缝有每个实现都必须支持、但**没有消费者使用**的方法\n- 独立包只为测试/demo/支持代码存在\n- 特性实现的是**投机性通用**\n- 不变量/回滚路径/期望输出集/特例测试**只为保护一个未使用的 API 而存在**\n- 手搓代码重实现了成熟外部包或 Node 内置已经提供的\n- **简化后的行为可以略有不同，但新行为仍然合理且更易解释**\n\n配套的反例同样重要：**\"薄弱候选不足以写 Agent Note\"**——删一个错字、跑一次 `knip`、移除一个有意记录的后端/适配器、**\"无调用点证据地说'这看起来复杂'\"**。\n\n**\"消费者三分类\"是可复用的判据**：生产语料（`src`、运行时脚本、loader/config 路径）/ 非生产语料（测试、README/docs、Agent Note、快照、生成的期望输出、注释）/ **歧义语料（可能是产品冒烟路径的示例和脚本——分类前先查用法）**。\n\n**\"拒绝或降级一个候选\"4 条**：存在生产调用者（那就是特性决策而非清理）/**API 由一个已实现的 Agent Note 或一个来之不易的防御模式明确论证过，而新证据没有击败那个理由**/移除会迫使无关翻腾而不真正减少公开 API/想法正确但太小（**那就加一个有针对性标签的 TODO**）。\n\n**需要适配的**：`.agents/notes/` 制度、DSH 的包结构、`rg` 工作流细节、\"Coalesce Superseded Agent Notes\"整节（依赖待办 #7）。\n\n### 6. `dsh-pre-push-checks`（128 行）\n\n**判据通用**：\"选取**覆盖即将推送或被刚推送 diff 的最小测试与检查**，而不是反射式地跑全仓库套件\"。\n\n**通用条款**：\n\n- **\"除了钩子，不存在通用的本地基线。\"** 每个行为变更需要\"**能因它的回归而失败的最窄可用测试**\"\n- **\"不要仅仅因为接下来要 commit 或 push 就手工重跑一个已经通过的检查。\"**\n- **\"测试选择与覆盖率选择是两回事。\"**\n- **\"不要推送并指望 CI 表现不同。\"**\n- 失败时的四条证据纪律：记录确切命令/失败测试/平台特定不匹配 → 确认相关的非平台证据 → **优先修跨平台不确定性** → 只有用户明确要求才绕过本地钩子，并报告究竟什么失败了、为什么期望 CI 不同\n- 历史重写保护：`--force-with-lease=\u003cbranch>:\u003cobserved-oid>`，\"**裸 `--force` 永远不允许**\"\n- 一条很实用的诊断：`gh pr checks` 报 \"no checks reported\" 且 `total_count: 0` 时，**那不是基础设施问题，是 PR 处于冲突状态**——\"GitHub 在 PR 为 `CONFLICTING`/`DIRTY` 时不创建 `pull_request` 工作流运行\"，而\"空提交、`--allow-empty` 推送、draft/ready 切换、revert-and-restore 弹跳都会让 `total_count` 保持 0，并增加垃圾历史\"\n\n**需要适配的**：`change-scope` 脚本、8 类变更对应的具体 pnpm 命令、snapshot 目录规则、`gh stack` 相关整节。\n\n### 7. `dsh-speed-up-perf`（91 行）\n\n**测量纪律通用，基础设施专用。**\n\n**测量卡片（7 字段，实施前必填）**是全篇最有价值的形式：用户操作 / 工作负载 / 入口路径 / 时钟 / 内存 / 判定 / 行为。\n\n**通用判据（可直接用）**：\n\n- **\"一个可疑的循环、未使用的缓存，或一个大文件，本身不是瓶颈的证据。\"**\n- **\"变化独立成本驱动量：字节、持久事件、紧凑记录、原始增量、轮次、工具、子项、可见 DOM 节点是不同的量。\"**\n- **\"不要在不检查它压的是什么用户操作的情况下，把大批量微小的相同消息称为'真实的'。\"**\n- **\"绝不让 fixture setup 偷偷预热一个冷场景。\"**\n- **\"一个解析后丢弃的基线，与经过验证的保留历史不可比。\"**\n- **\"不要为了让回归通过而放宽预算或挑选幸运的一次运行。\"**\n- **\"不要仅为测量而新增生产导出，也不要把算法复制进一个'基准实现'。\"**\n- **\"推迟不是删除\"**，视口高亮不是完全虚拟化\n- **\"一个宽到让回归通过的阈值不是保护；一个低于已核实噪声底的预算也不可靠。\"**\n- **\"不要静默截断历史、跳过工具结果、禁用不变量，或为了达到一个数字而改变生命周期语义。\"**\n- **\"当收益在端到端处消失、典型工作负载实质回归、复杂度超过小收益、或取消/保留/持久性无法被解释和测试时，拒绝这个优化。\"**\n- **\"不要仅仅因为报告来自 bot 就驳回它。\"**\n- 结果汇总格式：**工作负载 → 前后绝对值与比率 → 端点与内存语义 → 行为证据 → 负对照 → 实际执行的检查 → 排除项**，并**分开陈述作者自报的历史数字、新的本地测量与 CI 证据**\n\n**需要适配的**：`benchmarks/AGENTS.md`、既有 benchmark lane、CI 性能门禁——**SSiD 没有这套基础设施**。判据可以先归档，等有性能需求时再建。\n\n---\n\n## 五、不适用（现在）（4 个）\n\n| skill | 为什么不适用 | 但有什么值得留下 |\n|---|---|---|\n| `dsh-doc`（861 行） | 依赖整套文档制度：kind 系统 + 4 个模板 + 字数预算清单 + 双语配对 + 网站投影 | **\"Fact-check procedure: test, do not assume\" 那 5 条**——\"对操作类主张，唯一可接受的证据是你亲手跑过\"；\"删除你无法复现的东西——**当一条主张无法复现时，改的是主张，不是测试**\"。这 5 条与仓库规模无关，值得单独提取 |\n| `dsh-translate-docs`（74 行） | 完全依赖双语配对制度（三文件配对、blob 哈希 sidecar、`verify-translation-pairing`） | 一条洞察：**\"绝不要为应用一次更新而重译整个文档——最小更新保住了一切未改动内容的已评审措辞；重译把它们扔掉。\"** 以及 frontmatter 的 `disable-model-invocation: true` 机制本身（**危险或昂贵的操作禁止模型自动调用**） |\n| `dsh-archive-agent-notes`（68 行） | 依赖 Agent Note 制度——SSiD 还没建（你的待办 #7） | **整份都是待办 #7 的直接参考**，尤其\"Calibrated examples\"一节：**用具体篇目 + 字数校准归档判断**，并明说\"**这些示例设定标准；字数证明大小不是标准**\" |\n| `dsh-merging-stacked-prs`（127 行） | 依赖 GitHub 原生 stacked PR + `gh stack` 扩展；单人开发没有依赖链 | 三条通用判据：\"**取当前 PR 元数据与确切 head OID，而不是相信分支名或之前的报告**\"；\"**不要仅因为存在刷新机制就重写分支**\"；\"**任何历史重写都会让 commit-OID 假设失效**——重新取确切 head 并重新审计\"；以及删除分支的门槛\"**除 `0` 以外的任何结果都阻止删除**\" |\n\n---\n\n## 六、部分可用（1 个）\n\n**`record-browser-gif`（172 + 440 行）**\n\n它其实由三段组成，可用性各不相同：\n\n| 段 | 行数 | 判定 |\n|---|---:|---|\n| **录制与证据链纪律** | SKILL.md 前 115 行 | **✅ 通用**——\"一次分镜就是一次证据运行\"、fresh state roots、失败整场丢弃、\"等待唯一语义定位器\"、`exact: true` 防止匹配到提示词回显 |\n| **编码器 `scripts/encode_gif.py`** | 337 行 | **✅ 可直接复用**——纯工具，含 103 行自测；只依赖 `ffmpeg`/`ffprobe` |\n| **发布流程（`gh --attach` / assets 分支）** | SKILL.md 后 57 行 | **🔧 依赖 PR 制度**——但若 SSiD 的 GitHub 流程有 PR 评审，这段也可用 |\n\n**最值得直接拿来的一条**：编码器的参数设计里有一句——\n\n> `--speed` 改变播放速度；**在 GIF 旁边披露它和选定的区间，这样演示就无法暗示被测量的响应延迟。**\n\n---\n\n## 七、适配的优先顺序建议\n\n按\"收益 ÷ 工作量\"排序：\n\n| 顺序 | skill | 理由 |\n|---:|---|---|\n| **1** | `dsh-ci-test-reliability` | 通用性最高、改动最小；SSiD 有测试也有跨平台问题，立刻用得上 |\n| **2** | `dsh-trim-cot-leakage` | 直接清掉你的待办 #8；判据与分类都是现成的 |\n| **3** | `dsh-prose-standard` | 补齐\"文字判据\"这一层；11 类位置的覆盖清单可直接移植 |\n| **4** | `dsh-code-review` | SSiD 若有评审环节就能用；16 条 manual checks 是现成骨架 |\n| **5** | `dsh-find-simplifications` | 判据好，但流程改造量大 |\n| **6** | `record-browser-gif` 的编码器 + 录制段 | 工具可直接搬 |\n| 7–10 | 其余四个 | 等 SSiD 长出对应制度（Agent Note、文档体系、双语、多人协作）再回来 |\n\n---\n\n## 八、两个需要你决定的点\n\n1. **落点结构与命名**：DSH 用 `.agents/skills/\u003cname>/SKILL.md` + `references/`。SSiD 要不要照这个结构？如果照，名字前缀该用什么（DSH 用 `dsh-`，我们大概用 `ssid-`）？\n\n2. **适配的产品是什么**：是产出**可直接放进 SSiD 的 skill 文件**，还是先产出**逐个 skill 的\"适配说明\"**（列出它依赖 DSH 的哪些前提、在 SSiD 该怎么改）？\n\n   我倾向后者——因为按第 12 批学到的\"**软技能**\"（`dsh-prose-standard` 自称的 *\"It is guidance, not a script\"*），适配的价值恰恰在那些**判断依据**上，而不是让文件长得像。先有说明、再生成文件，也便于你逐条复核。\n\n---\n\n## 附：本次调查的过程记录\n\n- 分批通读 12 个 `SKILL.md`（约 1254 行），核实包内结构（`references`/`templates`/`scripts` 共 1702 行）\n- 未读：`dsh-doc` 的 5 个 references 与 4 个 templates（733 行）、`dsh-translate-docs` 之外的 i18n 材料、`record-browser-gif` 的 Python 脚本（440 行，只核了行数与自测存在）\n- 上述判断中，凡标注\"通用\"的条款，都是我**逐一读过原文**的；凡涉及 SSiD 现状的推断（如\"单人开发不用 stacked PR\"），依据是你此前告知的项目背景，**未独立核实**。\n"},{"file":"docs/适配说明/2026-09-10-skill适配说明-01-测试可靠性.md","group":"适配说明","date":"2026-09-10","slug":"skill适配说明-01-测试可靠性","title":"skill 适配说明 01：测试可靠性","tags":["@types/node","@22.20.1/test.d.ts","dsh-ci-test-reliability","dsh-skills","ssid-test-reliability","dsh-chat-rail","dsh-quick-toolbar","dsh-ssid-panels","dsh-code-review","dsh-pre-push-checks","ssid-release","dsh-ssid-zh-ui","dsh-plugin-center","dsh-capture"],"summary":"1. 改动最小——它的内容几乎全是跨平台、并发、时序的通用判据，与仓库规模无关 2. SSiD 立刻用得上——你们有 vitest（10 个插件）、node:test（4 处载体：shell 本体、dsh-chat-rail、dsh-quick-toolbar、dsh-ssid-panels）、Playwright（真实浏览器），且要跨 Windows/macOS 3. 它是别的 skill 的依","bytes":30124,"lines":380,"body":"# skill 适配说明 01：测试可靠性\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。复核通过后才生成 skill 文件。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 这是本系列的第一份，因此它同时**示范适配说明的格式**，后续 11 个照此办理。\n\n**上游 skill**：`dsh-ci-test-reliability`\n**上游位置**：`DSHfork/.agents/skills/dsh-ci-test-reliability/`（`SKILL.md` 131 行 + `references/ci-flake-diagnosis.md` 60 行）\n**上游版本锚点**：本次读取自 DSHfork 工作副本，HEAD 为 `c291e7961a`（detached at origin/master），抓取日期 **2026-09-10**\n**清点分类**：✅ 小改即可用（见 `2026-09-10-DSH-skills适配清点.md`）\n**拟落点**：`seek-soul-in-darkness/.agents/skills/ssid-test-reliability/`\n\n---\n\n## 一、为什么先做这一个\n\n1. **改动最小**——它的内容几乎全是跨平台、并发、时序的通用判据，与仓库规模无关\n2. **SSiD 立刻用得上**——你们有 vitest（10 个插件）、node:test（**4 处载体**：shell 本体、dsh-chat-rail、dsh-quick-toolbar、dsh-ssid-panels）、Playwright（真实浏览器），且要跨 Windows/macOS\n3. **它是别的 skill 的依赖**——`dsh-code-review` 与 `dsh-pre-push-checks` 都指向它，先做它能解锁后面两个\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n> **核实方法**：扫各 `package.json` 的 `test` 脚本 + 读运行器配置 + **读 `node_modules` 里运行器自己的源码与类型声明**。最后一项是有意的：第一版我按印象写了\"12 个 vitest 插件\"，回去核对原文发现是错的（见 2.3）。\n\n### 2.1 运行器全景\n\n| 运行器 | 载体 | 触发方式 | 超时配置 |\n|---|---|---|---|\n| **node:test**（4 处载体，SSiD 主力） | shell 本体（2 文件） | `npm test` → `node --import tsx/esm --test tests/profile-merge.spec.ts tests/codegraph-adapt.spec.ts` | **无** |\n| | dsh-chat-rail、dsh-quick-toolbar | `npm test` → `node --import tsx/esm --test tests/**/*.spec.ts` | **无** |\n| | dsh-ssid-panels（2 文件） | **无 npm 脚本**，靠 `ssid-release` skill 手跑单文件 | **无** |\n| **vitest 4.1.11**（10 处，全是插件） | `max-null-plugins/` 下 10 个插件 | `npm test` → `vitest run` | 仅 4 个有 config，且只设 `include` + `environment` |\n| **Playwright 1.57.0** | `shell/tests/plugin-adapt/`：`cases/` + `baselines/` + `helpers/ssid.ts` + 60 余个 `.mjs` 探针 | `npm test` → `playwright test` | 60 s 用例 / 30 s 导航 / 15 s 动作（**三层递减**） |\n| CI | 仅 `.github/workflows/build-mac.yml`（其余为本地/手动） | — | — |\n\n**两个与预期相反的结论**：\n\n1. **node:test 才是 SSiD 的主力**（4 处载体），vitest 是插件专属（10 个但全在 `max-null-plugins/`）。所以上游那份面向\"CI 里的 vitest\"写的 skill，移植到 SSiD 时**主力运行器反而是上游没细讲的那个**。\n2. **只有 Playwright 有超时纪律**，而且是分层预算 + `retries: 0`（主动不掩盖 flake）——**这一处 SSiD 做得比 skill 要求的还好**，应当反过来写进适配版当正面样板。另两个运行器是裸默认，见 §三.6。\n\n### 2.2 dsh-ssid-panels 的测试没有接线\n\n`plugins/dsh-ssid-panels/tests/` 下有 `prompt-seeds.test.ts`（4581 B）与 `release-notes.test.ts`（1589 B），用 `node:test` 写就，但：\n\n- `package.json` 的 `scripts` 只有 `build` / `typecheck` / `watch`，**没有 `test`**\n- `node_modules/` 里**没装 vitest**，devDependencies 里也没有（所以它们确实不是 vitest 测试）\n- 唯一入口是 `ssid-release` skill 里的手跑命令（`SKILL.md:33`、`:50`），且该 skill 记了一个坑：**必须在仓库根或有本地 tsx 的目录跑**，绝对路径 + 错误 cwd 会 `ERR_MODULE_NOT_FOUND`\n\n**为什么这条要写进适配说明**：它正是上游第 1 节 \"Read the owning rules\" 要防的情形——**测试存在 ≠ 测试在跑**。CI 不会跑它们，新人不知道要跑。适配版应把\"哪些测试由谁在什么时机跑\"当作**判据的输入**写清楚，而不是假设\"有测试就有纪律\"。\n\n### 2.3 第一版的错误（留痕）\n\n| 位置 | 第一版写的 | 核实后的事实 |\n|---|---|---|\n| §2 表格 | \"用 vitest 的插件 12 个\"，并列出 dsh-ssid-panels / dsh-ssid-zh-ui / dsh-chat-rail | vitest **10 个**，且全部在 `max-null-plugins/` |\n| 同上 | dsh-chat-rail 同时出现在 vitest 栏与 node:test 栏 | dsh-chat-rail 是**纯 node:test**（devDependencies 无 vitest；`test` = `node --import tsx/esm --test tests/**/*.spec.ts`） |\n| 同上 | 暗示 dsh-ssid-zh-ui 有测试 | 它连 `src/`、`tests/` 都没有，只有 `lib/` + `cordis.patch.yml` + `verify-zh-ui.cjs`，**无测试** |\n| §三.7 | \"node:test 的 `afterEach` 需从 `node:test` 导入，与 vitest 全局注入不同\" | **两个运行器都是显式导入**——SSiD 没开 vitest 的 `globals: true`，vitest 侧同样要 `import { describe, it, expect } from 'vitest'` |\n\n**教训**：这类\"数一数有多少个\"的事实，凭扫描结论的中间产物（记忆里的片段）会错，必须回到 `package.json` 原文。**适配说明里的每一项统计都应当可复现**——否则它会成为下一份文档的错误输入。\n\n**关键结论（修正后）：适配的主要工作不是\"换运行器术语\"，而是三件事**——① 同一份判据给出两个运行器各一版示例；② 补上 SSiD 缺失的超时纪律；③ 把 Playwright 那处已经做对的实践反向写进 skill。判据本身仍**一条不减**。\n\n---\n\n## 三、逐条适配判断\n\n上游 12 个小节，逐一判断。**判定分四类**：原样保留 / 改写 / 删除 / 新增。\n\n### 1. Read the owning rules（5 个链接）→ **改写**\n\n上游让 agent 先读 5 个\"归属规则\"再动手：`docs/testing.md`、`docs/defensive-patterns.md`、当前 Vitest 配置、`snapshots/AGENTS.md`、`dsh-pre-push-checks`。\n\n**SSiD 逐项对照**：\n\n| 上游指向 | SSiD 对应物 | 适配动作 |\n|---|---|---|\n| `docs/testing.md` | `docs/SSiD开发手册.md` §9（插件开发与测试规范，含 L1/L2/L3 分级门槛） | 改指向 |\n| 当前 Vitest 配置 | **存在 4 个**：dsh-plugin-center / dsh-capture / dsh-draft-polish / dsh-skill-mcp-center 的 `vitest.config.ts` | 保留，但**必须补 node:test 一侧**（见下） |\n| `docs/defensive-patterns.md` | **无**（`docs/` 下只有手册、发版流程、genui 手册、README、初版验证清单、release-notes） | 删除，不硬造 |\n| `snapshots/AGENTS.md` | **无**——全库无 `toMatchSnapshot`/`toMatchInlineSnapshot`，也无 `snapshots/` 目录 | 删除 |\n| `dsh-pre-push-checks` | 待该 skill 适配完成后 | 暂留空，或指向手册的发版流程 |\n\n**第一版我写的是\"这些文档都不存在\"，错了**——Vitest 配置确实存在。更要紧的是**光指配置还不够**：SSiD 的主力运行器是 node:test（§2.1），而 **node:test 没有配置文件**，它的纪律**只存在于 `package.json` 的 `test` 脚本里**。所以适配后这一节的真实指向是三条：\n\n1. **vitest 侧** → 那 4 个 `vitest.config.ts`\n2. **node:test 侧** → `package.json` 的 `test` 脚本本身（这是它唯一的\"配置\"）\n3. **两者共同** → §2.2 那份\"哪些测试由谁在什么时机跑\"的清单（否则 agent 会假设\"有测试就有纪律\"）\n\n**为什么这条在上游重要**：它让读者（agent）能读到**真实的超时、并发、重试设置**，而不是去猜。留一个空链接，agent 就会猜——那正好违背第 1 节的本意。\n\n**与 SSiD 手册的关系**：手册 §9 已有\"分级门槛（L1 仓库级 / L2 环境级 / L3 发版级）\"与\"反馈环纪律（先跑红再改绿）\"，**与上游是互补而非重复**——上游管\"测试怎么写才可靠\"，手册管\"什么时候必须跑什么\"。适配后两个文件应互相链接。\n\n### 2. Model the execution topology（4 层重叠模型）→ **改写**\n\n上游四层：同一 Vitest 文件内 → 不同 worker 进程 → 同一 job 内的独立进程 → 共享主机的不同 job。\n\n**SSiD 侧**：没有\"共享主机的不同 job\"这一层（无自托管池）。实际拓扑是三到四层：\n\n| SSiD 层 | 对应上游 |\n|---|---|\n| 同一 spec 文件内的用例 | 第 1 层（保留） |\n| 并行的 spec 文件 / vitest worker | 第 2 层（保留，但 vitest 与 node:test 表现不同） |\n| shell 与插件同时跑测试 | 第 3 层（改写：SSiD 的形态是\"多个包的测试同时跑\"） |\n| 本地开发机与 CI runner | 第 4 层（改写：由\"共享主机\"变为\"本地 vs GitHub runner\"） |\n\n**保留的核心判据（原样）**：\n> **进程隔离不隔离主机的端口、可预测文件系统路径、外部服务、数据库、socket 或继承的子进程。**\n\n以及：\n> **\"不要因为一个 fixture 缺隔离就把整个套件串行化。\"**（\"顺序化一个 Vitest 块无法保护主机资源免受另一个文件、进程、job 或 runner 的干扰\"）\n\n### 3. Allocate resources atomically → **原样保留**\n\n判据与运行器无关：\n\n- **用资源所有者的分配器，而不是\"先检查可用、稍后再占\"**：网络用 `listen(0)` 并**在服务器报告 listening 之后**才读回地址；**绝不要扫描空闲端口然后稍后绑定**\n- 用 `mkdtemp` 建私有临时根；**不要获取可预测的共享路径**\n- 给共享数据库、socket、会话、输出位置**唯一的按用例命名空间**\n- 需要\"路径必须尚不存在\"时用独占创建\n- **稳定的录制标识符要与临时传输地址分开**\n- **而\"仅作为解析器输入或期望值出现的字面路径/URL 不是被获取的资源——不要因为看起来是固定的就改写它们\"**\n\n**SSiD 注意点（已核实，且这条判据当场抓到问题）**：`shell/tests/plugin-adapt/` 下的探针脚本存在三类硬编码，而该目录的 `README.md` **自己已写明**\"页面 URL 是随机端口（如 52221），**断言勿硬编码端口**\"：\n\n| 问题 | 数量与实例 |\n|---|---|\n| **硬编码 token（已入库）** | **5 个文件**：`check-seed.mjs:2`、`grab-clean-modules.mjs:5`、`grab-clean-web.mjs:5`、`probe-3083.mjs:2`、`rc1-clean-check.mjs:3` |\n| **硬编码端口** | 约 28 个文件直接写 `'http://127.0.0.1:9222'`（未走 `SSID_CDP` 回退）；另有 5 个写 `3083` / `54170` |\n| **硬编码用户绝对路径** | `rc1-clean-check.mjs:4`：`executablePath: 'C:\\\\Users\\\\MaxNull\\\\AppData\\\\Local\\\\ms-playwright\\\\chromium-1237\\\\...'` |\n\ngit 跟踪状态已核实：**66 个文件被跟踪**，`.gitignore` 只排除 `node_modules/`、`test-results/`、`report/`，上述文件**全部已入库**。\n\n**关于 token 的风险判断**：那些 URL 里的是 DSH 的 **launch token**（`?token=`），而 `2026-08-24-browser-token-authentication.md` 记明\"**launch token 本身从不持久化，每次进程启动都变**\"——所以它们很可能已失效。**但这只是依据该决策记录的推断，我没有验证这些具体 token 的当前有效性。** 真正的问题是模式本身：把 token 写进测试脚本并提交，这个习惯不该留。\n\n**规范写法在同一个目录里就有**：约 22 个文件用了 `process.env.SSID_CDP ?? 'http://127.0.0.1:9222'`，README 还提到用 `findDshPage` 按 `http://` + 非 `file:` 匹配页面。**所以这不是\"不会写\"，是两批脚本的写法不一致。**\n\n**这正是本节判据的价值证明**——\"用资源所有者的分配器，而不是先检查可用、稍后再占\"与\"不要获取可预测的共享路径\"，在 SSiD 的第一批审计对象上就直接命中。\n\n### 4. Contain process-global state → **原样保留**\n\n清单与手法完整可用：`process.env`、`cwd`、假计时器、locale 与时区、模块 mock、注册表、console 钩子、`globalThis`、全局 `fetch` 拦截——**都当独占可变资源**。\n\n手法保留原样：捕获原值是缺失还是存在 → 恢复那个确切状态 → 立即注册恢复 → 最小作用域 `try/finally` → 保留 `afterEach` 兜底 → 拦截最窄的确切请求。\n\n**SSiD 注意点**：**两个运行器都是显式导入**（SSiD 没开 vitest 的 `globals: true`），所以这节的手法在两边写法几乎一致——node:test 用 `import test from 'node:test'` + `import assert from 'node:assert/strict'`，vitest 用 `import { describe, it, expect, beforeEach, afterEach } from 'vitest'`。**两版示例仍要给，但差异比预想的小。**\n\n### 5. Respect platform-owned semantics（4 条 Windows）→ **原样保留，且价值更高**\n\n四条全部与 SSiD 强相关（你们要出 Windows NSIS 与 macOS 包）：\n\n- **写回值只在断言容忍写回失败时才安全**（mtime 精度、NTFS 的 100 纳秒刻度）\n- **Windows 环境变量名大小写不敏感**——`http_proxy` 与 `HTTP_PROXY` 当作两个键的 fixture 在那里只有一个条目\n- **Windows 异步释放文件句柄**——POSIX 上立即完成的 rename/remove 需要**按实测争用规模定大小的有界重试**\n- **Windows 没有 POSIX 权限与信号语义**——依赖它们的用例**显式平台跳过并写明原因**，而不是到处弱化断言\n\n**新增建议**：SSiD 已有 macOS 相关构建（`build-mac.yml`、`ssid-mac-launcher.command`、`ssid-mac-launcher`），而上游只讲 Windows vs POSIX。适配版应补一条 macOS 侧的经验——**但具体内容我不知道**，建议从 SSiD 的发版复盘中提取（`docs/发版流程规范.md` 与 `docs/排查/`）。\n\n### 6. Budget timeouts against the lane → **改写（机制不同，且 SSiD 现状是三种态度）**\n\n上游三条判断**全部保留**——它们是运行器中立的，一条都不用改：\n\n- **用例级超时覆盖运行器默认值**，而不是让位给它——所以低于 lane 预算的值等于**降低**了 CI 已授予的量\n- **提升测试预算时要一起提升钩子预算**——否则\"只提升 case 预算会把一次争用失败挪进 `afterEach`\"\n- **被测对象本身是超时时，外层等待要远大于被测超时**——证明 20 ms 截止触发的用例**不能与测试框架自己的等待赛跑**\n\n#### 6.1 把\"运行器默认值\"换成实际数字\n\n上游用的是抽象说法（\"runner 的 `--testTimeout`\"）。SSiD 两种运行器并存，必须写清各自的实际默认值：\n\n| 运行器 | 用例级默认 | 钩子级默认 | 证据（可复现） |\n|---|---|---|---|\n| vitest 4.1.11 | **5000 ms** | **10000 ms** | `node_modules/vitest/dist/chunks/cac.*.js` 的 CLI 描述原文：Default timeout of a test in milliseconds (default: 5000)；hook 同处为 10000；写 0 表示完全禁用 |\n| node:test（Node v26.2.0） | **`Infinity`** | 同（钩子即子测试，各带 `timeout`） | `@types/node@22.20.1/test.d.ts` 的 `TestOptions.timeout` 明确标 `@default Infinity`，并注明\"未指定时子测试继承父测试的值\" |\n| Playwright | SSiD 自设 **60000 ms** | — | `shell/tests/plugin-adapt/playwright.config.ts` |\n\n**这张表给出上游没有的机制解释**：vitest 的两个默认值构成 **hook : test = 2 : 1** 的隐含比例。所以\"只提升用例预算\"在 vitest 上**不是风格问题，而是必然破坏默认设计**——把 `testTimeout` 提到 30 s 而不管 `hookTimeout`（仍是 10 s），比例反转成 1 : 3，\"争用失败从 case 挪进 afterEach\"就必然发生。**上游判据因此从\"经验\"变成\"可推导\"。**\n\n**同时暴露上游一处盲区**：两个运行器的默认值方向**相反**——vitest 默认 5 秒（**有限**，风险是慢用例假失败、看起来像 flake），node:test 默认 `Infinity`（**无限**，风险是挂住的用例永不失败、lane 永不结束）。**同一份\"预算\"判据要同时防\"太紧\"与\"缺失信号\"两种病**，而上游只面对前一种。\n\n#### 6.2 SSiD 的三种态度，要分别说明\n\n- **Playwright —— 已经做对，应作为正面样板写进 skill**：60 s 用例 / 30 s 导航 / 15 s 动作的**三层递减**预算，外加 `retries: 0`（主动不掩盖 flake，与第 10 节判据一致）。这是全仓库超时纪律最好的一处。\n- **vitest —— 裸默认**：4 个 `vitest.config.ts` 只设 `include` / `environment`，**没人判断过 5 秒够不够**。风险是起进程、等文件系统一类慢用例间歇撞线，表现为\"flake\"而非\"配置问题\"。\n- **node:test —— 无上限**：这是**更危险**的一侧。挂住的用例不会失败，只会让 lane 永不结束；超时在这里不是\"太紧\"而是**缺失失败信号**。而它偏偏是 SSiD 的主力运行器（4 处载体）。\n\n#### 6.3 两种运行器的写法（同一判据给两版示例）\n\n| | vitest | node:test |\n|---|---|---|\n| 导入 | `import { describe, it, expect, vi } from 'vitest'`（**显式导入**，SSiD 没开 `globals: true`） | `import test from 'node:test'` + `import assert from 'node:assert/strict'` |\n| 用例级 | 第三参数 `it('名字', fn, 30_000)`；或全局配置 `testTimeout` | 第二参数 `test('名字', { timeout: 30_000 }, fn)`（签名见 `test.d.ts` L127） |\n| 钩子级 | `hookTimeout`（独立配置项） | **无独立配置项**——钩子就是子测试，各带 `timeout`，未指定则继承父测试 |\n| 断言 | `expect(x).toBe(y)` | `assert.equal(x, y)`（strict） |\n| 组织 | `describe` / `it` | `test` 可嵌套 |\n\n**这是上游没有的复杂度**：上游只需对一种运行器讲话，SSiD 必须两版并存，且**判据本身不得分叉**（否则就成了两份 skill，违背\"一份判据\"）。\n\n> **由本节派生、但不属于 skill 正文的两条 SSiD 改进项**（单独跟踪，不要混进 skill）：\n> 1. 在 `vitest.config.ts` 里**显式写出** `testTimeout` / `hookTimeout`（哪怕就是默认值）——把**隐式默认**变成**可复核的决定**\n> 2. 给 `shell/package.json` 的 node:test 脚本补 `--test-timeout=\u003cms>`，给无限的默认值一个上限\n\n### 7. Synchronize on state → **原样保留**\n\n- **\"固定的 sleep 不是 setup 完成或清理结算的证据。\"**\n- 等显式就绪事件、握手、状态转移、自有 promise、可外部观察的条件\n- **\"超时只用来界定等待，绝不用作让断言成立的条件。\"**\n- 用 deferred promise 或 barrier 把竞态放在确定点，**并证明相关操作确实重叠**\n- **不要断言依赖调度器的顺序**，除非那个顺序就是被测的产品行为\n- 时间本身是主题时，注入或伪造时钟，**并总是恢复真实计时器**\n\n### 8. Dispose to quiescence → **原样保留**\n\n- **获取后立即注册清理**，这样断言失败也会释放资源\n- 清理要：停止新回调/请求 → 摘掉监听器 → 恢复全局钩子 → 终止自有工作 → **等待子进程退出、服务器关闭、worker 终止或等价完成信号**\n- **\"调用 `abort()`、`close()` 或 `kill()` 而不等待自有的完成信号，是不完整的拆除。\"**\n- 晚完成可能发生时，**证明释放能阻止它变更另一个用例**\n\n**SSiD 注意点**：Electron 与 Playwright 相关测试的拆除尤其吃这套——`shell/tests/plugin-adapt/` 的浏览器测试若没等到 `browser.close()` 完成就进入下一个文件，正是这条要抓的。\n\n### 9. Prove the intended regression → **原样保留**\n\n- 可行时先观察一次普通回归在修复前失败\n- **对新的静态或语料守护，临时引入被拒绝的用例并观察预期失败**（与手册 §9 的\"先跑红\"一致，但这条更具体：**针对守护类检查**）\n- **对竞态用 barrier 证明重叠；重复执行本身不是竞态测试**\n- 对端口、socket、共享路径、子进程，**当跨进程隔离是修复的一部分时，要并发跑独立测试进程**\n- **fixture 用自己的截止时间 spawn 时，要先断言没有信号或超时结束了子进程，再去断言退出状态**——否则一个被杀死的子进程会被报成状态不匹配\n- **验证外部状态、事件、文件、日志、退出或释放，而不是相信组件自报**\n- **\"压力运行补充确定性回归；它们不替代它。\"**\n\n### 10. Reject flake-masking fixes → **原样保留（全篇最可直接移植的一节）**\n\n七条\"不要把这些当作确定性本地测试的根因修复\"：\n\n1. 不指明所等待状态就加大超时\n2. 加重试\n3. 把所有文件改成串行\n4. 吞掉错误或未处理的 rejection\n5. 弱化断言\n6. 把不稳定行为归一化掉\n7. 在清理或断言前加 sleep\n\n**外加一条重要的例外与区分**（也保留）：\n\n- 重试对**有文档记载的瞬态外部提供方测试**仍然有效（对应 SSiD 的模型调用类测试）\n- **\"恢复预算不是掩盖\"**——把套件提升到它本来就有的 lane 预算，或按 runner 上**实测的争用**定有界重试，\"**命名了等待的工作并归还了 lane 已授予的量**\"\n\n### 11. Diagnose existing flakes → **改写（参考文件要重做）**\n\n上游 `references/ci-flake-diagnosis.md`（60 行）绑在 DSH 的 CI 拓扑上。**应重写**，内容改为 SSiD 的诊断路径（本地复现 → Playwright trace → 日志定位）。这一节的具体内容**我不掌握**，需要从 SSiD 现有的排查记录里提取（`docs/排查/` 下已有 `2026-08-20-窗口不定时跳出-排查记录.md` 一类的素材）。\n\n保留上游的定位：\n\n> **\"只做诊断的请求保持只读：报告原因与证据，除非用户同时要求修复。\"**\n\n### 12. Validate and report → **改写（命令）**\n\n上游的\"按风险加拓扑证据\"四条**保留**（全局变更要恢复证据 / 生命周期或子进程要静默拆除证据 / 端口或共享路径要并发独立进程证据 / 新守护要负对照）。\n\n**命令要换成 SSiD 的**（下表逐个核实自 `package.json` 原文，不是凭印象）：\n\n| 目标 | 命令 | 出处 |\n|---|---|---|\n| shell 本体（2 个文件） | `npm test` | `shell/package.json` 的 `test` |\n| shell 单文件 | `npm run test:profile-merge` / `npm run test:codegraph-adapt` | 同上（两个脚本确实都存在） |\n| 各插件 | `pnpm test`（= `vitest run`） | 各插件 `package.json`；**注意 dsh-chat-rail 是 `node --test`**（§2.1） |\n| Playwright | `cd shell/tests/plugin-adapt && npm test`（= `playwright test`）；另有 `npm run test:ui`、`npm run baseline` | `shell/tests/plugin-adapt/package.json` |\n| dsh-ssid-panels 的两个测试 | **没有 npm 脚本**，只能手跑：`node --import tsx/esm --test plugins/dsh-ssid-panels/tests/release-notes.test.ts`（**必须在仓库根**，见 §2.2） | `ssid-release` skill |\n\n**两个坑必须写进 skill，否则 agent 会跑错命令**：\n\n1. **Playwright 不在 `npm test` 里**。shell 的 `test` 脚本只跑那两个 node:test 文件；浏览器回归要单独进 `shell/tests/plugin-adapt/` 跑。**只看 `npm test` 绿就宣布\"全绿\"是错的。**\n2. **包管理器不统一**。dsh-chat-rail 只有 `pnpm-lock.yaml`，而 **dsh-memory 同时存在 `package-lock.json` 与 `pnpm-lock.yaml`**——调用前先看该插件目录里是哪个锁文件，不要一律 `pnpm`。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | **7 节** | Allocate resources / Contain global state / Platform-owned semantics / Synchronize on state / Dispose to quiescence / Prove regression / Reject flake-masking（第 3–5、7–10 节） |\n| **改写** | 5 节 | Read the owning rules / Model the topology / Budget timeouts / Diagnose flakes / Validate and report |\n| **删除** | 0 节 | 无 |\n| **新增** | 5 处 | ① 两套运行器（vitest + node:test）的双版示例 ② macOS 侧的平台经验 ③ SSiD 的 CI/本地拓扑 ④ **Playwright 那处已做对的超时层级**（§三.6，上游没有的正面样板）⑤ **SSiD 专有的已知坑**（plugin-adapt README 的 L1–L4 与五条坑，见 §七.4） |\n\n> **算术核对**：7 + 5 + 0 = 12，与上游 12 小节相符。**第一版这里写的是\"原样保留 6 节\"，是错的**（第 3–5、7–10 节共 7 节），同为 §2.3 那类\"数一数\"错误。\n\n**净判断：上游 131 行的判据骨架全部可用，一条不减**——需重写的是引用、示例与命令，约占三分之一篇幅；另有三件事是上游没有的（两套运行器、超时三态度、SSiD 专有坑），必须新增。\n\n---\n\n## 五、建议的落地结构\n\n```\nseek-soul-in-darkness/.agents/skills/ssid-test-reliability/\n├── SKILL.md                 # 判据主体，预计 140–170 行（比上游 131 行略多：要容纳两版示例与 SSiD 专有坑）\n├── SOURCE.md                # 来源与版本标记（模板见下）\n└── references/\n    └── flake-diagnosis.md   # 重写版：SSiD 的 flake 诊断路径\n```\n\n**命名**：`ssid-` 前缀，与 SSiD 现有的 `.agents/skills/ssid-release` 一致。\n\n**description 建议**（只写触发条件，**不描述 skill 内容**）：\n\n> 在设计或修改可能因并发、共享资源、时钟、进程全局状态、子进程、网络监听器或异步拆除而不确定失败的测试与 fixture 时使用，也用于调查不稳定的 CI 或评审测试隔离。\n\n**为什么删掉了\"覆盖哪些运行器\"那半句**：`superpower-writing-skills` 的实测结论——\n\n> **描述的用途是让人判断\"现在该不该读它\"**。当描述总结了技能的工作流时，**agent 可能直接照描述做，而不读技能正文**。实测中，一个写着\"任务间做代码评审\"的描述，让 agent 只做了**一次**评审，尽管技能里的流程图明确画了**两次**。\n> **陷阱：总结了流程的描述会制造一条 agent 会走的捷径，而技能正文变成 agent 跳过的文档。**\n\n\"本 skill 覆盖 vitest、node:test 与 Playwright\" 属于**内容摘要**，不是触发条件——按这条规则必须删。运行器差异改在正文里用一节说明。\n\n---\n\n## 六、SOURCE.md 模板（本系列统一）\n\n```markdown\n# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-ci-test-reliability |\n| 上游路径 | DSHfork/.agents/skills/dsh-ci-test-reliability/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 131 行 + references/ci-flake-diagnosis.md 60 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（清点分类：✅ 小改即可用） |\n| 适配说明 | dsh-skills/docs/适配说明/2026-09-10-skill适配说明-01-测试可靠性.md |\n\n## 与上游的差异\n\n**保留**：第 3–5、7–10 节的判据骨架（资源原子分配、进程全局状态、平台自有语义、\n状态同步、静默拆除、证明预期回归、拒绝掩盖式修复）——逐条对应上游，未改判据。\n\n**改写**：\n- 「读取所属规则」：上游的 5 个文档链接 → ① SSiD 开发手册 §9（分级门槛）② 4 个 `vitest.config.ts` ③ node:test 的 `package.json` 脚本 ④ §2.2 的\"谁在何时跑\"清单（上游有 `docs/testing.md` 与 `snapshots/AGENTS.md`，SSiD 两缺）\n- 「建模执行拓扑」：上游的四层（含自托管池）→ SSiD 的四层（本地/CI、多包并行）\n- 「超时预算」：Vitest 单一机制 → vitest（默认 5 s / 10 s）与 node:test（默认 `Infinity`）双机制，并说明 SSiD 的三种态度\n- 「诊断既有 flake」：上游的 CI 拓扑诊断 → SSiD 的本地复现路径（references 重写）\n- 「验证与报告」：上游命令 → 经核实的 SSiD 命令表，含\"Playwright 不在 `npm test` 里\"与\"包管理器不统一\"两坑\n\n**删除**：无。\n\n**新增**：\n- 两套运行器的双版示例（上游只有 vitest）\n- macOS 侧平台经验（上游只讲 Windows vs POSIX）\n- SSiD 的 CI/本地拓扑描述\n- Playwright 的三层递减超时预算 + `retries: 0`（上游没有的正面样板）\n- SSiD 专有的已知坑（plugin-adapt README 的 L1–L4 分层与五条坑）\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/dsh-ci-test-reliability/`\n2. 若该目录有变动，对照本节「与上游的差异」逐条重判\n3. 更新本文件的版本锚点与适配日期\n```\n\n---\n\n## 七、待你确认的四点\n\n1. **命名与落点**：`ssid-test-reliability` 放在 `.agents/skills/` 下，是否可以？（我按你\"沿用 DSH 方式\"的要求拟的，前缀对齐现有的 `ssid-release`。）\n\n2. **是否要一并建 `.agents/skills/README.md`**：DSH 的 `.agents/notes/` 有一份 README 说明整套制度，而 `.agents/skills/` 没有（只有 `.gitignore`）。SSiD 这边要不要立一份，说明\"这里的 skill 是适配自 DSH 的、来源标记在各自的 SOURCE.md\"？\n\n3. **~~第 3 节提到的探针脚本审计~~（已核实，见第 3 节）**：确认存在三类硬编码，含 5 个已入库的 token。**是否要单独开一项清理任务？** 这是与 skill 适配无关的独立问题。\n\n4. **~~是否现在就读 `shell/tests/plugin-adapt/README.md`~~（已读）**：它记录了 SSiD 的测试基础设施约定，其中两点对适配有直接影响——\n\n   - **断言分层 L1–L4**（Boot 健康 / 界面契约 / 功能可用 / 样式契约回归）——**与第 07 批读到的 DSH GUI 三层结构同构**，说明你们已经在用同样的分层思路；\n   - **五条已知坑**（`data-slot` 是 `display:contents` 导致 Playwright 元素截图不可用、431 报错源于 cookie 累积、随机端口、console 捕获须在导航前注册、截图基线受光标/Toast 影响）——**这些是 SSiD 专有的平台经验，适配版应当保留，上游没有对应内容**。\n\n   因此第 5 节的\"新增 macOS 侧经验\"建议扩写为：**新增一节\"SSiD 专有的已知坑\"**，把 README 这五条纳入。而我的适配说明第 5 节提到的 macOS 经验，可以从 `docs/发版流程规范.md` 与 `docs/排查/` 继续提取。\n"},{"file":"docs/适配说明/2026-09-10-skill适配说明-02-推理痕迹修剪.md","group":"适配说明","date":"2026-09-10","slug":"skill适配说明-02-推理痕迹修剪","title":"skill 适配说明 02：推理痕迹修剪","tags":["@max-null/dsh-skills","dsh-trim-cot-leakage","dsh-skills","ssid-trim-cot-leakage","dsh-prose-standard","ssid-prose-standard","ssid-test-reliability"],"summary":"1. SSiD 的文档是 AI 写的，而 AI 天生带「写作会话视角」。这不是坏习惯，是生成过程的副产品——我写 01 时就写了 §2.3「第一版我写的是……」。所以这条 skill 在 SSiD 不是锦上添花，是针对主要生产方式的。 2. 实测证明泄漏真实存在，且位置最要紧（§2.2）。命中最集中的地方不在变更日志里（那里合法），而在 skills//SKILL.md——给 agent 的指令。","bytes":17111,"lines":245,"body":"# skill 适配说明 02：推理痕迹修剪\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。复核通过后才生成 skill 文件。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 格式沿用 01（见 `2026-09-10-skill适配说明-01-测试可靠性.md`），不重复其模板。\n\n**上游 skill**：`dsh-trim-cot-leakage`\n**上游位置**：`DSHfork/.agents/skills/dsh-trim-cot-leakage/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与 01 同批）\n**上游体量**：SKILL.md 45 行 + `references/examples.md` 275 行 + `references/recall-batteries.md` 52 行 = **372 行**\n**清点分类**：✅ 小改即可用\n**拟落点**：`@max-null/dsh-skills` 包的 `skills/ssid-trim-cot-leakage/`\n\n---\n\n## 一、为什么做这一个\n\n1. **SSiD 的文档是 AI 写的，而 AI 天生带「写作会话视角」**。这不是坏习惯，是生成过程的副产品——我写 01 时就写了 §2.3「第一版我写的是……」。所以这条 skill 在 SSiD 不是锦上添花，是**针对主要生产方式**的。\n2. **实测证明泄漏真实存在，且位置最要紧**（§2.2）。命中最集中的地方不在变更日志里（那里合法），而在 **`skills/*/SKILL.md`——给 agent 的指令**。\n3. **它是给 agent 读的 skill**：泄漏进 skill 正文，等于让后续每个 agent 都读一段历史噪音。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 探针实测\n\n用中文变更叙事探针（`第一版|本版|旧版|不再|曾经|原来|已改|修正了|之前是|改成了|这轮|本轮`）扫 `seek-soul-in-darkness/**/*.md`：**202 处命中**。\n\n按位置分类——**这张表是本节的核心判断依据**：\n\n| 位置 | 文件数 | 命中密度 | 性质 | 判断 |\n|---|---:|---|---|---|\n| `docs/release-notes-*.md` | 19 | 高 | **变更日志的本体** | **合法主场** |\n| `docs/决策/` | 99 | 高 | 决策记录 ≈ DSH 的 Agent Notes | **合法主场** |\n| `docs/设计/` | 21 | 中 | 设计记录 | **合法主场** |\n| `docs/排查/` | 1 | 中 | 排查记录 | **合法主场** |\n| `shell/docs/pitfalls.md` | 1 | 中 | 坑记录 | **合法主场** |\n| `skills/*/SKILL.md` | 14 | **低但致命** | **给 agent 的指令** | **必须修** |\n| 根 `README.md`、插件 README、`docs/SSiD开发手册.md` | — | 低 | 当前状态表面 | **应修** |\n\n**两个结论**：\n\n1. **SSiD 需要一份「合法主场清单」，这是上游没有的复杂度**。DSH 只有 Agent Notes 一个 sanctioned home；SSiD 有**五个**。不点名豁免，agent 会把 release notes 当泄漏来「修」——那是在破坏历史。\n2. **命中密度的高低是骗人的**：release notes 里几百处没人会误判，而 `skills/*/SKILL.md` 里三处会直接污染 agent 行为。**适配版必须按「表面」而不是按「密度」定优先级。**\n\n### 2.2 实测出的真实泄漏（抽样）\n\n| 文件 | 行 | 现状 | 泄漏类型 |\n|---|---:|---|---|\n| `skills/mxy-commit-review/SKILL.md` | 117 | 「二次审查通过后，**不再**询问『是否继续提交』」 | 类 3 变更叙事 |\n| `skills/mxy-upgrade-vue3/SKILL.md` | 330、359 | 「grep `proxy\\.` 确认模板和脚本中**都不再有**未处理的 `proxy.` 引用」 | 类 3 |\n| `shell/profile-template/vendor/README.md` | 25 | 「目录下**不再保留**该包。历史上的 vendor 固化基线 = 上游 v0.9.2 + …」 | 类 3 + 类 1 |\n| 根 `README.md` | 52 | 「原 v0.1.18 未分发内容并入重打」 | 类 3（编排史） |\n\n**共同的修法**：把「比较级」还原成「当前状态」——「不再询问 X」→「直接进入步骤 6」；「确认都不再有未处理的 X」→「确认无未处理的 X」。\n\n> 注意第四条与前三条不同：根 README 的版本摘要**大体合法**（它答的是「当前版本是什么、有什么」），只有「编排史」那半句该走 release notes。**这条算边界情形，不应用硬规则一刀切**——正是上游 `Borderline decisions` 一节存在的原因。\n\n### 2.3 SSiD 无文档门禁（决定适配策略的关键差异）\n\n`shell/package.json` 的 `scripts` 全部是：`start` / `typecheck` / `smoke` / `test` / `test:profile-merge` / `test:codegraph-adapt` / `pack` / `bundle-kernel` / `pack:mac`——**没有任何文档检查**。\n\n而 DSH 有 `doc-sync`、`verify-doc-budgets`、`verify-translation-pairing`、`verify-doc-links` 一批门禁在持续守护文档。\n\n**这条差异直接决定架构**：DSH 靠门禁长期守住全仓库，SSiD 没有门禁 → **与其要求全仓库干净（修了没人守、必然退回），不如把 scope 收窄到对 agent 影响最大的表面**。具体方案见 §三.3。\n\n---\n\n## 三、逐条适配判断\n\n上游共 **5 个部件**（SKILL.md 引言 + 4 个一级小节）+ **2 个 references**，共 7 个部件，逐一判断。**判定分四类**：原样保留 / 改写 / 重写 / 新增。\n\n### 1. SKILL.md 引言（定义 + REQUIRED BACKGROUND）→ **改写**\n\n上游定义：泄漏是「**视角属于写作会话而不是仓库**」的散文。这个定义**跨语言成立，直接保留**。\n\n要改的是依赖声明：\n\n- 上游：`REQUIRED BACKGROUND: dsh-prose-standard owns the complete-proposition rule this skill applies`\n- 适配版：指向适配后的 `ssid-prose-standard`（03 号），**并注明两者必须同批进入 `@max-null/dsh-skills`**\n\n**为什么这条不能省**：完整命题规则是**防过度修剪**的唯一依据。DSH 的 `examples.md` 里专门有一节 `Overcorrection traps`（四类），全部依赖「先枚举命题再删」。若 agent 只装了本 skill 没装 03，它会删掉真事实。「同批进包」不是包装细节，是**判据能否成立的前提**。\n\n### 2. `## The one test` → **原样保留**\n\n> 对每段可疑文字问：**一个处在 HEAD、拿不到任何会话记录、PR 讨论或未提交草稿的读者，能不能解析每一个引用、核实每一条断言？**\n\n这条**一字不改**。它是整份 skill 的支点，且与语言无关。**它同时也是上游最漂亮的设计**：用**一个可判定的问题**取代一长串禁令——按 `writing-skills` 的「形式匹配失败」表，这属于「正面配方」，而禁令清单在实测中反而**比不给指导更差**。\n\n### 3. `## Taxonomy`（8 类）→ **原样保留，补一条中文探针指引**\n\n8 类（死引用 / stack 与 PR 视角 / 变更叙事与版本戳 / 评审编排 / 面向评审者的辩解 / 复述与推导记录 / 模糊措辞与规划残留 / 写作语言滑落）**全部保留**。\n\n**唯一新增**：第 8 类「写作语言滑落」在 DSH 是「英文文档里混入中文」，在 SSiD **方向相反或不存在**（SSiD 主体就是中文）。适配版应把它改成**同语言内的滑落**（如中文文档里混入英文推导过程、或未翻译的 `---- 私有 ----` 分隔符之类的排版残留），而不是照抄「中英混排」。\n\n### 4. `## What is not leakage`（9 条 keep rules）→ **保留 + 新增 1 条**\n\n9 条全部保留（issue 引用 / 合并 PR 引用 / 抑制理由 / 反事实现在时回归钉 / 实测边界 / 运行时新旧状态 / 笔记变更故事段内的历史阶段名 / 仓外可解析引用 / 项目口吻与文体形制）。\n\n**必须新增的第 10 条——SSiD 的六个合法载体**（上游只认 Agent Notes 一个）：\n\n> **变更叙事在 SSiD 的合法主场**：`docs/release-notes-*.md`、`docs/决策/`、`docs/设计/`、`docs/排查/`、`shell/docs/pitfalls.md`。在这些文件里，变更叙事是**内容本体**，不是泄漏。修剪任务默认**不进入**这些路径；确需进入时须由用户显式指定 scope。\n\n**这条的证据**：§2.1 的实测分布 + §2.3 的无门禁事实。**没有这一条，02 在 SSiD 上会变成一个破坏历史文档的工具**——比不做更糟。\n\n### 5. `## Workflow`（5 步）→ **改写（scope 规则）**\n\n5 步骨架保留（定 scope 与豁免 → 只读审计 → 按表面 owner-first 修 → 删前枚举命题 → 验证）。\n\n**SSiD 改写点**：\n\n| 上游步骤 | SSiD 要改成什么 |\n|---|---|\n| 1. scope 与豁免 | 除 `vendor/` 与归档笔记外，**新增 §4 的六个合法载体**；并默认把 scope 收窄到「指令表面」：`skills/*/SKILL.md`、`docs/SSiD开发手册.md`、插件 README、JSDoc/注释 |\n| 3. 按表面 owner-first | 保留骨架，但删掉 `verify-type-equiv` / `verify-translation-pairing` 这两个 SSiD 没有的门禁，换成「改动后重跑受影响的 L1（typecheck + test）」 |\n| 4. 删前枚举命题 | **保留且提高权重**——这是防过度修剪的唯一闸门 |\n| 5. 验证 | 上游靠门禁，SSiD **没有** → 改成「重跑探针期望只剩合法命中 + 人工确认改动的 diff 不丢事实」。**这一条要显式写明「SSiD 没有门禁，所以验证靠重跑探针」**，否则 agent 会以为有东西替它兜底 |\n\n### 6. `references/recall-batteries.md`（52 行）→ **重写（语言方向反转）**\n\n上游探针集针对 DSH 的语言格局（英文为主 + `.zh.md` 对照）：英文 battery 7 条、中文 battery 4 条（全部是「在英文表面里找中文残留」）。\n\n**SSiD 的语言格局相反**（中文为主），所以：\n\n- 上游的中文 battery **全部失效**（它们是「英文里找中文」，不是「中文里找变更叙事」）\n- 需要**新写中文探针集**（本次实测用的那 12 个词是起点）\n- 英文 battery 保留（SSiD 有英文 README/JSDoc，以及 `-en` 类文档）\n\n**必须保留的三条纪律**（它们比探针本身更值钱，逐字保留）：\n\n1. **「零命中的模式什么也证明不了，直到它命中一个已知正例；有噪音的模式什么也证明不了，直到它拒绝一个近失负例。两者都要先校准再相信全集结果。」**\n2. **「探针是探针，不是定义」**——上游原话：每一轮评审都发现了没有探针能抓到的案例，所以必须**同时无模式地读 scope 内最密的散文**。\n3. **已知假阳性家族**必须随探针一起迁移（§2.2 的边界情形就是新的假阳性家族素材）。\n\n### 7. `references/examples.md`（275 行）→ **重写**\n\n上游 275 行是**英文校准样本**，按 8 类分节，另含 `Behavior-visible candidates`、`Keeps`、`Overcorrection traps` 三节。结构**优秀，照搬结构**；**案例全换**成 SSiD 的中文案例（§2.2 已备四个，需再补到每类 1–2 个）。\n\n**必须保留的是 `Overcorrection traps` 四类**（把义务翻转成背书 / 把假设升格为已交付特性 / 连带删掉真事实 / 留下数字丢了出处）——这四类**跨语言成立**，且是修剪工作最危险的失败模式。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 2 部件 | `The one test`、`Taxonomy`（8 类） |\n| **保留 + 扩充** | 1 部件 | `What is not leakage`（9 条 → 10 条，新增六个合法载体） |\n| **改写** | 2 部件 | 引言（依赖声明）、`Workflow`（scope 规则 + 门禁差异） |\n| **重写** | 2 部件 | `recall-batteries.md`（语言方向反转）、`examples.md`（案例换中文） |\n| **删除** | 0 部件 | 无 |\n\n> **算术核对**：5（SKILL.md 引言 + 4 小节）+ 2（references）= **7 个部件**；2 + 1 + 2 + 2 = **7** ✓\n\n**净判断：上游 45 行正文的判据一条不减**；重写的是两个 references 与 scope 规则，**新增一条上游没有的「六个合法载体」豁免**。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/\n└── skills/\n    └── ssid-trim-cot-leakage/\n        ├── SKILL.md                    # 预计 55–70 行（上游 45 行 + 主场豁免 + 中文探针指引）\n        ├── SOURCE.md                   # 来源与版本标记（模板见 01 的 §六）\n        └── references/\n            ├── examples.md             # 重写：中文案例，结构照搬（含 Overcorrection traps 四类）\n            └── recall-batteries.md     # 重写：中文探针集 + 保留三条校准纪律 + 假阳性家族\n```\n\n**命名**：`ssid-trim-cot-leakage`。与 01 的 `ssid-test-reliability` 一致用 `ssid-` 前缀。\n\n**description 建议**（**只写触发条件，不总结工作流**——`writing-skills` 的实测：总结了流程的描述会让 agent 照描述做、跳过正文）：\n\n> 在审阅中文或英文文档、注释与技能正文时，如果其中出现以写作会话（而非仓库当前状态）为视角的表述——「第一版」「不再」「旧版」「曾经」「本轮修正」「评审要求改为」等——或者需要判断某段历史叙述应当保留、改写还是移入变更日志时使用。\n\n**与 03 的绑定**：`ssid-trim-cot-leakage` 与 `ssid-prose-standard` **必须同批进包**，且 02 必须在正文里用 `REQUIRED BACKGROUND:` 显式声明（上游写法保留）。理由见 §三.1。\n\n---\n\n## 六、SOURCE.md\n\n用 01 §六 的模板，本 skill 的值：\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-trim-cot-leakage |\n| 上游路径 | DSHfork/.agents/skills/dsh-trim-cot-leakage/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 45 行 + examples.md 275 行 + recall-batteries.md 52 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（references 重写 + scope 规则） |\n| 依赖 | **ssid-prose-standard（同批进包）** |\n\n**与上游的差异**要写进 SOURCE.md 的三段（保留 / 改写 / 新增），可直接从本文 §四 抄。\n\n---\n\n## 七、待确认\n\n1. **六个合法载体是否收全**？本说明列的六个（release-notes / 决策 / 设计 / 排查 / pitfalls / **任意 skill 下的 `SOURCE.md`**）来自实测扫描。若你认为 `docs/初版验证清单.md`、`docs/品牌/` 之类也该豁免，请指出——**这份清单是 02 能否安全落地的开关**。\n\n   > **生成 skill 后补录（第三个「落地时才发现」的实例）**：原清单是**五个**，漏了 `SOURCE.md`。发现方式是**用 02 自己的探针去扫 02 自己的产物**——`SOURCE.md` 的「与上游的差异」节满是变更叙事，一扫命中 27 处，而它恰恰是**变更记录的载体**。\n   >\n   > 同一轮扫描还给出另一个结论：8 份 `SKILL.md` 命中 **24 处，但逐条判断后真泄漏为 0**（全是\"评审\"作动作解、判据文本引用示例词之类的假阳性）。**这实践验证了探针文件里那句「探针是探针，不是定义」**——并把新归纳的假阳性家族回填进了 `references/recall-batteries.md`。\n2. **`skills/` 下的 14 个 skill（8 mxy + 6 omo）由谁维护**？它们是第三方来源，改动会与上游同步冲突。三个选项：① 只修本项目自有的 skill；② 全部修但记录到 vendor 同步约定；③ 只报告不修。**我倾向前者**（改动第三方 vendor 内容会破坏同步链）。\n3. **是否要为 SSiD 补一条文档门禁**？SSiD 现在没有任何文档检查，所以本 skill 的成果**没有东西守护**。最小可行门禁是一条中文探针脚本（数十行，可进 `shell/scripts/`）。这是与 skill 适配无关的独立议题，但**它是 02 能否长期生效的前提**。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n本说明用到的每个数字都从这里来，**不来自记忆**：\n\n```powershell\n$d = 'DSHfork\\.agents\\skills\\dsh-trim-cot-leakage'\n@(Get-Content \"$d\\SKILL.md\").Count                          # 45\n@(Get-Content \"$d\\SKILL.md\" | Select-String '^## ').Count    # 4  一级小节\n@(Get-Content \"$d\\SKILL.md\" | Select-String '^\\d\\. \\*\\*').Count  # 8  Taxonomy 条目\n@(Get-Content \"$d\\SKILL.md\" | Select-String '^- \\*\\*').Count     # 9  keep rules\n@(Get-Content \"$d\\references\\examples.md\").Count             # 275\n@(Get-Content \"$d\\references\\examples.md\" | Select-String '^### ').Count  # 30 案例\n@(Get-Content \"$d\\references\\recall-batteries.md\").Count     # 52\n@(Get-Content \"$d\\references\\recall-batteries.md\" | Select-String '^rg ').Count  # 11 探针\n@(Get-ChildItem 'seek-soul-in-darkness\\docs' -Filter 'release-notes-*.md' -File).Count  # 19\n@(Get-ChildItem 'seek-soul-in-darkness\\skills' -Directory).Count                        # 14\n```\n\n**自查记录（第一版的两个错误，留痕）**：\n\n| 位置 | 第一版写的 | 命令产出 |\n|---|---|---|\n| §2.1 表格 | release-notes **18** 个 | **19** |\n| §三.4 / §四 | keep rules **10** 条，新增后 11 条 | **9** 条，新增后 10 条 |\n\n**这两个错误与 01 的五个错误是同一个病**：拿记忆/估算当事实。**由此定下一条强制纪律**：\n\n> **适配说明里的每一个数字，必须在文末给出可复现的命令。写不出命令的数字，不许写进正文。**\n\n**Workflow 步骤数的注意**：全文 `^\\d\\. ` 计数是 13（Taxonomy 8 + Workflow 5），**不能拿它当 Workflow 的条目数**——这正是「数字要有专属命令、且要理解命令在数什么」的实例。\n\n"},{"file":"docs/适配说明/2026-09-10-skill适配说明-03-行文标准.md","group":"适配说明","date":"2026-09-10","slug":"skill适配说明-03-行文标准","title":"skill 适配说明 03：行文标准","tags":["@max-null/dsh-skills","dsh-prose-standard","dsh-skills","ssid-prose-standard","dsh-ssid-zh-ui","dsh-doc","dsh-trim-cot-leakage","ssid-trim-cot-leakage"],"summary":"1. 它是 02 的地基。02（推理痕迹修剪）的「删之前先枚举命题」依据的就是本 skill 的完整命题规则。若只装 02 不装 03，agent 会把真事实一并删掉——那是比不做更坏的结果。 2. 它管的不是\"文风\"，是\"契约要不要写出来\"。上游定义：contract 是 caller/callee/implementer/producer/consumer 依赖的义务、不变量、前置/后置条件或","bytes":22693,"lines":288,"body":"# skill 适配说明 03：行文标准\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-prose-standard`\n**上游位置**：`DSHfork/.agents/skills/dsh-prose-standard/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与 01/02 同批）\n**上游体量**：SKILL.md 81 行 + `references/examples.md` 142 行 = **223 行**\n**清点分类**：`✅ 小改即可用`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-prose-standard/`\n**优先级**：**本 skill 是 02 的前置**（02 的完整命题规则由它 own），两者必须同批进包。\n\n---\n\n## 一、为什么做这一个\n\n1. **它是 02 的地基**。02（推理痕迹修剪）的「删之前先枚举命题」依据的就是本 skill 的**完整命题规则**。若只装 02 不装 03，agent 会把真事实一并删掉——那是比不做更坏的结果。\n2. **它管的不是\"文风\"，是\"契约要不要写出来\"**。上游定义：*contract* 是 caller/callee/implementer/producer/consumer 依赖的**义务、不变量、前置/后置条件或兼容承诺**。这跟\"写得漂亮\"无关，是**接口事实是否可被使用方读到**。\n3. **SSiD 的主体是 AI 生成的代码与文档**，而 AI 的默认倾向是**过度叙述**（讲过程、讲变更、讲理由），恰好是这条 skill 从头到尾在修剪的东西。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 上游的 12 类「行文位置」逐条对照\n\n上游按位置规定**必需覆盖**，共 **12 类条目**。SSiD 的对照如下——**这张表是本说明的核心**：\n\n| # | 上游位置 | SSiD 对应物 | 判定 |\n|---:|---|---|---|\n| 1 | Public JSDoc | 插件 `src/*.ts` 的导出 JSDoc | ✅ 有 |\n| 2 | Internal comments | 同上（`src/` 与 `lib/` 源侧） | ✅ 有 |\n| 3 | Module comments | 同上 | ✅ 有 |\n| 4 | Tests | `tests/*.spec.ts`（node:test 或 vitest，见 01 §2.1） | ✅ 有 |\n| 5 | **Cookbooks** | **无**：`docs/cookbook` 不存在（`docs/` 下只有 4 个子目录） | ❌ **删** |\n| 6 | READMEs | 13 个插件 README + 根 README | ✅ 有 |\n| 7 | **Agent Notes** | `docs/决策/`（**99 个文件**）——但制度不同，见 2.2 | ⚠️ 有，须重述规则 |\n| 8 | **Postmortems** | `docs/排查/`（**仅 1 个文件**） | ⚠️ 近乎空，保留判据但降权 |\n| 9 | Skills and agent instructions | `skills/`（**14 个** SKILL.md）+ 本包 | ✅ 有，且**最要紧** |\n| 10 | Examples and configuration comments | 插件 `cordis.patch.yml` 注释 | ✅ 有 |\n| 11 | **Prompts and visible strings** | `dsh-ssid-zh-ui` 的 `TEXT_ZH` 翻译表（`lib/client.js`）+ `verify-zh-ui.cjs` | ⚠️ 机制不同，见 2.3 |\n| 12 | **Diagnostics** | **无独立体系**——错误消息即诊断（代码内 `throw new Error(...)`） | ❌ **降级为条款** |\n\n**四个需要动作的位置**（12 类里只有这 4 个不能照搬）：\n\n- **#5 Cookbooks 删除**：SSiD 没有 cookbook。判据本身（前置条件 / 必需操作 / 真实入口 / 可观察验证 / 警示）**不删**，而是**并入 #6 READMEs** —— 因为 SSiD 的 README 实际上承担了\"怎么用\"的职责（有 `## 截图` 段与安装说明）。\n- **#7 Agent Notes 改成 `docs/决策/`**：制度不同，见 2.2。\n- **#8 Postmortems 降权**：SSiD 只有 1 份排查记录。判据保留（事故序列 / 证据 / 因果链 / 影响 / 预防），但**注明\"SSiD 此位置近乎空，写的时候按此判据，不要因为没有先例就省掉证据\"**。\n- **#12 Diagnostics 降级**：SSiD 无结构化诊断体系，错误消息直接写在代码里。把上游那三条（点名失败主体或路径 / 指明违反的规则 / 给出纠正方式）**并入 #2 Internal comments**。\n\n### 2.2 `docs/决策/` 与 DSH 的 Agent Notes 不是一回事\n\n| | DSH Agent Notes | SSiD `docs/决策/` |\n|---|---|---|\n| 位置 | `.agents/notes/{implemented,proposed,rejected}/` | `docs/决策/YYYY-MM-DD-标题.md` |\n| 状态字段 | 有（目录即状态 + 归档冻结） | **无**（靠文件名日期与内容自述） |\n| 编目 | 有 README 说明制度、有索引门禁 | **无索引、无门禁** |\n| 读者 | agent（主要） | **人**（给用户回看决策） |\n\n**这条差异决定适配时的两件事**：\n\n1. **不能把上游的 Agent Note 规则整段搬过来**（如\"implemented 用现在时\"、\"归档即冻结\"）——SSiD 没有状态机，无从施加。**只保留对 SSiD 成立的部分**：保留独有理由、机制、备选方案、后果、已交付的验证证据、点名的覆盖空白。\n2. **02 已定的「六个合法载体」在这里同样适用**：`docs/决策/` 是**变更叙事的合法主场**，行文标准**不要求它改写成 HEAD 视角**。\n\n### 2.3 Prompts 与可见字符串：机制不同\n\n上游：客户端 UI 文案归属**类型化 locale 字典**，经显式本地化 props 到达无 Cordis 依赖的原语，并有 `verify-client-ui-i18n` 门禁拒绝硬编码。\n\nSSiD：`dsh-ssid-zh-ui` 用的是**运行时翻译表**（`lib/client.js` 里的 `TEXT_ZH`）＋ 自己的验证脚本 `verify-zh-ui.cjs`（10,952 B，含翻译表覆盖 / 中文替换 / 切英文恢复 / 防误传等断言）。\n\n**所以判据保留、门禁换名**：把 `verify-client-ui-i18n` 换成 **`verify-zh-ui.cjs`**。措辞本身即行为的纪律（文案与 a11y 名称、tooltip、placeholder、格式模板一起看）**逐字保留**。\n\n### 2.4 上游引用的三处外部依赖\n\n| 上游引用 | SSiD 对应 | 动作 |\n|---|---|---|\n| `../../../docs/AGENTS.md`（文档标准） | `docs/SSiD开发手册.md` | 改指向 |\n| `../dsh-doc/SKILL.md` | **无**（`dsh-doc` 属 ⛔ 不适用） | **删除该引用**，其职责（放置 / 预算 / 双语 / 门禁）SSiD 本就没有 |\n| `../dsh-trim-cot-leakage/SKILL.md` | 02 适配版 | 保留（双向引用） |\n\n---\n\n## 三、逐条适配判断\n\n上游 SKILL.md 有 **5 个一级小节 + 引言** = 6 个部件，加 `references/examples.md` = **7 个部件**。\n\n### 1. 引言（定义 + 术语检查 + 注释规则）→ **改写**\n\n**逐字保留**：\n\n- 核心句：**\"写够以保住契约，然后删掉推理记录、重复与装饰。\"**\n- *contract* 的定义（obligation / invariant / precondition / postcondition / compatibility promise）\n- **术语检查表**：`contract`、`boundary`、`shape`、`surface`、`seam`、`gate`、`vocabulary` 是**用前要检查的词，不是禁词**——先问\"更精确的规则 / API / 字段集 / 类型 / 验证点 / 时序点 / 组件切分 / 失败状态能不能更好地陈述这个事实\"\n- **注释规则**：注释描述代码表达不了的**非显然契约或理由**，不复述代码已经蕴含的东西\n\n**要改的**：依赖声明换成 `docs/SSiD开发手册.md` + 02（去掉 `dsh-doc`）。\n\n**术语表要本地化**：`seam` / `gate` / `vocabulary` 在 SSiD 的使用语境不同。SSiD 实际会用的词是「契约 / 边界 / 表面 / 门禁 / 派生」。**适配版应给一张中英对照的两列表**，比上游的单语清单更适合中文写作场景。\n\n### 2. `## Inputs and exclusions` → **改写**\n\n**保留**：要求显式 `scope`（缺失就报告并停止，不自行推断全仓库）；`mode: automatic | interactive`（默认 automatic）；**mode 控制提问，不控制写入权**；范围里只有排除项时报告「无可用文件」。\n\n**SSiD 改写点**：\n\n| 上游 | SSiD |\n|---|---|\n| 排除 `vendor/`（含符号链接）且排除项写在包含项之后 | 保留；SSiD 的 vendor 副本在 `shell/profile-template/vendor/` 与各插件的 vendor 位 |\n| 排除 `.agents/notes/archived/` | **换成 SSiD 的冻结副本**：`references/`、`plugins/` 下与三处 vendor **逐文件全等**的副本、以及 `_archived-*` 目录。**改这些地方会破坏同步链**（SSiD 手册 §10） |\n| 派生物（生成的目录、快照、fixture）先改 owner 再重新生成 | 保留；SSiD 的派生物是 `lib/`（由 `src/` + tsdown 生成）与 `shell/profile-template/`（由源同步） |\n| 双语对（无永久 owner，任一语言可为 authored side） | **保留但降权**：SSiD 只有 1 份排查记录级别的双语需求，不是常规工作 |\n\n**新增一条（有据）**：SSiD 的**六个合法载体**（`docs/release-notes-*.md` / `docs/决策/` / `docs/设计/` / `docs/排查/` / `shell/docs/pitfalls.md`）——变更叙事在那里是内容本体。**与 02 保持一致，两处引用同一份清单。**\n\n### 3. `## Preserve the complete proposition` → **原样保留（含 5 条子项）**\n\n**这是全篇最不可动的一节**，逐字保留：\n\n编辑前先识别段落的**每一个命题**，逐个保住：actor 与 action；条件、时序与顺序；情态（must / may / never）；否定性保证与例外；归属、副作用、失败模式与后果。\n\n**\"只在每条事实子句都存活、且结果更清楚时才删形容词、重复与叙事。字数变少本身不是改进。\"**\n\n以及三条附属规则：局部保留完整契约、一个解释只有一个 home、非显然理由在\"省掉它会导致误用或错误简化\"时必须保留。\n\n**跨语言成立**，一条不改。\n\n### 4. `## Required coverage by prose location`（12 类）→ **改写**\n\n骨架（按位置规定必需覆盖 + \"这不是单向缩短，缺契约时要**补写**\"）**保留**。\n\n**具体改写已在 §2.1 的表里逐条给出**（删 1 类、降级 1 类、改述 2 类、其余照搬）。要点：\n\n- 12 类 → **10 类**（**两处并入**：Cookbooks 并入 READMEs、Diagnostics 并入 Internal comments）\n- **#9 Skills and agent instructions 要提权重**：SSiD 有 14 个 skill，而且本包的每个 skill 都属这一类。上游那条判据（陈述行为护栏 + 显式 scope 限制，如\"guidance, not a script\"；保持工作流简洁并链接其权威来源）**对 SSiD 尤其重要**——因为 02 的实测显示，泄漏就出在这里。\n\n### 5. `## Workflow`（7 步）→ **改写**\n\n7 步骨架保留，改的是**工具与门禁**：\n\n| 上游步骤 | SSiD 改写 |\n|---|---|\n| 1. 确认 scope / mode / 分支或 PR 基线 / 适用 AGENTS.md | 保留（SSiD 有根 `AGENTS.md` + `seek-soul-in-darkness/AGENTS.md`） |\n| 2. 读文档标准与属主代码 | 改指向 `docs/SSiD开发手册.md` |\n| 3. 检查请求范围而非只看最大文件 | **逐字保留**——\"用搜索与字数找候选，然后**语义判断**\" |\n| 4. 分类每处候选：keep / add / trim / restore / restructure / defer | 保留六分类；**删掉\"不得为了满足删除指标而制造编辑\"的下一句要保留**（这句是防过度修剪的） |\n| 5. 先改 owner 再改派生物；学到新规则后回头复查类似段落 | 保留 |\n| 6. 跑窄范围检查、文档门禁、`git diff --check`、可见字符串的行为测试 | **SSiD 无文档门禁** → 换成：`npm run typecheck`（shell）/ 各插件 `pnpm typecheck` + 受影响的 L1 测试；\u003cbr>**删掉 `verify-client-ui-i18n`**，改 `verify-zh-ui.cjs` |\n| 7. 报告检查范围、明确改动、有意保留、延后项、实际跑过的检查 | 保留（这是**诚实空白**纪律的载体，不删） |\n\n### 6. `## Borderline decisions` → **保留 + 小改**\n\n三条判断**逐字保留**：\n\n1. **只有当至少两个版本都满足完整命题规则、且交换的是已接受的原则时，才算边界情形**——\"一个有唯一保命题答案的改写不是边界情形\"\n2. automatic 模式下**直接应用明确编辑**，只报告真正的边界情形，**不提问**；不得为了让进度而弱化命题\n3. interactive 模式下按治理原则**归组同类段落**，给 2–3 个可行版本、推荐一个、说明事实或结构差异，**不给劣质干扰项**\n\n**要改的**：交互渠道。上游说\"当通过行内评论校准 PR 时，把推荐版本放进 diff、把备选挂在那一行\"——SSiD 没有 PR 评审流程（单人开发）。改成 **GUI 会话内呈现**（在回复里给出 2–3 个版本 + 推荐 + 事实差异）。\n\n### 7. `references/examples.md`（142 行，17 节）→ **重写**\n\n上游 17 节全是英文案例（保每条事实子句 / 显式 skill scope 是功能性的 / cookbook 保留动作与验证 / 保留归属与时序 / 事件 JSDoc 保留边界时序 / 让复杂代码定向而不叙述它 / 公开 JSDoc 含失败 / 保留简洁的实现映射 / 链接理由同时保留本地契约 / implemented Agent Note 保留验证契约 / 安全边界可能需要一个具体例子 / 彻底删除推理记录 / 配置注释解释树看不出的事 / 不要只为字数修剪 / 模型可见文本遵循归属 / 生成的摘要必须独立成立 / 限制是契约不是债务清单）。\n\n**结构照搬，案例全换成中文**，并做三处调整：\n\n- 补 **SSiD 案例**（可从本文 §2.1 与 02 §2.2 的真实样本取材）\n- **删掉**依赖 DSH 专有机制的节（cookbook、事件 JSDoc、模型可见文本归属的既有机制）\n- **保留**跨语言成立的节：**\"不要只为字数修剪\"**、**\"限制是契约不是债务清单\"**、**\"生成的摘要必须独立成立\"**——这三条在中文写作里同样高频踩坑\n\n### 8. 从 `dsh-doc` 并入的 9 条判据（见 09 号说明）→ **新增**\n\n> `dsh-doc`（861 行）被判 `⛔ 不单独适配`——它的制度部分（kind 系统 / 4 模板 / 双语配对 / 字数预算 / 网站投影 / 门禁）SSiD 一样都没有。**但它有 9 条判据的主题正是\"行文\"**，因此在 09 的合订理由里被明确移交到本节。**逐条列出，不做\"大概有点用\"的模糊移交。**\n\n#### (a) 事实核对纪律（4 条，逐字保留）\n\n上游出处：`dsh-doc` 的 \"Fact-check procedure: test, do not assume\" 节。\n\n1. **对每条声称的操作，对着当前 checkout 真跑一遍。** 执行文档将展示的每个 CLI 命令、配置片段、profile/patch 示例的**原样**版本；**只写下你观察到的**，包括确切输出、警告与失败模式。若某断言依赖你没有的密钥或网络，**说明这一点并点名验证属主，而不是断言其行为**。\n2. **★★★ 删掉你无法复现的东西。** *\"**绝不**把命令、字段、默认值或行为从**记忆、类比或邻居包的 README** 搬过来。当一条断言无法复现时，**修那条断言——而不是修测试**。\"*\n   > **这条必须提权**：它逐字描述了本系列 01/02/03/09 犯的 **9 次**\"数一数\"错误。DSH 早已把它写成判据，而 SSiD 侧没有任何等价物。**它就是本说明《写作规则》§三 的存在理由**，两者应互相引用。\n3. **对着最新 master 检查旧文档。** 修订既有页面之前先 `git fetch origin`，把该节与 `origin/master` 对照；配对 sidecar 可恢复任一侧最后确认的文本。**\"master 上一句陈旧的陈述仍然是错的\"——要对着代码改，不是对着旧散文改。**\n4. **分类主题再写安装指引。** **读事实，不要读文件夹名**：看 `package.json` 的声明与入口文件的形态，而不是目录名暗示的类型。\n\n#### (b) 语气规则（5 条，逐字保留）\n\n上游出处：`dsh-doc` 的 \"Voice rules\" 节。这些规则管的是**陈述方式**，与文档制度无关。\n\n1. **★ Summary 说的是主题能做什么。** 开篇 Summary 与用户向小节描述用户或 agent **能用它做什么**——结果、收益、何时选用、主要代价——**绝不是它的角色、类型或内部身份**。包 Summary 里的\"它是什么\"**仅指读者可见的能力**，不是它的 Cordis 角色、注册点或内部组件。*\"'这个接缝注册 `ctx.x` 并追加 `x/event` 记录'是身份叙述；'你可以每条消息存一条笔记，重启后还在'才是它做什么。\"*\n   > **与 `writing-skills` 的「description 只写触发条件」同源**：两者都是\"读者要能判断**该不该用它**，而不是被告知它内部走了几步\"。**适配版的 description 规则应把两处合并成一条**，而不是各写一份。\n2. **开发者小节解释，绝不枚举。** 折叠的实现内容覆盖整体设计概念、架构与挥手式数据流——**足够了理解它怎么工作**——并**链接代码**取确切细节；**不做完整 API 目录、穷举式字段清单、事件负载枚举或 JSDoc 复述**。\n3. **★ Dev Note 是唯一的草稿区。** 半成品想法、草稿、未定方向、实测产物与工作假设**只**出现在末尾的 Dev Note 里，并**显式标注非权威**；**其他每一节都是打磨过的当前状态散文**。\n4. **★ 只讲当前状态。** **Dev Note 之外没有兼容性垫片、迁移话术或历史**（`previously` / `now` / `no longer` / `renamed`）；**\"今天这个代码库是唯一主题\"。**\n   > **这条与 02 的推理痕迹修剪同源**——**03 与 02 应互相引用它**，而不是各自造一份判据。\n5. **用受控的技术英语。** 歧义会改变行为时，让每句话有**显式 actor 与一个主要动作**；一个概念复用一个术语；优先直接动词；拆开堆叠的指令与条件；**保留情态与例外**。（上游引用一份 ASD-STE100 启发的规范，SSiD 无对应文献 → **保留判据、删引用**。）\n\n**并入的算术**：03 的判据总数由上游 7 部件的判定结果 + **9 条新增**构成；上游部件数（7）不变，因此 §四 的算术核对不受影响。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 1 部件 | `Preserve the complete proposition`（含 5 条子项与三条附属规则） |\n| **保留 + 小改** | 1 部件 | `Borderline decisions`（仅换交互渠道） |\n| **改写** | 4 部件 | 引言（依赖与术语表）、`Inputs and exclusions`（排除项 + 六个合法载体）、`Required coverage`（12 类 → **10 类** + 提权 #9）、`Workflow`（门禁换名） |\n| **重写** | 1 部件 | `references/examples.md`（17 节结构保留、案例换中文） |\n| **删除** | 0 部件 | 无（Cookbooks/Diagnostics 是**并入**而非删除） |\n\n> **算术核对**：6（引言 + 5 小节）+ 1（references）= **7 个部件**；1 + 1 + 4 + 1 = **7** ✓\n\n**净判断：上游 81 行的判据一条不减**；改动集中在\"位置清单的本地化\"（删 1、并 1、降权 1、换机制 1）与门禁换名。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-prose-standard/\n├── SKILL.md                    # 预计 85–100 行（上游 81 + 术语对照表 + 六个合法载体）\n├── SOURCE.md                   # 用统一模板\n└── references/\n    └── examples.md             # 重写：中文案例，17 节结构保留\n```\n\n**description 建议**（**只写触发条件**）：\n\n> 在撰写、评审、恢复、修剪或审计 SSiD 仓库的中文或英文行文时使用——包括判断 Markdown、JSDoc、代码与测试注释、提示词、诊断信息、CLI 与界面字符串里哪些内容必需、哪些属于推理记录。也用于决定一段契约该写在调用点还是链接到属主文档时。\n\n**依赖声明**（双向，与 02 一致）：\n\n```\nREQUIRED BACKGROUND: ssid-trim-cot-leakage 负责查找与修复推理痕迹；本 skill 负责判断每处该保留什么。\n两者必须同批进入 @max-null/dsh-skills。\n```\n\n---\n\n## 六、SOURCE.md\n\n用 `写作规则 §七` 的模板，本 skill 的值：\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-prose-standard |\n| 上游路径 | DSHfork/.agents/skills/dsh-prose-standard/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 81 行 + references/examples.md 142 行 = 223 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（位置清单本地化 + 门禁换名） |\n| 依赖 | **ssid-trim-cot-leakage（双向，同批进包）** |\n\n---\n\n## 七、待确认\n\n1. **Cookbooks 判据并入 READMEs 是否合适**？我的理由：SSiD 的插件 README 实际承担了\"怎么用\"（含 `## 截图` 段）。若你认为该另立一类\"使用文档\"，请指出。\n2. **`docs/排查/` 只有 1 个文件**——是否为\"事故记录\"另立位置（如 `docs/排查/` 约定 + 模板）？这条决定 #8 Postmortems 判据在 SSiD 是空转还是有落点。\n3. **14 个 skill（8 mxy + 6 omo）的正文是否纳入 03 的 scope**？它们是第三方来源，改动会与上游同步冲突（与 02 §七.2 是同一个问题，建议一并决定）。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-prose-standard'\n@(Get-Content \"$up\\SKILL.md\").Count                                    # 81\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 5   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- \\*\\*').Count           # 12  位置类条目\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 7   Workflow 步数\n@(Get-Content \"$up\\references\\examples.md\").Count                      # 142\n@(Get-Content \"$up\\references\\examples.md\" | Select-String '^## ').Count # 17 examples 节数\n@(Get-ChildItem 'seek-soul-in-darkness\\skills' -Recurse -Filter SKILL.md -File).Count  # 14\n@(Get-ChildItem 'seek-soul-in-darkness\\docs' -Directory).Count          # 4   (决策/品牌/排查/设计)\nTest-Path 'seek-soul-in-darkness\\docs\\cookbook'                         # False\n```\n\n**自查记录（两处）**：\n\n1. 第一版把位置条目写成 **13 类**，命令产出为 **12**——\"数一数\"错误（01 犯 5 次、02 犯 2 次、本说明 1 次）。\n2. **生成 skill 文件时又抓到第二处**：§三.4 写「12 类 → 11 类」，但**两处并入**（Cookbooks → READMEs、Diagnostics → Internal comments）应为 **10 类**。同处的「13 个要点归为 12 类条目」也没有依据——命令产出就是 12 类条目。\n\n**教训**：第 2 处错误**直到落地成 skill 时才暴露**——说明「适配说明写完 ≠ 判据已准确」，**生成 skill 的过程本身就是一次复核**。这与本说明 §三.8 那条「对每条声称的操作真跑一遍」是同一个精神：**写下来不算验证，能用才算**。两处错误都属\"数一数\"类（本说明共 2 次；全系列至此 10 次）。\n\n> **由此加一条写作规则**（已并入 `写作规则` §三）：**\"我数过的\"不算证据**。任何形如「N 类 / N 条 / N 个」的表述，必须在写之前跑一次计数命令；凭阅读印象数出来的数，错误率不是偶然的。\n"},{"file":"docs/适配说明/2026-09-10-skill适配说明-04-代码评审.md","group":"适配说明","date":"2026-09-10","slug":"skill适配说明-04-代码评审","title":"skill 适配说明 04：代码评审","tags":["@max-null/dsh-skills","dsh-code-review","dsh-skills","ssid-code-review","dsh-prose-standard","dsh-ci-test-reliability","dsh-ssid-zh-ui","dsh-capture","dsh-habit","dsh-guardian","dsh-ssid-achievements","dsh-memory","dsh-node-appearance","dsh-chat-rail"],"summary":"上游 description 第一句：Use when reviewing a pull request in the deepseek-harness repo。它整份 skill 围绕「别人提了 PR，你来评」组织：确认 live base/head、跑 change-scope、按来源清单逐项过、把缺陷挂在 diff 行上。 SSiD 是单人（人 + AI）开发，没有 PR 评审流程。但这不","bytes":17841,"lines":255,"body":"# skill 适配说明 04：代码评审\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：已决策（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-code-review`\n**上游位置**：`DSHfork/.agents/skills/dsh-code-review/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md 52 行（**无 references**）= 52 行\n**清点分类**：`🔧 需适配`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-code-review/`\n\n---\n\n## 一、为什么做这一个（以及一个根本差异）\n\n### 1.1 上游的场景是「评审 PR」，SSiD 的主要场景不是\n\n上游 description 第一句：*Use when reviewing a pull request in the deepseek-harness repo*。它整份 skill 围绕「**别人提了 PR，你来评**」组织：确认 live base/head、跑 `change-scope`、按来源清单逐项过、把缺陷挂在 diff 行上。\n\n**SSiD 是单人（人 + AI）开发，没有 PR 评审流程**。但这不意味着删掉它——**判据是「看什么」，与「谁看」无关**。适配后是**两个场景共用一份判据**：\n\n| 场景 | 触发 | 与上游的关系 |\n|---|---|---|\n| **主场景：交付前自审** | AI 写完代码/文档，交付给用户验收之前 | 判据相同，只是「评审者」是被评代码的同一方（这反而**提高**了对 #1「新行文语义评审」的要求——自己写自己评最容易放过） |\n| **次场景：给上游提 PR 前自查** | 向 DSH / 第三方插件提 PR | **SSiD 有真实先例**：`docs/决策/2026-08-19-DSH修复PR-3198方案落盘.md`、`docs/决策/2026-08-22-open-sea-skin增强版提交上游PR.md`。此时上游流程（base 确认、行内评论）**照旧适用** |\n\n### 1.2 它是 01/02/03 的汇聚点\n\n上游 Sources of truth 里直接引用 `dsh-prose-standard`（→ 03）与 `dsh-ci-test-reliability`（→ 01）。所以 04 是**依赖链的上游**：\n\n```\n04 代码评审 ──引用──> 01 测试可靠性（测试与拆除判据）\n           ──引用──> 03 行文标准（新增文案的语义评审）\n```\n\n**结论：01/02/03 必须先于 04 存在**，否则 04 的 Blocking #1 与 Manual「测试可靠性」两条会指向空。这是**第三组依赖关系**（前两组：02↔03 双向依赖、01 被 06 引用）。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 上游引用的 DSH 机制，SSiD 有没有\n\n| 上游机制 | SSiD | 依据 |\n|---|---|---|\n| `pnpm run change-scope --base \u003cref>` | **无** | `shell/scripts/` 只有 5 个脚本（after-pack / boot-bundled / prepare-runtime / repack-open-sea-skin-vendor / verify-deploy-rename） |\n| `docs/defensive-patterns.md` | **无该文档** | `docs/` 下只有 4 个子目录与 24 个顶层 md |\n| `docs/AGENTS.md`（文档标准） | 对应 `docs/SSiD开发手册.md` | — |\n| `docs/testing.md` + quality-gates Agent Note | 对应手册 **§9 插件开发与测试规范**（含 `### 分级门槛`，2026-08-30 定稿） | L303 / L307 |\n| Agent Notes（`.agents/notes/`） | 对应 `docs/决策/`（99 个文件）**但无状态机**（见 03 §2.2） | — |\n| `subsystems/` 页 + `type-equiv` | **无** | grep 无实际使用 |\n| `./invariant` 伴生 | **无** | grep 无实际使用 |\n| i18n（`translation-rules.md` / `terminology.md`） | **无双语制度**；但有 `dsh-ssid-zh-ui` 的运行时翻译表 | — |\n| `verify-client-ui-i18n` | 对应 **`verify-zh-ui.cjs`**（10,952 B） | — |\n\n### 2.2 清点表的一处判断需要更正：Cordis 注册**不是** DSH 专有\n\n`2026-09-10-DSH-skills适配清点.md` §126 把「#4（Cordis 注册）」列为 DSH 专有条款。**实测推翻**：\n\n| 证据 | 位置 |\n|---|---|\n| `ctx.effect(() => ctx.webServer.register({` | `dsh-capture/src/index.ts:172`（另有 draft-polish:119、memory/routes.ts:272） |\n| `this.ctx.storage.backend.register('habit', backend)` + `this.ctx.effect(() => async () => { await backend.close() }, 'habit.backendClose')` | `dsh-habit/src/engine.ts:78-79` |\n| 同上（guardian） | `dsh-guardian/src/engine.ts:138-139` |\n| `ctx.on('session/event', ...)` | `dsh-habit/src/engine.ts:91`、`dsh-guardian/src/engine.ts:153`、`dsh-ssid-achievements/src/engine.ts:245,258` |\n| `ctx.tools.register(defineTool({...}))` | `dsh-memory/src/index.ts` **10 处**（L236…L467） |\n| `ctx.slots.inject(...) / ctx.slots.register(...)` | `dsh-capture/src/client/index.ts:104,111`、`dsh-node-appearance/src/client/index.ts:78` |\n| `projectionCtx.sessionProjections.register(...)` | `dsh-chat-rail/src/index.ts:211` |\n\n**SSiD 的插件是彻头彻尾的 cordis 插件**，注册点遍布 storage backend、webServer、tools、slots、session projections。「注册即效果、`register()` 返回 disposer」这条规范**完全适用**。\n\n**更要紧的是**：`dsh-habit` 与 `dsh-guardian` 已经写出了**教科书式 cleanup**（`register` + `ctx.effect` 返回 `backend.close()`）。但：\n\n> **插件测试里没有任何 disposal 断言**——在 `max-null-plugins/**/*.test.ts` 里搜 `dispose|disposer|ctx.scope` **零命中**。\n\n**所以 #4 在 SSiD 不是「专有条款该删」，而是「当前缺失的守卫」**——注册写了清理，却没有任何测试证明它清了。这条要**保留并提权**。\n\n---\n\n## 三、逐条适配判断\n\n上游共 **5 个部件**（引言 + 4 节），无 references。判据总数为 **31 条**（Sources of truth 8 + Blocking 7 + Manual checks 16）。\n\n### 1. 引言 → **改写（场景重述）**\n\n**逐字保留**：\n\n- **\"This skill is guidance, not a complete checklist.\"**（上游显式声明 scope，符合 03 的 #9 位置判据）\n- **\"先验证并获取 PR 的 live base 与 exact head\"** → 主场景改为「先确认改动的起点」（`git status` / 分支 / 与上次交付的差异）\n- **\"范围报告不替代语义评审\"** —— 这句在 SSiD **更重要**，因为 SSiD 连范围报告工具都没有\n- **\"优先正确性、生命周期、安全与必需行为，而不是风格；一条有证据的阻塞项胜过一长串小毛病\"** —— 逐字保留\n\n**要删的**：`change-scope` 命令（SSiD 无此工具）。**替代**：用 `git diff --stat` + 受影响包清单，并**明确写\"这不是 change-scope 的等价物，它只给路径不给脏层\"**。\n\n### 2. `## Sources of truth`（8 条）→ **重写指向（8 → 6 条）**\n\n| 上游 | 适配后 |\n|---|---|\n| `AGENTS.md` + `packages/AGENTS.md` | **工作区根 `AGENTS.md`** + **`seek-soul-in-darkness/AGENTS.md`** |\n| `docs/defensive-patterns.md` | **合并进下一条**——其判据（子进程/回调/异步状态/拆除的缺陷类）由 **01 适配版** 覆盖 |\n| `docs/AGENTS.md` | **03 适配版**（`ssid-prose-standard`）+ `docs/SSiD开发手册.md` |\n| `dsh-prose-standard` | → **03**（保留引用） |\n| `dsh-ci-test-reliability` | → **01**（保留引用） |\n| `docs/testing.md` + quality-gates Agent Note | → **手册 §9**（分级门槛）。**Agent Note 部分删除**（SSiD 无此制度） |\n| Agent Notes 目录 | → **`docs/决策/`**。保留上游那句关键的软化：**\"与决策记录意见不同是设计讨论，不是自动否决\"** |\n| i18n（`translation-rules.md` / `terminology.md`） | **删除**——SSiD 无双语配对制度 |\n\n### 3. `## Blocking requirements`（7 条）→ **改写（7 → 5 条）**\n\n| # | 上游 | 判定 |\n|---:|---|---|\n| 1 | 新行文接受语义评审 | **保留**，指向 03。**在自审场景下要加一句**：\"自己写的文案由自己评\"失败率最高，须逐段对着属主代码或行为核，而不是重读一遍觉得通顺 |\n| 2 | 文档与代码同 diff 同步 | **保留**；门禁换名（`verify-client-ui-i18n` → `verify-zh-ui.cjs`） |\n| 3 | 核心类型文档匹配（subsystems 页 + `type-equiv`） | **删**——SSiD 无 subsystems 页、无 type-equiv 清单 |\n| 4 | 注册要清理（disposal tests） | **保留并提权**（见 §2.2）：SSiD 有大量 cordis 注册与真实 cleanup 代码，**但零 disposal 测试**。指向改为根 `AGENTS.md` 的\"注册即效果\"＋插件自身的 `ctx.effect` 用法 |\n| 5 | Invariant companions are semantic | **删**——SSiD 无 `./invariant` 机制 |\n| 6 | 必需证据存在 | **保留**；\"relevant local checks\" → **L1 门槛（typecheck + test 全绿）**＋手册 §9 的 L2/L3 分级 |\n| 7 | 客户端 UI 文案归 locale | **保留**；机制换述——SSiD 用运行时翻译表（`TEXT_ZH` in `lib/client.js`）＋ `verify-zh-ui.cjs`。**保留用户/模型/线上数据与 code token 逐字不动**这条 |\n\n### 4. `## Manual checks`（16 条）→ **改写（16 → 14 条）**\n\n**12 条原样保留**（判据与语言、仓库无关）：意图与接口契约 / 生命周期与并发 / 能力与消费者匹配 / 范围·归属·必要性 / 配置与公开选择 / 模型视角 / 强制点（denial 路径） / 借用与派生状态 / 边界覆盖最终操作 / 测试强度 / 测试可靠性 / 真实入口。\n\n**2 条改写**：\n\n- **#10 Real entry path**：上游的入口是 Loader / bin / worker / ACP bridge。SSiD 的对应是 **Electron 壳（`main.mjs`）→ `kernel.bundle.mjs` → profile 装载**，以及插件的 `package.json` 导出面（`main` / `exports` / `dsh.client`）。保留上游最有用的一句：**\"手工挂载的插件抓不到非法的 Loader 导出\"**——对应 SSiD 就是「手工 import 抓不到 `cordis.patch.yml` / exports 面的错误」。\n- **#14 Implemented Agent Notes match shipped reality** → 改为**「决策记录与已交付现实一致」**：SSiD 的 `docs/决策/` 无状态机，所以不做「proposed → implemented 的移动与改写」，只要求**决策记录里陈述的机制、路径、名字与实际交付一致**；不一致时**改记录或改代码，不留着两说**。\n- **#15 Transcript changes**（snapshot）→ 改为**截图基线**：SSiD 无 transcript snapshot 制度，但有 Playwright 截图基线（`shell/tests/plugin-adapt/baselines/`，`pnpm baseline` 生成）。保留上游的核心判断：**\"expected-output 的 diff 要当作行为变更来评审，不是格式噪音\"**——对应截图就是\"基线变了要问为什么变，不是重新生成就完事\"。\n\n**2 条删除**：\n\n- **#13 Invariant lifecycle and negative controls** → 删（无 invariant 机制）。**但它有一半要救**：上游那句\"**一条蓄意无效的用例必须经由真实运行器按预期规则失败**\"（负向控制）与 invariant 无关，是**通用**的——**并入 #11 测试强度**。\n- **#16 Bilingual changes** → 删（无双语制度）。\n\n### 5. `## Reporting findings` → **改写（渠道不同）**\n\n上游：缺陷挂**最紧的相关 diff 行内**，跨切面用 PR 级评论，用既有 review thread 回复；收到评审时逐条核实、**以技术理由修正或反驳，不做表演性同意**。\n\n**适配**：\n\n- **主场景（自审）**：报告进 **GUI 会话内的交付说明**——按 **阻塞项 / 建议** 分开，每条给「缺陷 + 位置 + 影响 + 证据」四元组（上游四要素逐字保留）。**\"omit issues already enforced by a green gate\"** 保留——已被 L1 门禁守住的事不重复报告。\n- **上游 PR 场景**：上游流程照旧（行内评论 + PR 级评论）。\n- **\"verify each claim and fix or rebut it on technical grounds without performative agreement\"** —— 逐字保留。这条对 AI 尤其重要：**收到用户反馈时不要表演性同意，要么改、要么给技术理由**。\n\n### 6. 从 `dsh-doc` 并入的 6 条质量判据（见 09 号说明）→ **新增**\n\n> `dsh-doc`（861 行）被判 `⛔ 不单独适配`，但它的 \"Quality criteria\" 节**正是评审时要问的问题**，因此在 09 的合订理由里移交到本节。\n> **并入位置**：`Manual checks` 里审阅**新增或修改的文档**时逐条过；同样适用于审阅新增的 skill 正文。\n\n| # | 判据 | 要问的问题 |\n|---:|---|---|\n| 1 | **Brief** | 常用路径**只含其结局所需的事实**；穷尽真相保持在**一个直接链接或一层细节**之外 |\n| 2 | **Intuitive** | **前置先于依赖概念**；**下一步动作是显然的**；标题用读者会搜的词 |\n| 3 | **Friendly** | 读者能**识别成功**、**行动前理解风险**、**从可能的失败中恢复**、并能选择是否继续深入 |\n| 4 | **Accurate** | 每条持久断言**有一个属主**，以及**与其风险相称的验证路径** |\n| 5 | **★ Agent-readable** | 元数据、稳定标题、锚点、术语、归属、当前/提议状态**支持定向检索，而不必加载整个语料** |\n| 6 | **Newcomer-complete** | 一个没有仓库上下文的专业工程师，能**通过 3–5 个链接页重建相关架构或特性** |\n\n**第 5 条对 SSiD 尤其要紧**：它判的正是「**skill 与文档能不能被 agent 定向检索**」——也就是本系列全部适配工作的目标。若一份 skill 的元数据、标题、术语做不到定向检索，那么它写得再对，agent 也会**因为读不到而用不上**。\n\n**并入的算术**：上游 `Manual checks` 的 16 条判定（16 → 14）**不变**；这 6 条是**评审时额外要问的清单**，不是替代品。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 1 部件（部分） | `Manual checks` 的 12/16 条判据 |\n| **改写** | 4 部件 | 引言（场景重述）、`Blocking`（7→5）、`Manual`（16→14，含 2 条改写）、`Reporting`（渠道） |\n| **重写指向** | 1 部件 | `Sources of truth`（8→6，全部换成本地路径） |\n| **删除** | 0 部件 | 无（整节无删除） |\n\n**判据级算术核对**：\n\n| 节 | 上游 | 适配后 | 变化 |\n|---|---:|---:|---|\n| Sources of truth | 8 | 6 | −2（删 i18n 源；defensive-patterns 并入） |\n| Blocking requirements | 7 | 5 | −2（删 subsystems/type-equiv、invariant） |\n| Manual checks | 16 | 14 | −2（删 invariant 负向控制、双语） |\n| **合计** | **31** | **25** | **−6** |\n| 部件（引言 + 4 节） | 5 | 5 | 0 |\n\n**净判断：删除的 6 条全部因「SSiD 无对应机制」，无一因「不需要」**；`Reporting` 的\"不做表演性同意\"、`Blocking` 的\"自己写自己评失败率最高\"等**通用纪律逐字保留**。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-code-review/\n├── SKILL.md        # 预计 60–75 行（上游 52 + 场景重述 + 本地指向）\n└── SOURCE.md\n```\n\n**命名**：`ssid-code-review`。\n\n**description 建议**（**只写触发条件**）：\n\n> 在交付 SSiD 的代码或文档改动之前自审时使用，也用于向 DSH 或第三方插件提 PR 前的自查——包括判断改动是否满足仓库规范、接口契约两侧是否一致、生命周期与并发是否有缺陷、注册是否可清理、必需证据是否存在、界面文案是否越权硬编码。\n\n**依赖声明**：\n\n```\nREQUIRED: 本 skill 引用 ssid-test-reliability（01）与 ssid-prose-standard（03）。\n三者必须同批进入 @max-null/dsh-skills。\n```\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-code-review |\n| 上游路径 | DSHfork/.agents/skills/dsh-code-review/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 52 行（无 references） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（场景重述 + 来源指向重写 + 删 6 条无对应机制的判据） |\n| 依赖 | 引用 01、03（同批进包） |\n\n---\n\n## 七、待确认\n\n1. **主场景定为「交付前自审」是否正确**？依据是 SSiD 无 PR 评审流程（单人开发）＋上游 PR 场景另有 2 次真实先例。若你实际上有 PR 评审环节（哪怕是自建流程），这条要改。\n2. **disposal 测试要补吗**？（§2.2）这是本说明挖出的**真实缺口**：`dsh-habit` / `dsh-guardian` 写了 `ctx.effect(() => async () => backend.close())`，但**没有任何测试**验证它。补测试是独立任务（与 skill 适配无关），但它恰好是 04 的 Blocking #4 在 SSiD 的唯一落点。\n3. **`change-scope` 要不要移植**？DSH 的这个工具（显式 base → 变更路径 + 受影响包 + 脏层）在你此前的学习笔记里已两次提到（`2026-09-10-DSH工程方法论学习笔记.md:24` 等）。这是**工具**而非 skill，属独立议题。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-code-review'\n@(Get-Content \"$up\\SKILL.md\").Count                                    # 52\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 4   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^### ').Count             # 0   二级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- ').Count               # 24  列表项\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 7   Blocking 条数\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- \\*\\*').Count           # 16  Manual 条数\n# 24 = Sources of truth 8 + Manual checks 16 ✓（Blocking 用编号不用列表）\n\n@(Get-ChildItem 'seek-soul-in-darkness\\shell\\scripts' -File).Count      # 5   脚本数\n@(Get-ChildItem 'seek-soul-in-darkness\\docs\\决策' -File -Filter '*PR*').Count  # 2  上游 PR 先例\nTest-Path 'seek-soul-in-darkness\\docs\\cookbook'                         # False（03 用）\n```\n\n**推导核对**：`^- ` 得 24；其中 Sources of truth 8 条 + Manual checks 16 条 = 24 ✓ 两节可互相验证。\n\n**自查记录**：本说明未发现数字错误——**因为先跑了命令再写**（03 的教训：凭印象数 12 类位置写成 13 类）。这条纪律生效了。\n"},{"file":"docs/适配说明/2026-09-10-skill适配说明-05-简化审查.md","group":"适配说明","date":"2026-09-10","slug":"skill适配说明-05-简化审查","title":"skill 适配说明 05：简化审查","tags":["@max-null/dsh-skills","dsh-find-simplifications","dsh-skills","ssid-find-simplifications","dsh-chinese-thinking","dsh-memory","dsh-node-appearance","dsh-assistant-center","dsh-archive-agent-notes","ssid-prose-standard","dsh-tmp"],"summary":"上游开场就定死了用途：把这句\"找找能简化的地方\"变成一个有证据支撑的 Agent Note。所以它的真正难点不是\"怎么删代码\"，而是\"怎么证明该删\"： - §2 给 9 条 strong-candidate 判据（无生产消费者 / 只有测试和文档在用 / 两份表示镜像同一事实 / 无消费者的 seam 方法 / 只为测试存在的包 / 猜测性产品通用能力 / 只为保护未用 API 而存在的不变量与回","bytes":23271,"lines":315,"body":"# skill 适配说明 05：简化审查\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-find-simplifications`\n**上游位置**：`DSHfork/.agents/skills/dsh-find-simplifications/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md 157 行（**无 references**）= 157 行\n**清点分类**：`🔧 需适配`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-find-simplifications/`\n\n---\n\n## 一、为什么做这一个（以及一个必须说清的定位）\n\n### 1.1 它是「把宽泛请求变成有证据的提案」的 skill\n\n上游开场就定死了用途：*把这句\"找找能简化的地方\"变成一个**有证据支撑的 Agent Note***。所以它的真正难点**不是\"怎么删代码\"，而是\"怎么证明该删\"**：\n\n- §2 给 **9 条** strong-candidate 判据（无生产消费者 / 只有测试和文档在用 / 两份表示镜像同一事实 / 无消费者的 seam 方法 / 只为测试存在的包 / 猜测性产品通用能力 / 只为保护未用 API 而存在的不变量与回滚路径 / 手搓了依赖已有的东西 / 简化后行为略变但更好解释）\n- §7 给 **\"证明或否证\"** 的完整流程（先分类消费者：生产语料 / 非生产语料 / 模糊语料；再用 `rg` 找，再读调用点）\n- §7 还有 **4 条拒绝条件**（生产调用方存在则这是特性决策不是清理 / 已被实现的 Agent Note 或来之不易的防御模式论证过 / 会引发无关改动却没真减少公开 API / 想法对但太小 → 加内联 TODO）\n\n**这套\"先证明再动手\"的纪律，正是 SSiD 最缺的**。\n\n### 1.2 定位：这是**引入新实践**，不是改进已有实践\n\n实测（§2.1）：**SSiD 目前没有任何简化类决策记录，也没有任何内联 TODO 标记**。所以：\n\n- 本 skill 的判据**来源清楚**（上游 157 行，已经过 DSH 真实历史检验）——满足三层验证规则里\"未改动判据继承上游检验\"\n- 但它的**落地场景在 SSiD 是空的**。落地后会**开始产生** `docs/决策/` 里的简化类记录\n- **因此它不能声称\"改进现有流程\"**。它的价值是**给 SSiD 补一套\"如何证伪一个简化提案\"的方法**\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 三个\"零命中\"与一个不一致\n\n| 检查 | 结果 |\n|---|---|\n| `max-null-plugins/**/*.ts` 中的 `TODO(` / `FIXME` / `XXX(` | **零命中** |\n| `docs/决策/*.md` 的简化 / 清理 / 重构 / 瘦身 / 去重类记录 | **零命中** |\n| 插件测试目录命名 | **不一致**：9 个用 `tests/`，3 个用 `test/`（dsh-chinese-thinking / dsh-memory / dsh-node-appearance），1 个无（dsh-assistant-center） |\n\n**三条推论**：\n\n1. **§10「Inline TODO Notes」在 SSiD 是空白**。SSiD 的待办集中在 `docs/SSiD开发手册.md` 的「待办清单」节（L278），**不在代码里**。适配时**保留判据但标注现状**，而不是假设它已在用——否则 agent 会以为仓库里到处是 TODO 需要合并。\n2. **§8「Coalesce Superseded Agent Notes」基本无落点**（见 §三.8）。SSiD 的 `docs/决策/` 没有状态机、没有归档制度、没有索引——**没有\"被取代的笔记\"这个概念**。\n3. **§7 的语料分类要写两个目录名**（`test/` 与 `tests/` 并存）。上游只面对 `tests` 一种，SSiD 必须同时匹配。\n\n### 2.2 上游引用的 DSH 机制，SSiD 有没有\n\n| 上游引用 | SSiD |\n|---|---|\n| `AGENTS.md`（含 pre-release 立场、tests/Agent Notes are-not-golden-truth 两条信条） | 工作区根 `AGENTS.md` + `seek-soul-in-darkness/AGENTS.md`（**无对应的两条信条**） |\n| `docs/defensive-patterns.md` / `docs/testing.md` / `docs/architecture.md` / `docs/development.md` | **全无**；对应物是 `docs/SSiD开发手册.md`（§9 测试规范 / §7 常见坑）与 **01/03 适配版** |\n| Agent Note 树（`.agents/notes/` + 归档制度 + 索引） | `docs/决策/`（99 个文件），**无状态机、无归档、无索引** |\n| `./invariant` 伴生 | **无** |\n| 依赖政策 Agent Note（`2026-07-26-dependencies-over-hand-rolling.md`） | **无对应记录**；判据本身通用，指向工作区 `AGENTS.md` |\n| `dsh-archive-agent-notes`（§8 引用） | **⛔ 不适用**（该 skill 属四份不适配之一） |\n| `pnpm run doc-sync` / `lint` / `git diff --check` | **无 doc-sync、无 lint**；有 `git diff --check`（pre-commit 钩子）与 L1（typecheck + test） |\n\n---\n\n## 三、逐条适配判断\n\n上游共 **13 个部件**（引言 + 12 个一级小节；另有 1 个二级小节 `### Audit invariant companions` 挂在 §2 下）。\n\n### 1. 引言 → **改写（载体重述）**\n\n上游：*把宽泛的\"找找能简化什么\"变成**有证据的 Agent Note***。\n\nSSiD 版：*把所有\"找找能简化什么\"变成**写在 `docs/决策/` 的提案**，或在提案够格之前先只给证据*。\n\n**逐字保留**两句：*\"It is guidance, not a checklist: follow the code, keep judgment active\"*、***\"prefer a few well-proven candidates over a pile of thin guesses\"***（宁可少而扎实，不要一堆薄猜测）。\n\n**新增一句（有据）**：SSiD 的 `docs/决策/` 目前**没有**简化类记录，所以**第一条这样的记录会是先例**——写的时候要把 §9 的结构写全，它会成为后续的模板。\n\n### 2. `## Start With Repo Context` → **改写（引用换指向）**\n\n上游 3 条：\n\n- 读 `AGENTS.md`（含 pre-release 立场与两条\"不是金科玉律\"信条）+ `defensive-patterns.md` + `testing.md` → SSiD：根与 SSiD 的 `AGENTS.md`、手册 §9（测试规范）与 **01**；**删掉两条信条**（SSiD 没有对应表述，不硬造）\n- 读 `architecture.md` → SSiD：`docs/设计/SSiD-壳级能力设计.md` 与 `docs/决策/2026-09-10-官方桌面壳评估与方案B决策.md`\n- 用 Agent Note 树理解有意为之的架构 + 5 个具体范例 → SSiD：**改为\"先搜 `docs/决策/` 里是否已有相关决策\"**（99 个文件，用关键词搜），**删掉那 5 个 DSH 具体范例**（路径在 SSiD 不存在）\n\n**保留上游最要紧的一条硬约束**（原样）：**默认认为双 LLM 适配器是有意为之的，不要把它当作\"低成本\"删除目标**——除非用户显式推翻。SSiD 的对应保护对象是 **`dsh-memory` 的 storage backend 抽象**与**壳/内核边界**（`shell/main.mjs` ↔ `kernel.bundle.mjs` ↔ profile），简化提案要动它们必须给出比现状更强的证据。\n\n### 3. `## What Counts As A Strong Candidate`（9 条）→ **保留 9 条判据，删 1 个二级小节**\n\n**9 条判据全部保留**（它们与仓库结构无关，是\"什么样的东西算值得删\"的定义），包括：\n\n- 最后一条 **\"简化后行为可以略有不同，但新行为仍然合理且更容易解释\"** —— 这条最重要，它给了简化一个**正当的模糊余地**，避免\"行为必须 100% 等价\"的僵化（那会让绝大多数真实简化被否掉）\n\n**需要本地化的两处**：\n\n- 第 6 条（猜测性产品通用能力）上游列了 DSH 的具体清单（multi-session/session-load、background job rosters、live registry invalidation、mid-turn steering、tool-owned UI rendering）。**SSiD 侧实例清单留白**——不凭空编造，留给实际使用填充，并注明\"留白是有意的\"。\n- 第 7 条含\"invariant\"字样（只为保护未用 API 而存在的不变量）→ 删掉 invariant 一词，保留判据本体（回滚路径 / 期望输出集 / 特例测试）。\n\n**二级小节 `### Audit invariant companions` → 删除**。SSiD 无 `./invariant` 机制（04 §2.1 已核）。**但它有一句通用的该救**：*\"只比较**能独立分叉**的观测才算有用\"* —— **并入第 3 条**（两份表示镜像同一事实），因为那是同一个判断。\n\n### 4. `## Survey Broadly` → **改写（领域清单全换）**\n\n**保留骨架**：用并行 subagent 求广度；给每个 agent 一个**域**并要求**证据而非猜测**；**\"不要让第一个好候选中止普查\"**；从**最大的生产代码差异**开始（大范围审查若止步于显而易见的未用符号，会漏掉那些生命周期或防御机制承载主要成本的文件）。\n\n**5 个域全部换成本地域**（上游是 agent loop / ACP / LLM-tools / Bash / packages）：\n\n| # | SSiD 的域 |\n|---:|---|\n| 1 | **壳与内核边界**：`main.mjs` / `kernel.bundle.mjs` / profile 装载 / splash 与部署流程 |\n| 2 | **插件面**：13 个插件的注册点（storage backend / webServer / tools / slots / sessionProjections）、`cordis.patch.yml`、`dsh.client` 导出面 |\n| 3 | **数据传输与状态**：session projection、storage backend、settings、MCP 注册项 |\n| 4 | **测试与派生物**：`test/` 与 `tests/` 并存、Playwright 截图基线、`lib/` 与 `src/` 同步、vendor 三处副本 |\n| 5 | **文档与规范**：手册、`docs/决策/`（99 个）、插件 README 的重复内容 |\n\n**新增一条（有据）**：**vendor 与 profile-template 的副本是一类特殊候选**——它们是**同步链的产物**（手册 §10：不发布 npm、四份指纹一致、改后必同步运行时实体）。删任何一处都会断链，所以**要么整体处理，要么不动**。上游没有这类约束（DSH 只有 `vendor/` 一处）。\n\n### 5. `## Simplify Prose With The Code` → **保留**\n\n**逐字保留**：注释与文档**是按面积维护的一部分**；删掉复述代码或解释别处已拥有的行为的注释；**保留必需的局部契约**；文档留在其属主层级，略去实现细节与罕见情形，除非它们改变被维护的契约。\n\n指向改为 **03**（`ssid-prose-standard`）。\n\n### 6. `## Audit Trust And Lifecycle Boundaries` → **保留**\n\n**逐字保留**判断框架：对每个防御性拷贝、冻结、验证器与回调捕获，**点名值从哪来、下一个所有者是谁**；同进程的类型化 service/plugin 调用**通常借用只读值**；解析器、配置装载、队列、模型/工具 JSON、持久文件、worker、进程与 wire 解码器**拥有或验证**它们的数据。\n\n**保留那句反直觉的**：*\"围绕敌意 getter、伪造的类型化对象、回调替换、或同进程交接后突变构造的测试，是**可能存在投机契约的证据**，而不是保留它的自动理由。\"*\n\n**要改的**：上游的判据链指向 DSH 的 `defensive-patterns.md` → 改为 **01**（测试可靠性覆盖生命周期/拆除）＋ SSiD 的实际边界（Electron 主进程 ↔ 渲染进程、`kernel` ↔ 插件、MCP 传输、`webServer` 路由）。\n\n### 7. `## Hand-Rolled Code Versus A Dependency` → **保留，政策出处换指向**\n\n**逐字保留 4 条证明要求**：\n\n1. 读手搓实现，**点名该包覆盖的确切表面**；包里没覆盖的残余语义**算作反对交换的依据**并留在提案里\n2. **诚实检查该包的健康度**（维护、采用、传递依赖足迹）；引擎底线已有内置时优先内置\n3. **先查决策记录**：已被记录结论钉住的接缝，交换它必须**胜过那份记录的理由**，而不只是引用政策\n4. **算净删除量**：实现 + 专用测试 + 文档，**减去残留的胶水**；**只是把同样的复杂度搬个家的包装不算赢**\n\n**政策出处**：上游引 `2026-07-26-dependencies-over-hand-rolling.md`（DSH 的 Agent Note）。SSiD 无对应记录 → 改指向工作区 `AGENTS.md`，并**注明\"SSiD 尚无成文的依赖政策，本 skill 落地时应同步补一条\"**。\n\n### 8. `## Prove Or Reject Each Candidate` → **改写（语料定义本地化）**\n\n**保留**：先分类消费者再动笔；先 `rg` 再读调用点；**4 条拒绝条件全部保留**（其中\"想法对但太小 → 加内联 TODO\"依赖 §10，见下）。\n\n**语料三类改为 SSiD 的**：\n\n| 上游 | SSiD |\n|---|---|\n| 生产语料：`packages/*/src`、`examples/*/src`、`examples/**/*.yml`、运行时脚本、loader/config 路径 | **`max-null-plugins/*/src`、`seek-soul-in-darkness/plugins/*/src`、`shell/main.mjs`、`shell/kernel.ts`、`shell/scripts/`、`shell/profile-template/`** |\n| 非生产语料：tests、README/docs、Agent Notes、snapshots、生成的期望输出、注释 | **`test/` 与 `tests/`（两者都要匹配）、`lib/`（派生）、README、`docs/`、Playwright `baselines/`** |\n| 模糊语料：可能是产品冒烟路径的 examples 与脚本 | **`references/`（参考副本）、`.dsh-tmp/`、vendor 副本** |\n\n**搜索工具**：上游用 `rg` → SSiD 同样用 ripgrep ✓（本机可用，本体已多次使用）。\n\n### 9. `## Coalesce Superseded Agent Notes` → **大幅删改（5 步 → 1 步）**\n\n上游 5 步（识别当前 owner → 判断完全/部分取代 → 移交独有理由 → 修入链并三件套同删 → 搜残留）**依赖一整套 SSiD 没有的制度**：状态机、`archived/` 冻结、中英对照三件套、入链门禁。\n\n**SSiD 的对应物只有一个动作**：\n\n> **当一条新决策记录取代了某条旧记录时，在旧记录顶部加一行\"已被 `\u003c新文件名>` 取代\"，并在新记录里链接旧记录。** 不删除（`docs/决策/` 是历史，且没有归档制度来承载\"冻结\"语义）。\n\n**保留上游那句边界**（逐字）：**\"不要把每次代码简化普查都扩大成全仓库的笔记审计\"**。\n\n**明确不做的**：上游的\"完全取代 vs 部分取代\"细分、理由移交清单、入链修复、三件套同删——**SSiD 没有可移交的落点，也没有三件套**。硬搬会让 agent 去修不存在的链接。\n\n**保留上游的一条判断（有据且通用）**：*\"先移除后加回\"的功能是典型的完全取代案例*——但只有当该功能确已从生产代码、配置、schema、持久或 wire 格式、迁移与兼容行为中消失时，移除记录才可以独占其历史。\n\n### 10. `## Write The Agent Note` → **改写为「写决策记录」**\n\n上游的落点是 `.agents/notes/\u003clifecycle>/\u003cclass>/yyyy-mm-dd-topic.md` + `Status: proposed` + 7 条建议结构。\n\n**SSiD 落点**：`docs/决策/YYYY-MM-DD-\u003c标题>.md`（无 lifecycle 目录、**无 Status 字段**）。\n\n**7 条建议结构保留 6 条**（把 `Status: proposed` 去掉，其余照搬）：\n\n1. `# \u003c动作导向的标题>`\n2. `## 问题`：点名当前 API、引用相关文件、陈述消费者证据；**把生产调用方与测试/文档分开**\n3. `## 提案`：确切说明要**移除、折叠、降级还是换位**；相关时含测试、文档、README、JSDoc、快照与生成文件的清理\n4. `## 为什么不保留它？` 或 `## 我们放弃了什么`：**让最强的反方论证可被看见**\n5. `## 验收标准`：可观察的终态与门禁\n6. `## 风险`：公开 API 变更、行为变更、未来产品需求，以及为何这笔权衡仍然合理\n\n**保留上游的收尾约束**：具体到\"一个实施者能顺着痕迹走下去\"；**避免\"简化这个包\"这类含糊提案**；与既有记录重叠时，**把有用的细节并入既有记录而不是新建重复**。\n\n### 11. `## Inline TODO Notes` → **保留判据 + 标注现状空白**\n\n**逐字保留**：内联 TODO/FIXME/XXX **只用于小而局部、明显有用但不是持久设计决策**的清理；**用稳定标签点名异味**（如 `TODO(double-default)`、`XXX(unused-default)`）；**说明为什么可以安全重访、什么动作会简化它**；**不要为投机性抱怨或需要记录级决策的行为加 TODO**。\n\n**必须新增的现状说明**（有据）：**SSiD 目前零 TODO 标记**，待办集中在手册的「待办清单」节。所以：\n\n- 若采用内联 TODO，**要先定紧迫度语义**（上游有 `FIXME`/`TODO`/`XXX` by urgency 的文档，SSiD 无）——**这是落地时的一个前置决定，不是可以直接照抄的**\n- 否则 §7 的\"想法对但太小 → 加内联 TODO\"这条拒绝条件的**出口是空的**，会变成\"想法对但太小 → 忘掉它\"\n\n### 12. `## When Folding Another PR Or Branch` → **降权保留**\n\n上游 5 条依赖 GitHub PR/stack 工作流。SSiD 无 PR（04 §一已定），**但有给上游提 PR 的真实场景**（2 次先例）。\n\n**保留为\"次场景\"**：向 DSH 或第三方插件提 PR 前，diff 对照 `origin/master` 而非当前分支；移植达标的记录、把重叠材料并入既有记录、**不为凑数移植低置信度提案**、更新 PR 描述让评审者看到真实计数。\n\n**删掉**：\"关闭重复 PR\"（SSiD 不拥有上游仓库的 housekeeping）。\n\n### 13. `## Validation And PR Hygiene` → **改写（门禁换名）**\n\n上游：docs-only 至少跑 `pnpm run doc-sync` + `lint` + `git diff --check`；代码注释或 skill 改动另跑相关验证器。\n\n**SSiD 版**：\n\n| 上游 | SSiD |\n|---|---|\n| `pnpm run doc-sync` | **无** → 改为\"改动文档后重跑受影响的 L1\" |\n| `pnpm run lint` | **无** |\n| `git diff --check` | **命令可用，但没有钩子替你跑它**——本仓库**零自定义 git 钩子**（`core.hooksPath` 未配置、默认 hooks 目录零命中；06 §2.2 实测）。**要跑就手动跑** |\n| pre-push hook 只贡献 typecheck | **删**（本仓库无任何钩子） |\n\n> **更正留痕**：本节第一版写的是「`git diff --check` 有 pre-commit 钩子」与「SSiD 有 pre-commit」——**错的**。写本说明时尚未核实钩子状态，是**假设**了 DSH 的形态。06 的实测推翻它：本仓库两个钩子都没有。**这是\"未核实就写\"的又一例**（与 01 §三.1 的「这些文档都不存在」同类）。\n\n**保留**：PR 摘要四要素（新增/合并/部分取代/删除的记录数、主要普查域、有意排除的内容、跑过的检查）；每个合并组要点名新旧 owner 与完全取代的证据。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 4 部件 | §2 的 9 条判据主体、§4、§5、§6（依赖交换 4 条证明） |\n| **改写** | 7 部件 | 引言（载体）、§1（引用）、§3（领域清单）、§7（语料定义）、§9（→ 写决策记录）、§11（降权）、§12（门禁） |\n| **大幅删改** | 1 部件 | §8（5 步 → 1 步，因 SSiD 无状态机/归档/三件套） |\n| **保留 + 标注空白** | 1 部件 | §10（内联 TODO：判据保留，现状零命中须写明） |\n| **删除** | 0 部件 | 无（二级小节 `Audit invariant companions` 删除并救回一句并入 §2） |\n\n> **算术核对**：引言 1 + 一级小节 12 = **13 个部件**；4 + 7 + 1 + 1 = **13** ✓\n\n**净判断**：判据主体（9 条候选定义、4 条拒绝条件、4 条依赖证明、9 条消费者分类骨架）**一条不减**；删改集中在**依赖 DSH 制度的三处**（invariant 二级小节、Agent Note 合并 5 步、门禁命令）。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-find-simplifications/\n├── SKILL.md        # 预计 140–165 行（上游 157，删制度相关、补 SSiD 域与 vendor 约束）\n└── SOURCE.md\n```\n\n**命名**：`ssid-find-simplifications`。\n\n**description 建议**（**只写触发条件**）：\n\n> 在需要找出非显然的简化候选、清除冗余注释或实现导向的文档、为简化提案写决策记录、补内联清理标记，或把另一个分支里值得采纳的简化想法并入当前工作时使用；尤其针对已死、重复、投机、过度构建、加了又删、以及本可交给依赖却手搓的表面。\n\n**依赖声明**：引用 **01**（生命周期与拆除判据）、**03**（涉及行文时）。三者同批进包。\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-find-simplifications |\n| 上游路径 | DSHfork/.agents/skills/dsh-find-simplifications/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 157 行（无 references） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（依赖制度的 3 处删改 + 语料与域本地化） |\n| 依赖 | 引用 01、03（同批进包） |\n\n---\n\n## 七、待确认\n\n1. **要不要给 SSiD 定内联 TODO 的紧迫度语义**？上游有 `FIXME`/`TODO`/`XXX` by urgency（`docs/development.md`），SSiD 无。**不定的话，§7 那条\"想法对但太小\"的出口就是空的**——参见 §三.11。\n2. **`docs/决策/` 要不要引入状态字段**？上游有 `Status: proposed` 与 lifecycle 目录。SSiD 现在靠文件名日期与正文自述。**这是 04 §三.4（决策记录与已交付现实一致）与 05 §三.9（取代标记）共同的前提**，建议一并决定。\n3. **测试目录命名要不要统一**？9 个 `tests/` 与 3 个 `test/` 并存（§2.1）。这是独立于 skill 的清理项，但它直接影响本 skill §7 的语料定义——**适配版会写\"两个都要匹配\"，若统一了则应简化**。\n4. **SSiD 的依赖政策要不要成文**？§三.7 的 4 条证明要求已保留，但\"该不该引入依赖\"的上位政策在 SSiD 无成文记录。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-find-simplifications'\n@(Get-Content \"$up\\SKILL.md\").Count                                        # 157\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count
